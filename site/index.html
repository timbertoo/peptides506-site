<style id="app-style">
  :root {
    --bg: #F3F4F0;
    --surface: #FFFFFF;
    --surface-2: #EAECE6;
    --ink: #1B1F1D;
    --ink-soft: #5C665F;
    --ink-faint: #8A948D;
    --line: #DEE2DA;
    --accent: #2B6E63;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEAE5;
    --good: #2F7D4F;
    --good-soft: #E1F1E6;
    --warn: #A9701F;
    --warn-soft: #F6E9D3;
    --critical: #B23B3B;
    --critical-soft: #F7DEDE;
    --shadow: 0 1px 2px rgba(27,31,29,0.06), 0 6px 20px rgba(27,31,29,0.06);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161A;
      --surface: #1A2023;
      --surface-2: #202B2D;
      --ink: #E9EDE9;
      --ink-soft: #9AA6A0;
      --ink-faint: #6E7A74;
      --line: #2B3538;
      --accent: #5FBFA9;
      --accent-ink: #0B211B;
      --accent-soft: #1D3733;
      --good: #4FAE75;
      --good-soft: #163326;
      --warn: #D2954A;
      --warn-soft: #382c19;
      --critical: #E08787;
      --critical-soft: #3A2222;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161A;
    --surface: #1A2023;
    --surface-2: #202B2D;
    --ink: #E9EDE9;
    --ink-soft: #9AA6A0;
    --ink-faint: #6E7A74;
    --line: #2B3538;
    --accent: #5FBFA9;
    --accent-ink: #0B211B;
    --accent-soft: #1D3733;
    --good: #4FAE75;
    --good-soft: #163326;
    --warn: #D2954A;
    --warn-soft: #382c19;
    --critical: #E08787;
    --critical-soft: #3A2222;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  /* logo.png is black ink on a transparent background (no baked-in white
     box) so it sits flush on --surface/--bg in either theme; in dark mode
     that black ink would go invisible against a dark surface, so flip it
     to white ink here (the alpha channel is untouched by filter). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo-img { filter: invert(1); }
  }
  :root[data-theme="dark"] .brand-logo-img { filter: invert(1); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* Opens at 80% zoom by default (Pedro's preference) — CSS zoom scales
     layout the same way native browser zoom would, so fixed elements
     (sidebar toggle, modals) stay correctly positioned. Anyone can still
     zoom further with their browser's own zoom controls on top of this. */
  html { zoom: 0.8; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, .display {
    font-family: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    font-weight: 600;
    text-wrap: balance;
    margin: 0;
    color: var(--ink);
  }
  .num, .mono, input[type="number"], td.num {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  a { color: inherit; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #app-shell { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 232px;
    flex: 0 0 232px;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px 18px 10px;
  }
  .brand-mark {
    width: 22px; height: 22px;
    border-radius: 5px;
    background: var(--accent);
    flex: none;
    position: relative;
  }
  .brand-mark::after {
    content: "";
    position: absolute; inset: 5px;
    border: 1.6px solid var(--accent-ink);
    border-radius: 2px;
    opacity: 0.9;
  }
  .brand-name {
    font-family: "IBM Plex Serif", serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.2px;
  }
  nav.navlist { display: flex; flex-direction: column; gap: 2px; }
  .navlink {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .navlink:hover { background: var(--surface); color: var(--ink); }
  .navlink.active { background: var(--accent-soft); color: var(--accent); }
  .navlink svg { width: 16px; height: 16px; flex: none; }
  .nav-spacer { flex: 1; }
  .quick-toggles { display: flex; gap: 8px; padding: 0 10px 10px; }
  .seg-toggle {
    display: flex; flex: 1; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 2px; gap: 2px;
  }
  .seg-toggle button {
    flex: 1; display: flex; align-items: center; justify-content: center;
    gap: 4px; border: none; background: transparent; color: var(--ink-soft);
    padding: 6px 4px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; line-height: 1;
  }
  .seg-toggle button svg { width: 15px; height: 15px; }
  .seg-toggle button:hover { color: var(--ink); }
  .seg-toggle button.active { background: var(--accent); color: var(--accent-ink); }
  .sidebar-foot {
    margin-top: 8px;
    padding: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-faint);
  }
  #sync-indicator { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.busy { background: var(--warn); }
  .dot.bad { background: var(--critical); }

  /* ---------- Main ---------- */
  #main { flex: 1; min-width: 0; padding: 28px 36px 60px; max-width: 1180px; }
  .view-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .view-header h1 { font-size: 24px; }
  .view-header .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-danger { color: var(--critical); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-btn {
    background: none; border: none; padding: 0; color: var(--accent);
    font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .link-btn:hover { text-decoration: underline; }

  /* ---------- Cards / stats ---------- */
  .grid { display: grid; gap: 14px; }
  .stat-row { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 22px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat-card .label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
  .stat-card .value { font-family: "IBM Plex Mono", monospace; font-size: 26px; font-weight: 600; margin-top: 6px; }
  .stat-card .value.warn { color: var(--warn); }
  .stat-card .value.critical { color: var(--critical); }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .panel h2 { font-size: 15px; margin-bottom: 4px; }
  .panel .panel-sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 12px; }
  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 880px) { .two-col { grid-template-columns: 1fr; } }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 480px; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .row-click { cursor: pointer; }
  .empty-row td { color: var(--ink-faint); text-align: center; padding: 28px; }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.critical { background: var(--critical-soft); color: var(--critical); }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip .dot { width: 6px; height: 6px; }

  .user-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 10px; font-weight: 700; color: #fff; letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .your-name-row { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .your-name-row .user-chip { width: 20px; height: 20px; font-size: 9px; }

  .best-badge {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--good-soft); color: var(--good); padding: 2px 7px; border-radius: 5px;
  }

  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  .small { font-size: 12px; }

  /* ---------- Expand rows ---------- */
  .expand-toggle { background: none; border: none; cursor: pointer; color: var(--ink-faint); padding: 2px; display: inline-flex; }
  .expand-toggle svg { width: 14px; height: 14px; transition: transform .12s ease; }
  .expand-toggle.open svg { transform: rotate(90deg); }
  .expand-panel { background: var(--surface-2); padding: 14px 20px; border-bottom: 1px solid var(--line); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,14,12,0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 5vh 16px; overflow-y: auto; z-index: 100;
  }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    width: 100%; max-width: 560px;
    padding: 24px 26px 22px;
    margin-bottom: 5vh;
  }
  .modal.wide { max-width: 760px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h2 { font-size: 17px; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--ink-faint); font-size: 20px; line-height: 1; padding: 2px 6px; }
  .modal-close:hover { color: var(--ink); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .modal-error { background: var(--critical-soft); color: var(--critical); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field input[type="text"], .field input[type="number"], .field input[type="email"],
  .field input[type="date"], .field select, .field textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field .hint { font-size: 11.5px; color: var(--ink-faint); margin-top: 4px; }

  .lineitem-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .lineitem-table th { font-size: 10.5px; padding: 4px 6px; text-align: left; color: var(--ink-faint); font-weight: 600; text-transform: uppercase; }
  .lineitem-table td { padding: 4px 6px; vertical-align: top; }
  .lineitem-table select, .lineitem-table input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit; }
  .lineitem-table input.qty, .lineitem-table input.price { text-align: right; font-family: "IBM Plex Mono", monospace; }
  .li-remove { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 16px; padding: 4px; }
  .li-remove:hover { color: var(--critical); }
  .li-total { font-family: "IBM Plex Mono", monospace; text-align: right; padding-top: 8px; white-space: nowrap; }
  .li-hint { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .li-hint.warn { color: var(--warn); }

  .variant-picker { position: relative; }
  .variant-picker-dropdown {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0;
    max-height: 260px; overflow-y: auto; z-index: 30;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); padding: 4px 0;
  }
  .vp-group-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; color: var(--ink-faint); padding: 6px 10px 2px; }
  .vp-option { padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .vp-option:hover, .vp-option.active { background: var(--accent-soft); color: var(--accent); }
  .vp-option-meta { font-size: 11px; color: var(--ink-faint); margin-top: 1px; }
  .vp-option-meta.warn { color: var(--critical); }
  .vp-empty { padding: 8px 10px; font-size: 12.5px; color: var(--ink-faint); }

  .variant-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .variant-row { display: grid; grid-template-columns: 1.1fr 0.6fr 0.5fr 0.6fr 0.6fr auto auto; gap: 8px; align-items: center; }
  .variant-row-head { display: grid; grid-template-columns: 1.1fr 0.6fr 0.5fr 0.6fr 0.6fr auto auto; gap: 8px; margin-bottom: 4px; }
  .variant-row-head span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); }
  .variant-row .v-public-wrap { display: flex; align-items: center; justify-content: center; }
  .variant-row .v-public-wrap input { width: 17px; height: 17px; cursor: pointer; }

  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast {
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 9px; font-size: 13px;
    box-shadow: var(--shadow); max-width: 320px;
  }
  .toast.error { background: var(--critical); color: #fff; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    background: var(--warn-soft); color: var(--warn);
    padding: 10px 16px; border-radius: 9px; font-size: 12.5px; margin-bottom: 18px;
  }

  .price-list { display: flex; flex-direction: column; gap: 6px; }
  .price-list .price-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); }
  .price-list .price-row.best { border-color: var(--good); background: var(--good-soft); }
  .price-row .p-supplier { font-weight: 500; font-size: 13px; }
  .price-row .p-cost { font-family: "IBM Plex Mono", monospace; font-weight: 600; }

  .cat-group { margin-bottom: 10px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-group-title { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin: 12px 0 5px; }
  .cat-group:first-child .cat-group-title { margin-top: 0; }
  .price-row.cat-row { justify-content: flex-start; }
  .cat-check { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; }
  .cat-check input[type="checkbox"] { flex-shrink: 0; width: 15px; height: 15px; }
  .cat-mid { width: 150px; text-align: right; flex-shrink: 0; }
  .cat-row .p-cost { width: 76px; text-align: right; flex-shrink: 0; }
  .cat-qty { width: 52px; text-align: center; padding: 4px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; font-family: "IBM Plex Mono", monospace; flex-shrink: 0; }
  .cat-qty:disabled { opacity: .4; }
  .cat-actions { margin-top: 14px; display: flex; justify-content: flex-end; }
  .link-btn.small { font-size: 14px; flex-shrink: 0; margin-left: 4px; line-height: 1; }

  .prod-cart { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }

function detectDefaultLang(){
  try {
    var nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    return nav.indexOf('es') === 0 ? 'es' : 'en';
  } catch(e){ return 'en'; }
}

var lang = (function(){
  try { return localStorage.getItem(LANG_KEY) || detectDefaultLang(); } catch(e){ return 'en'; }
})();

function t(key){
  var pack = STRINGS[lang] || STRINGS.en;
  if(pack[key] !== undefined) return pack[key];
  if(STRINGS.en[key] !== undefined) return STRINGS.en[key];
  return key;
}
/* t() with {placeholder} substitution, e.g. tf('toast_import_done', {count: 12}). */
function tf(key, vars){
  var s = t(key);
  if(vars) Object.keys(vars).forEach(function(k){ s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}

function setLang(l){
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch(e){}
}

var theme = (function(){
  try { return localStorage.getItem(THEME_KEY) || 'system'; } catch(e){ return 'system'; }
})();

function applyTheme(){
  if(theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(th){
  theme = th;
  try { localStorage.setItem(THEME_KEY, th); } catch(e){}
  applyTheme();
}
applyTheme();

var displayCurrency = (function(){
  try { return localStorage.getItem(CURRENCY_KEY) || 'USD'; } catch(e){ return 'USD'; }
})();
function setDisplayCurrency(c){
  displayCurrency = c;
  try { localStorage.setItem(CURRENCY_KEY, c); } catch(e){}
}

/* Display name now comes from the signed-in account (profiles.display_name)
   instead of a per-browser localStorage guess — same idea as before ("who
   did this"), just backed by a real account instead of free text anyone
   could type. */
var currentUserName = '';
function setCurrentUserName(name){
  var trimmed = (name || '').trim();
  if(!trimmed || !currentSession) return Promise.resolve();
  currentUserName = trimmed;
  if(currentProfile) currentProfile.display_name = trimmed;
  return sb.from('profiles').update({ display_name: trimmed }).eq('id', currentSession.user.id).then(function(res){
    if(res.error){ toast(t('toast_save_error_generic'), true); }
  });
}

/* Exchange rate (colones per 1 USD) is a shared business fact Pedro sets
   himself, so it lives in state.settings — part of the published/synced
   document, not a per-viewer preference. */
function exchangeRate(){
  var r = state.settings && Number(state.settings.exchangeRate);
  return (r && r > 0) ? r : null;
}
/* Canonical amounts are always stored in USD. These two helpers convert to
   and from whatever currency is currently selected for display/entry. */
function toDisplayAmount(usd){
  usd = Number(usd) || 0;
  if(displayCurrency === 'CRC'){
    var r = exchangeRate();
    if(r) return usd * r;
  }
  return usd;
}
function fromDisplayAmount(val){
  val = Number(val) || 0;
  if(displayCurrency === 'CRC'){
    var r = exchangeRate();
    if(r) return val / r;
  }
  return val;
}
/* Rounded plain number (not a formatted string) for populating a numeric
   input's value attribute. */
function inputAmount(usd){
  var v = toDisplayAmount(usd);
  return displayCurrency === 'CRC' ? Math.round(v) : Math.round(v * 100) / 100;
}

/* Historical daily colones-per-US$1 rate for a SPECIFIC date, used only by
   the sales-order line-item currency picker (separate from the manual
   Settings exchange rate above, which is a single "today" rate). A
   historical rate never changes once published, so every lookup is cached
   forever in localStorage — after the first time a given date is looked
   up, it never hits the network again. Requires a free currencyapi.com key
   pasted into Settings; rejects with {code:'no_key'} if that's missing. */
function fxCacheKey(dateISO){ return 'fx_usd_crc_' + dateISO; }
/* Synchronous cache peek — lets a first render show the right number
   immediately when a date's rate is already known, instead of always
   flashing $-only until the (async, even if cache-hit) fetch resolves. */
function fxCachedRate(dateISO){
  try {
    var v = dateISO && localStorage.getItem(fxCacheKey(dateISO));
    return v ? Number(v) : null;
  } catch(e){ return null; }
}
function fetchHistoricalRate(dateISO){
  return new Promise(function(resolve, reject){
    if(!dateISO){ reject({code:'bad_date'}); return; }
    try {
      var cached = localStorage.getItem(fxCacheKey(dateISO));
      if(cached){ resolve(Number(cached)); return; }
    } catch(e){ /* localStorage unavailable — just skip the cache */ }
    var key = state.settings && state.settings.currencyApiKey;
    if(!key){ reject({code:'no_key'}); return; }
    var url = 'https://api.currencyapi.com/v3/historical?apikey=' + encodeURIComponent(key) +
      '&date=' + encodeURIComponent(dateISO) + '&base_currency=USD&currencies=CRC';
    fetch(url).then(function(res){ return res.json(); }).then(function(json){
      var rate = json && json.data && json.data.CRC && Number(json.data.CRC.value);
      if(!rate || !(rate > 0)){ reject({code:'bad_response', detail: json}); return; }
      try { localStorage.setItem(fxCacheKey(dateISO), String(rate)); } catch(e){}
      resolve(rate);
    }).catch(function(err){ reject({code:'fetch_failed', detail: err}); });
  });
}

/* ------------------------------ utils --------------------------------- */

function uid(prefix){
  var rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,8) : (Date.now().toString(36)+Math.random().toString(36).slice(2,8));
  return prefix + '_' + rnd;
}
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* The real Peptides 506 logo — the same file already used on the customer
   catalog's header/age-gate (product-images/logo.png), which sits right
   next to this page's own index.html once deployed, so the relative path
   resolves the same way here as it does there. Falls back to the old
   plain square + text if the image can't load, exactly like the customer
   catalog already does for the same file, rather than showing a broken
   image icon. */
function brandLogoHTML(heightPx){
  /* logo.png is a transparent-background PNG (black ink) so it sits flush
     on whatever surface it's placed on instead of showing its own little
     white/cream box — .brand-logo-img gets inverted to white ink in dark
     mode (see CSS) so it stays visible there instead of going black-on-
     black. */
  return '<span class="brand-logo-wrap" style="display:inline-flex;align-items:center">' +
    '<img class="brand-logo-img" src="product-images/logo.png" alt="Peptides 506" style="height:' + heightPx + 'px;width:auto;display:block" ' +
      'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'inline-flex\';">' +
    '<span style="display:none;align-items:center;gap:8px"><span class="brand-mark"></span><span class="brand-name">Peptides 506</span></span>' +
  '</span>';
}
function fmtMoney(n){
  var amt = toDisplayAmount(n);
  if(displayCurrency === 'CRC'){
    return '\u20a1' + Math.round(amt).toLocaleString(undefined, {maximumFractionDigits:0});
  }
  return '$' + amt.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
/* Always both, regardless of the app's display-currency setting \u2014 used
   for sales-order totals so Pedro doesn't have to flip Settings back and
   forth to see a number in the other currency. `rate` (colones per US$1)
   is normally the order's own date-specific looked-up rate, passed in by
   the caller; falls back to the manual Settings rate, then to $-only if
   neither is available. */
function fmtMoneyBoth(usd, rate){
  usd = Number(usd) || 0;
  var usdStr = '$' + usd.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  var r = rate || exchangeRate();
  if(!r) return usdStr;
  var crcStr = '\u20a1' + Math.round(usd * r).toLocaleString(undefined, {maximumFractionDigits:0});
  return usdStr + '  \u00b7  ' + crcStr;
}
function fmtDate(d){
  if(!d) return '—';
  try {
    var dt = new Date(d + 'T00:00:00');
    if(isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  } catch(e){ return d; }
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
/* Tags a record with who created/last-touched it, using the signed-in
   account's display name. If an existing record predates this feature (no
   createdBy yet), the next edit backfills createdBy with whoever made that
   edit, as the closest available answer. */
function stampRecord(rec, isNew){
  if(isNew || !rec.createdBy){
    rec.createdBy = currentUserName || '';
    rec.createdAt = rec.createdAt || todayISO();
  }
  rec.updatedBy = currentUserName || '';
  rec.updatedAt = todayISO();
}
/* Small colored initials chip for "who" columns/notes. Same name always
   gets the same color (hashed), so a person is visually consistent across
   the app without needing a saved color per user. */
var AVATAR_COLORS = ['#2B6E63','#8A5A44','#5A5FA6','#A6465A','#3E7A9E','#8E7B2E','#6E4E9E','#4E8E6E'];
function avatarColorFor(name){
  var h = 0;
  for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initialsFor(name){
  var parts = name.trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
function userChipHTML(name){
  if(!name) return '<span class="faint small">—</span>';
  return '<span class="user-chip" style="background:' + avatarColorFor(name) + '" title="' + esc(name) + '">' + esc(initialsFor(name)) + '</span>';
}
/* "Created by X on <date> · Last updated by Y on <date>" line shown inside
   an order's edit modal. Omits the created/updated half entirely if that
   name was never captured (records from before this feature shipped, or
   someone who never set a name), rather than showing a misleading blank. */
function recordAttributionHTML(rec){
  var parts = [];
  if(rec.createdBy) parts.push(tf('attribution_created', { name: rec.createdBy, date: fmtDate(rec.createdAt) }));
  if(rec.updatedBy && (rec.updatedBy !== rec.createdBy || rec.updatedAt !== rec.createdAt)) parts.push(tf('attribution_updated', { name: rec.updatedBy, date: fmtDate(rec.updatedAt) }));
  if(!parts.length) return '';
  return '<p class="muted small" style="margin:-6px 0 14px">' + esc(parts.join(' · ')) + '</p>';
}

/* Best-effort tracking link for the handful of couriers whose public
   tracking URLs are simple query params. Returns null (plain text only)
   for anything else — there's no attempt to guess unknown carriers. */
function trackingUrl(carrier, trackingNumber){
  if(!trackingNumber) return null;
  var c = String(carrier || '').toLowerCase();
  var num = encodeURIComponent(trackingNumber.trim());
  if(!trackingNumber.trim()) return null;
  if(c.indexOf('ups') !== -1) return 'https://www.ups.com/track?tracknum=' + num;
  if(c.indexOf('fedex') !== -1) return 'https://www.fedex.com/fedextrack/?trknbr=' + num;
  if(c.indexOf('dhl') !== -1) return 'https://www.dhl.com/en/express/tracking.html?AWB=' + num;
  if(c.indexOf('usps') !== -1) return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + num;
  return null;
}
/* Small "carrier — tracking number" cell for the PO/SO list tables, linked
   out to the carrier's own tracking page when trackingUrl() recognizes it.
   data-stop-row-click keeps a click on the link from also opening the
   order (the whole row is otherwise a click target). */
function trackingCellHTML(order){
  var parts = [];
  if(order.carrier) parts.push(esc(order.carrier));
  if(order.trackingNumber) parts.push(esc(order.trackingNumber));
  if(!parts.length) return '<span class="faint">' + esc(t('no_tracking')) + '</span>';
  var label = parts.join(' — ');
  var url = trackingUrl(order.carrier, order.trackingNumber);
  if(url) return '<a href="' + esc(url) + '" target="_blank" rel="noopener" data-stop-row-click title="' + esc(t('track_link')) + '">' + label + '</a>';
  return '<span class="muted">' + label + '</span>';
}
function byId(arr, id){ return arr.find(function(x){ return x.id === id; }); }
function sortBy(arr, fn){ return arr.slice().sort(function(a,b){ var x=fn(a),y=fn(b); return x<y?-1:x>y?1:0; }); }

/* --------------------------- derived data ------------------------------ */

function productName(productId){ var p = byId(state.products, productId); return p ? p.name : '(deleted product)'; }
function variantLabel(v){ return v ? v.label : ''; }
function variantDisplay(v){
  if(!v) return '(deleted variant)';
  var p = byId(state.products, v.productId);
  return (p ? p.name : '?') + ' — ' + v.label;
}
function variantsForProduct(productId){ return state.variants.filter(function(v){ return v.productId === productId; }); }

/* Distinct, already-typed values offered as <datalist> suggestions so a new
   product's name/category can be picked from what's been entered before
   without forcing it — free typing still works. */
function distinctValues(getter){
  var seen = {}, out = [];
  sortBy(state.products, function(p){ return (getter(p) || '').toLowerCase(); }).forEach(function(p){
    var val = (getter(p) || '').trim();
    if(val && !seen[val.toLowerCase()]){ seen[val.toLowerCase()] = true; out.push(val); }
  });
  return out;
}
function distinctProductNames(){ return distinctValues(function(p){ return p.name; }); }
function distinctCategories(){ return distinctValues(function(p){ return productCategory(p); }); }

/* Each purchase-order line's qty is a number of PURCHASED UNITS (kits), not
   individual vials — e.g. buying qty 2 of a variant whose unitsPerPurchase
   is 10 means 20 vials actually land in stock. Sales-order qty is already
   in individual vials (that's what's shipped to a customer), so it's
   subtracted 1-for-1 with no conversion. */
function unitsPerPurchaseForVariant(variantId){
  var v = byId(state.variants, variantId);
  return (v && Number(v.unitsPerPurchase) > 0) ? Number(v.unitsPerPurchase) : 10;
}
function stockForVariant(variantId){
  /* Both halves come from the server (see refreshVariantStock), never
     computed from local poLineItems/soLineItems — a seller only ever
     loads their OWN purchase/sales data (or none, for purchases), so
     summing locally would understate what's actually been received or
     sold and could show stock that isn't really there. */
  var inQty = (state.variantReceivedUnits && state.variantReceivedUnits[variantId]) || 0;
  var outQty = (state.variantSoldUnits && state.variantSoldUnits[variantId]) || 0;
  return inQty - outQty;
}

/* Fetches total received AND total sold vials per variant via two
   security-definer DB functions, so stock works the same whether the
   caller is an admin, regular staff, or a seller whose RLS hides
   purchase_orders/po_line_items entirely and restricts so_line_items to
   just their own sales orders. Neither function ever resolves supplier or
   customer identity, or a price — only a variant id and a count. */
function refreshVariantStock(){
  if(!sb) return Promise.resolve();
  return Promise.all([
    sb.rpc('variant_received_units'),
    sb.rpc('variant_sold_units')
  ]).then(function(results){
    var receivedRes = results[0], soldRes = results[1];
    if(receivedRes.error) throw receivedRes.error;
    if(soldRes.error) throw soldRes.error;
    var receivedMap = {};
    (receivedRes.data || []).forEach(function(r){ receivedMap[r.variant_id] = Number(r.units) || 0; });
    var soldMap = {};
    (soldRes.data || []).forEach(function(r){ soldMap[r.variant_id] = Number(r.units) || 0; });
    state.variantReceivedUnits = receivedMap;
    state.variantSoldUnits = soldMap;
  });
}

/* Fetches remaining vials per PURCHASE-ORDER LINE (not just per variant) via
   `po_line_remaining_units` — the number both the automatic FIFO picker
   (regular sales) and the manual Source PO picker (Internal Use) rely on to
   know what's actually left in each batch. Same security-definer reasoning
   as refreshVariantStock: a seller gets accurate numbers without ever
   seeing supplier identity or cost. */
function refreshPOLineRemaining(){
  if(!sb) return Promise.resolve();
  return sb.rpc('po_line_remaining_units').then(function(res){
    if(res.error) throw res.error;
    state.poLineRemaining = (res.data || []).map(function(r){
      return { poLineItemId: r.po_line_item_id, variantId: r.variant_id, poDate: r.po_date, remaining: Number(r.remaining) || 0 };
    });
  });
}
function remainingForPOLine(poLineItemId){
  var row = state.poLineRemaining.find(function(r){ return r.poLineItemId === poLineItemId; });
  return row ? row.remaining : 0;
}
/* Greedily draws `qtyNeeded` vials of a variant from the oldest received PO
   batch(es) first. `workingRemaining` is a plain object the caller keeps
   across every line of the same sales order being saved, so two lines of
   the same variant on one order don't both think the same units are free.
   Returns the picks made; if PO stock genuinely falls short, whatever's
   left over is simply not allocated (soft — mirrors the existing
   not-enough-on-hand warning elsewhere, never blocks a save). */
function allocateFIFOForVariant(variantId, qtyNeeded, workingRemaining){
  var candidates = sortBy(state.poLineRemaining.filter(function(r){ return r.variantId === variantId; }), function(r){ return r.poDate; });
  var picks = [];
  var remaining = Number(qtyNeeded) || 0;
  candidates.forEach(function(c){
    if(remaining <= 0) return;
    var avail = workingRemaining.hasOwnProperty(c.poLineItemId) ? workingRemaining[c.poLineItemId] : c.remaining;
    if(avail <= 0) return;
    var take = Math.min(avail, remaining);
    picks.push({ poLineItemId: c.poLineItemId, qty: take });
    workingRemaining[c.poLineItemId] = avail - take;
    remaining -= take;
  });
  return picks;
}

function supplierPricesForVariant(variantId){
  var rows = state.supplierProducts.filter(function(sp){ return sp.variantId === variantId; }).map(function(sp){
    var s = byId(state.suppliers, sp.supplierId);
    return { sp: sp, supplierId: sp.supplierId, supplierName: s ? s.name : '(deleted supplier)', unitCost: Number(sp.unitCost)||0, isPreferred: !!sp.isPreferred, updatedAt: sp.updatedAt };
  });
  return sortBy(rows, function(r){ return r.unitCost; });
}

function catalogEntry(supplierId, variantId){
  return state.supplierProducts.find(function(sp){ return sp.supplierId === supplierId && sp.variantId === variantId; });
}

function ensureCatalogEntry(supplierId, variantId, unitCost){
  var existing = catalogEntry(supplierId, variantId);
  if(existing){
    existing.unitCost = Number(unitCost)||0;
    existing.updatedAt = todayISO();
    return existing;
  }
  var row = { id: uid('sp'), supplierId: supplierId, variantId: variantId, unitCost: Number(unitCost)||0, isPreferred: false, updatedAt: todayISO() };
  state.supplierProducts.push(row);
  return row;
}

/* Shared by both the per-line discount (a supplier discounting just one
   item) and the whole-order discount below — either a flat dollar amount,
   or a percentage of whatever subtotal it's applied to. */
function discountAmountFor(subtotal, discountType, discountValue){
  if(discountType === 'percent') return subtotal * ((Number(discountValue)||0) / 100);
  return Number(discountValue) || 0;
}
/* A line's own discount (some suppliers discount just one item, not the
   whole order) comes off that line's qty×cost before it ever reaches the
   order subtotal — so it stacks cleanly with an order-level discount if
   Pedro ever needs both on the same order. */
function poLineNetTotal(li){
  var gross = (Number(li.qty)||0) * (Number(li.unitCost)||0);
  return gross - discountAmountFor(gross, li.discountType, li.discountValue);
}
/* A supplier discount on the whole order is off the products themselves
   (after any per-line discounts, before shipping, wire fees, or local
   transport) — either a flat dollar amount, or a percentage of the
   (already line-discounted) product subtotal. */
function poDiscountAmount(po, subtotal){
  return discountAmountFor(subtotal, po.discountType, po.discountValue);
}
function poTotal(po){
  var subtotal = state.poLineItems.filter(function(li){ return li.poId === po.id; })
    .reduce(function(sum, li){ return sum + poLineNetTotal(li); }, 0);
  return subtotal - poDiscountAmount(po, subtotal)
    + (Number(po.shippingCost)||0) + (Number(po.wireTransferCost)||0) + (Number(po.transportationCost)||0);
}
function soSubtotal(so){
  return state.soLineItems.filter(function(li){ return li.soId === so.id; })
    .reduce(function(sum, li){ return sum + (Number(li.qty)||0) * (Number(li.unitPrice)||0); }, 0);
}
function soDiscountAmount(so){
  var pct = Math.min(100, Math.max(0, Number(so.discountPct)||0));
  return soSubtotal(so) * pct / 100;
}
function soTotal(so){
  return soSubtotal(so) - soDiscountAmount(so) + (Number(so.shippingCost)||0);
}
/* Total vials a purchase order actually brought in, across all its lines
   (kits × units-per-purchase) — the base a PO's shipping/wire/transport
   overhead gets spread across. */
function poTotalVials(po){
  return state.poLineItems.filter(function(li){ return li.poId === po.id; })
    .reduce(function(sum, li){ return sum + (Number(li.qty)||0) * unitsPerPurchaseForVariant(li.variantId); }, 0);
}
/* The real, fully-loaded cost of one vial from a SPECIFIC purchase order —
   that line's own product cost per vial, plus an even share of the whole
   order's shipping + wire fee + transportation (minus any order-level
   discount), spread across every vial the order brought in, not just this
   line's. Matches Pedro's own example: 10 vials, $100 product + $50 + $40 +
   $50 overhead = $240 total / 10 vials = $24/vial. Used only to value
   Internal Use records (see openInternalUseModal / receivedPOLinesForVariant)
   — regular customer sales keep pricing off the supplier catalog average,
   not a specific order's landed cost (that was a deliberate scope choice,
   not an oversight). */
function poLandedCostPerUnit(po, li){
  var totalVials = poTotalVials(po);
  var lineVials = (Number(li.qty)||0) * unitsPerPurchaseForVariant(li.variantId);
  if(!totalVials || !lineVials) return 0;
  var subtotal = state.poLineItems.filter(function(x){ return x.poId === po.id; })
    .reduce(function(sum, x){ return sum + poLineNetTotal(x); }, 0);
  var overhead = (Number(po.shippingCost)||0) + (Number(po.wireTransferCost)||0) + (Number(po.transportationCost)||0)
    - poDiscountAmount(po, subtotal);
  return (poLineNetTotal(li) / lineVials) + (overhead / totalVials);
}
/* Every received PO that actually contains this variant, each paired with
   its own landed cost/vial — the choices offered by the Source PO picker
   on an Internal Use sales-order line. Most recent order first. */
function receivedPOLinesForVariant(variantId){
  var out = [];
  state.purchaseOrders.filter(function(po){ return po.status === 'received'; }).forEach(function(po){
    state.poLineItems.filter(function(li){ return li.poId === po.id && li.variantId === variantId; }).forEach(function(li){
      out.push({ po: po, li: li, costPerUnit: poLandedCostPerUnit(po, li) });
    });
  });
  return sortBy(out, function(x){ return x.po.date; }).reverse();
}
function supplierTotalPurchased(supplierId){
  var total = 0;
  state.purchaseOrders.filter(function(po){ return po.supplierId === supplierId && po.status === 'received'; })
    .forEach(function(po){ total += poTotal(po); });
  return total;
}
function customerTotalPurchased(customerId){
  var total = 0;
  state.salesOrders.filter(function(so){ return so.customerId === customerId && so.status === 'completed'; })
    .forEach(function(so){ total += soTotal(so); });
  return total;
}

function setSyncIndicator(mode){
  var dot = document.getElementById('sync-dot');
  var label = document.getElementById('sync-label');
  if(!dot || !label) return;
  dot.className = 'dot' + (mode === 'busy' ? ' busy' : mode === 'bad' ? ' bad' : '');
  var labels = { ok: t('sync_saved'), busy: t('sync_saving'), bad: t('sync_save_failed') };
  label.textContent = labels[mode] || labels.ok;
}

function toast(msg, isError){
  var root = document.getElementById('toast-root');
  if(!root) return;
  var el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  root.appendChild(el);
  while(root.children.length > 3){ root.removeChild(root.firstChild); }
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 3200);
}

/* --- row <-> record mappers: DB snake_case columns <-> app camelCase fields.
   created_by/updated_by (uuid) ride along on each record as createdById/
   updatedById purely so a later save doesn't reassign the original
   creator to whoever edits next; nothing else in the app reads them. --- */
function supplierToRow(rec, uid, name){
  return { id: rec.id, name: rec.name || '', contact: rec.contact || null, phone: rec.phone || null,
    email: rec.email || null, whatsapp: rec.whatsapp || null, address: rec.address || null, city: rec.city || null,
    created_by: rec.createdById || uid, created_by_name: rec.createdBy || name, created_at: rec.createdAt || todayISO(),
    updated_by: uid, updated_by_name: name, updated_at: rec.updatedAt || todayISO() };
}
function rowToSupplier(r){
  return { id:r.id, name:r.name, contact:r.contact, phone:r.phone, email:r.email, whatsapp:r.whatsapp, address:r.address, city:r.city,
    createdBy:r.created_by_name||'', createdAt:r.created_at, updatedBy:r.updated_by_name||'', updatedAt:r.updated_at,
    createdById:r.created_by, updatedById:r.updated_by };

/* [dbTable, stateKey, toRow, fromRow] — order matters for FK dependencies
   on upsert (parents before children). */
var MASTER_TABLES = [
  ['suppliers','suppliers', supplierToRow, rowToSupplier],
  ['customers','customers', customerToRow, rowToCustomer],
  ['products','products', productToRow, rowToProduct],
  ['variants','variants', variantToRow, rowToVariant],
  ['supplier_products','supplierProducts', spToRow, rowToSP],
  ['purchase_orders','purchaseOrders', poToRow, rowToPO],
  ['sales_orders','salesOrders', soToRow, rowToSO]
];

function loadAllFromSupabase(){
  var queries = MASTER_TABLES.map(function(t){ return sb.from(t[0]).select('*'); });
  queries.push(sb.from('po_line_items').select('*'));
  queries.push(sb.from('so_line_items').select('*'));
  queries.push(sb.from('so_line_item_allocations').select('*'));
  queries.push(sb.from('settings').select('*').eq('id', 1).maybeSingle());
  queries.push(sb.from('profiles').select('*').eq('id', currentSession.user.id).maybeSingle());
  return Promise.all(queries).then(function(results){
    for(var i=0;i<results.length;i++){ if(results[i].error) throw results[i].error; }
    var next = emptyState();
    MASTER_TABLES.forEach(function(t, i){ next[t[1]] = (results[i].data || []).map(t[3]); });
    var base = MASTER_TABLES.length;
    next.poLineItems = (results[base].data || []).map(rowToPOLine);
    next.soLineItems = (results[base+1].data || []).map(rowToSOLine);
    next.soLineItemAllocations = (results[base+2].data || []).map(rowToSOAllocation);
    var settingsRow = results[base+3].data;
    next.settings = { exchangeRate: settingsRow ? settingsRow.exchange_rate : null,
      currencyApiKey: settingsRow ? settingsRow.currency_api_key : null };
    state = next;
    currentProfile = results[base+4].data || null;
    isAdmin = !!(currentProfile && currentProfile.is_admin);
    isSeller = !!(currentProfile && currentProfile.is_seller);
    currentUserName = (currentProfile && currentProfile.display_name) || (currentSession.user.email || '').split('@')[0];
    return Promise.all([
      refreshVariantStock().catch(function(){ /* stock stays at whatever it was (likely empty) — not fatal */ }),
      refreshPOLineRemaining().catch(function(){ /* same — stays empty rather than failing the whole load */ })
    ]);
  });
}

/* Every save does a full sync: upsert everything currently in `state`, then
   prune any DB row whose id is no longer present (covers every delete path
   in the app generically, without touching each delete handler). Line
   items are simpler — always replaced wholesale, matching how the app
   already treats them (see poLineItems/soLineItems). */
function syncToSupabase(){
  var uid = currentSession.user.id;
  var name = currentUserName || '';

  /* supplier_products (catalog prices) can only be written by admins — the
     database itself enforces this. A non-admin session never has local
     changes to that table (the UI hides all price-editing from them), so
     skip it entirely for them rather than attempting a write that RLS will
     reject and failing the *whole* save, even for an unrelated edit like a
     PO status change. */
  var tablesToSync = isAdmin ? MASTER_TABLES : MASTER_TABLES.filter(function(t){ return t[0] !== 'supplier_products'; });

  function upsertTable(table, rows){
    if(!rows.length) return Promise.resolve();
    return sb.from(table).upsert(rows, { onConflict: 'id' }).then(function(res){ if(res.error) throw res.error; });
  }
  function pruneTable(table, keepIds){
    return sb.from(table).select('id').then(function(res){
      if(res.error) throw res.error;
      var toDelete = (res.data || []).map(function(r){ return r.id; }).filter(function(id){ return keepIds.indexOf(id) === -1; });
      if(!toDelete.length) return null;
      return sb.from(table).delete().in('id', toDelete).then(function(res2){ if(res2.error) throw res2.error; });
    });
  }
  return tablesToSync.reduce(function(p, t){
      return p.then(function(){ return upsertTable(t[0], state[t[1]].map(function(rec){ return t[2](rec, uid, name); })); });
    }, Promise.resolve())
    .then(function(){
      return tablesToSync.reduce(function(p, t){
        return p.then(function(){ return pruneTable(t[0], state[t[1]].map(function(r){ return r.id; })); });
      }, Promise.resolve());
    })
    /* Line items used to be a hard delete-everything-then-insert-everything
       on every save (replaceAll). That's fine for one save at a time, but
       two saves landing close together (a double-click, or two people
       saving around the same moment) could race: one save's DELETE could
       run between the other save's DELETE and INSERT, so its INSERT then
       tries to add ids that already exist — Postgres rejects that as a
       duplicate key and the whole save fails. Upsert+prune (the same
       pattern already used above for every other table) never has that
       gap — a matching id updates in place instead of erroring. */
    .then(function(){ return upsertTable('po_line_items', state.poLineItems.map(poLineToRow)); })
    .then(function(){ return pruneTable('po_line_items', state.poLineItems.map(function(r){ return r.id; })); })
    .then(function(){ return upsertTable('so_line_items', state.soLineItems.map(soLineToRow)); })
    /* Allocations reference both po_line_items and so_line_items, so they
       upsert only after both exist, and prune before either parent table
       does (rather than leaning on the FK cascade to clean them up). */
    .then(function(){ return upsertTable('so_line_item_allocations', state.soLineItemAllocations.map(soAllocationToRow)); })
    .then(function(){ return pruneTable('so_line_item_allocations', state.soLineItemAllocations.map(function(r){ return r.id; })); })
    .then(function(){ return pruneTable('so_line_items', state.soLineItems.map(function(r){ return r.id; })); })
    .then(function(){
      return sb.from('settings').update({ exchange_rate: state.settings.exchangeRate, currency_api_key: state.settings.currencyApiKey }).eq('id', 1).then(function(res){
        if(res.error) throw res.error;
      });
    });
}

var pendingPersist = false;
function persist(){
  if(!currentSession){ render(); return; }
  /* A save already in flight — e.g. a double-click on Save, or a save
     triggered again before the last one finished — shouldn't kick off a
     second overlapping sync (that's what caused the po_line_items
     duplicate-key errors). Just remember there's newer state to push once
     the current save finishes. */
  if(saving){ pendingPersist = true; render(); return; }
  saving = true;
  pendingPersist = false;
  setSyncIndicator('busy');
  syncToSupabase().then(function(){
    return Promise.all([
      refreshVariantStock().catch(function(){ /* keep previous stock map rather than fail the save */ }),
      refreshPOLineRemaining().catch(function(){ /* keep previous remaining map rather than fail the save */ })
    ]);
  }).then(function(){
    saving = false;
    setSyncIndicator('ok');
    render();
    if(pendingPersist){ pendingPersist = false; persist(); }
  }).catch(function(err){
    saving = false;
    console.error('save failed', err);
    toast(t('toast_save_error_generic') + (err && err.message ? ' (' + err.message + ')' : ''), true);
    setSyncIndicator('bad');
    loadAllFromSupabase().then(render).catch(function(){ render(); });
  });
  render();
}

/* ------------------------------ auth boot -------------------------------- */

function enterApp(){
  /* A real sign-in just happened — close the sign-in popup if it's still
     open (it normally is: the merged public build never tears it down on
     its own), and make sure the admin app's own 80% zoom is in effect
     rather than whatever the public catalog view behind it was using. */
  closeAuthModal();
  document.documentElement.style.zoom = '';
  renderLoadingScreen();
  loadAllFromSupabase().then(function(){
    render();
  }).catch(function(err){
    console.error('initial load failed', err);
    renderLoadingScreen(true);
  });
}

/* Single place that resets local auth state and shows the "no session"
   screen -- used by both the real SIGNED_OUT event AND signOut()'s own
   fallback below, so there's exactly one thing for the merged customer
   build (merge_public_entrance.py) to repoint to renderCustomerCatalog(). */
function afterSignOut(){
  currentSession = null; currentProfile = null; isAdmin = false; isSeller = false; state = emptyState();
  renderCustomerCatalog();
}

function signOut(){
  /* sb.auth.signOut() normally fires a SIGNED_OUT event that bootAuth's
     listener below picks up -- but if that request stalls or the event
     never arrives (flaky connection, a browser tab that's been open a
     while), the button just looked broken with no feedback at all. Reset
     the UI directly once the call settles (success OR failure) instead of
     depending solely on the event, plus a short timeout as a last resort. */
  var done = false;
  function finish(){ if(done) return; done = true; afterSignOut(); }
  setTimeout(finish, 1500);
  sb.auth.signOut().then(finish).catch(function(err){ console.error('sign out request failed', err); finish(); });
}

function bootAuth(){
  if(!sb){ renderAuthScreen(t('auth_lib_failed')); return; }
  sb.auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_IN' && session){
      currentSession = session;
      enterApp();
    } else if(event === 'SIGNED_OUT'){
      afterSignOut();
    }
  });
  sb.auth.getSession().then(function(res){
    currentSession = res.data && res.data.session;
    if(currentSession){ enterApp(); } else { afterSignOut(); }
  });
}

/* --------------------------- modal management --------------------------- */

var modalStack = [];

/* Each stack entry owns its own persistent DOM (backdrop). Closing a modal
   removes ONLY that modal's DOM node — the modals beneath it are never
   re-rendered, so their closures/DOM references (e.g. a line-item table
   being built up) stay valid across a nested modal (like "+ New product")
   opening and closing on top of them. */

function closeTopModal(){
  var entry = modalStack.pop();
  if(entry && entry.backdrop && entry.backdrop.parentNode) entry.backdrop.parentNode.removeChild(entry.backdrop);
  document.body.style.overflow = modalStack.length ? 'hidden' : '';
}
function closeAllModals(){
  while(modalStack.length) closeTopModal();
}
function pushModal(def){
  /* def: { title, wide, body(container, setError, close) } */
  var root = document.getElementById('modal-root');
  var idx = modalStack.length;
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style.zIndex = 100 + idx;
  var closeThis = function(){
    var pos = modalStack.indexOf(entry);
    if(pos === -1) return;
    /* Only valid to close if this is the topmost modal (enforced by UI: a
       lower modal is fully covered, its own controls are unreachable). */
    while(modalStack.length > pos) closeTopModal();
  };
  /* Deliberately NOT closing on an outside/backdrop click — these are all
     data-entry forms (orders, products, etc.) and an accidental click just
     outside the box used to silently discard everything typed so far.
     Closing now requires the explicit × button or a Cancel/Save action. */
  var modal = document.createElement('div');
  modal.className = 'modal' + (def.wide ? ' wide' : '');
  modal.innerHTML =
    '<div class="modal-head"><h2>' + esc(def.title) + '</h2><button class="modal-close" aria-label="Close" data-act="close">×</button></div>' +
    '<div class="modal-error" style="display:none"></div>' +
    '<div class="modal-body"></div>';
  modal.querySelector('[data-act="close"]').addEventListener('click', closeThis);
  backdrop.appendChild(modal);
  root.appendChild(backdrop);
  document.body.style.overflow = 'hidden';

  var entry = { def: def, backdrop: backdrop };
  modalStack.push(entry);

  var bodyEl = modal.querySelector('.modal-body');
  var errEl = modal.querySelector('.modal-error');
  def.body(bodyEl, function(msg){
    errEl.textContent = msg;
    errEl.style.display = msg ? 'block' : 'none';
  }, closeThis);
}

function fieldHTML(id, labelText, inputHTML, hint){
  return '<div class="field"><label for="' + id + '">' + esc(labelText) + '</label>' + inputHTML + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
}

          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save">' + esc(existing ? t('save_changes_btn') : t('add_supplier_btn')) + '</button>' +
        '</div>';
      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        var used = state.supplierProducts.some(function(sp){ return sp.supplierId === existing.id; }) ||
                   state.purchaseOrders.some(function(po){ return po.supplierId === existing.id; });
        if(used){ setError(t('err_supplier_in_use')); return; }
        state.suppliers = state.suppliers.filter(function(s){ return s.id !== existing.id; });
        close(); persist(); toast(t('toast_supplier_deleted'));
      });
      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        var name = el.querySelector('#sup-name').value.trim();
        if(!name){ setError(t('err_enter_supplier_name')); return; }
        var rec = existing || { id: uid('sup') };
        rec.name = name;
        rec.contact = el.querySelector('#sup-contact').value.trim();
        rec.phone = el.querySelector('#sup-phone').value.trim();
        rec.email = el.querySelector('#sup-email').value.trim();
        rec.whatsapp = el.querySelector('#sup-whatsapp').value.trim();
        rec.address = el.querySelector('#sup-address').value.trim();
        rec.city = el.querySelector('#sup-city').value.trim();
        stampRecord(rec, !existing);
        if(!existing) state.suppliers.push(rec);
        close(); persist(); toast(existing ? t('toast_supplier_updated') : t('toast_supplier_added'));
        if(onDone) onDone(rec);
      });
    }
  });
}

        fieldHTML('cus-name', t('field_name'), '<input type="text" id="cus-name" value="' + esc(existing && existing.name) + '" placeholder="e.g. Jordan Reyes">') +
        '<div class="field-row">' +
          fieldHTML('cus-phone', t('field_phone'), '<input type="text" id="cus-phone" value="' + esc(existing && existing.phone) + '">') +
          fieldHTML('cus-email', t('field_email'), '<input type="email" id="cus-email" value="' + esc(existing && existing.email) + '">') +
        '</div>' +
        fieldHTML('cus-address', t('field_address'), '<input type="text" id="cus-address" value="' + esc(existing && existing.address) + '">') +
        '<div class="modal-foot">' +
          ((existing && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('delete_customer_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save">' + esc(existing ? t('save_changes_btn') : t('add_customer_btn')) + '</button>' +
        '</div>';
      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        var used = state.salesOrders.some(function(so){ return so.customerId === existing.id; });
        if(used){ setError(t('err_customer_in_use')); return; }
        state.customers = state.customers.filter(function(c){ return c.id !== existing.id; });
        close(); persist(); toast(t('toast_customer_deleted'));
      });
      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        var name = el.querySelector('#cus-name').value.trim();
        if(!name){ setError(t('err_enter_customer_name')); return; }
        var rec = existing || { id: uid('cus') };
        rec.name = name;
        rec.phone = el.querySelector('#cus-phone').value.trim();
        rec.email = el.querySelector('#cus-email').value.trim();
        rec.address = el.querySelector('#cus-address').value.trim();
        stampRecord(rec, !existing);
        if(!existing) state.customers.push(rec);
        close(); persist(); toast(existing ? t('toast_customer_updated') : t('toast_customer_added'));
        if(onDone) onDone(rec);
      });
    }
  });
}

/* =========================================================================
   MODAL: New / Edit Product (with variants)
   supplierContext: {supplierId} optional — when creating from a PO line item,
   a single-variant product auto-catalogs itself for that supplier (mirrors
   the FileMaker behavior).
   ========================================================================= */

function openProductModal(existing, supplierContext, onDone){
  var draftVariants = existing ? variantsForProduct(existing.id).map(function(v){ return {id:v.id, label:v.label, sku:v.sku, unitsPerPurchase: unitsPerPurchaseForVariant(v.id), _price: null, retailPriceUsd: v.retailPriceUsd, isPublic: !!v.isPublic}; }) : [{id:null, label:'', sku:'', unitsPerPurchase:10, _price:'', retailPriceUsd:'', isPublic:false}];

  pushModal({
    title: existing ? t('prod_modal_edit_title') : t('prod_modal_new_title'),
    wide: true,
    body: function(el, setError, close){
      function syncVariantsFromDOM(){
        wrap.querySelectorAll('.variant-row').forEach(function(row){
          var i = Number(row.getAttribute('data-i'));
          if(!draftVariants[i]) return;
          draftVariants[i].label = row.querySelector('.v-label').value;
          draftVariants[i].sku = row.querySelector('.v-sku').value;
          var perKitInput = row.querySelector('.v-per-kit');
          if(perKitInput) draftVariants[i].unitsPerPurchase = perKitInput.value;
          var priceInput = row.querySelector('.v-price');
          if(priceInput) draftVariants[i]._price = priceInput.value;
          var retailInput = row.querySelector('.v-retail-price');
          if(retailInput) draftVariants[i].retailPriceUsd = retailInput.value;
          var publicInput = row.querySelector('.v-is-public');
          if(publicInput) draftVariants[i].isPublic = publicInput.checked;
        });
      }
      function renderVariantRows(){
        var headHTML = isAdmin ?
          '<div class="variant-row-head">' +
            '<span>' + esc(t('variant_col_label')) + '</span>' +
            '<span>' + esc(t('variant_col_sku')) + '</span>' +
            '<span>' + esc(t('variant_col_perkit')) + '</span>' +
            '<span>' + esc(t('variant_col_cost')) + '</span>' +
            '<span>' + esc(t('variant_col_retail')) + '</span>' +
            '<span>' + esc(t('variant_col_public')) + '</span>' +
            '<span></span>' +
          '</div>'
        : '';
        var rowsHTML = draftVariants.map(function(dv, i){
          return '<div class="variant-row" data-i="' + i + '">' +
            '<input type="text" class="v-label" placeholder="' + esc(t('variant_placeholder_label')) + '" value="' + esc(dv.label) + '">' +
            '<input type="text" class="v-sku" placeholder="' + esc(t('variant_placeholder_sku')) + '" value="' + esc(dv.sku) + '">' +
            '<input type="number" class="v-per-kit num" min="1" step="1" placeholder="' + esc(t('variant_placeholder_per_kit')) + '" title="' + esc(t('variant_per_kit_title')) + '" value="' + esc(dv.unitsPerPurchase == null ? 10 : dv.unitsPerPurchase) + '">' +
            (existing ? '<span class="faint small">' + esc(t('stock_label')) + ' ' + (dv.id ? stockForVariant(dv.id) : 0) + '</span>' : '<input type="number" class="v-price num" placeholder="' + esc(t('variant_placeholder_price')) + '" step="0.01" min="0" value="' + esc(dv._price === '' ? '' : inputAmount(dv._price)) + '">') +
            (isAdmin ? '<input type="number" class="v-retail-price num" placeholder="' + esc(t('variant_placeholder_retail')) + '" step="0.01" min="0" value="' + (dv.retailPriceUsd != null && dv.retailPriceUsd !== '' ? dv.retailPriceUsd : '') + '">' : '<span></span>') +
            (isAdmin ? '<span class="v-public-wrap" title="' + esc(t('variant_is_public_title')) + '"><input type="checkbox" class="v-is-public"' + (dv.isPublic ? ' checked' : '') + '></span>' : '<span></span>') +
            '<button type="button" class="li-remove" data-act="rm-variant" data-i="' + i + '" title="Remove variant">✕</button>' +
          '</div>';
        }).join('');
        wrap.innerHTML = headHTML + rowsHTML;
        wrap.querySelectorAll('[data-act="rm-variant"]').forEach(function(btn){
          btn.addEventListener('click', function(){
            syncVariantsFromDOM();
            var i = Number(btn.getAttribute('data-i'));
            if(draftVariants.length <= 1){ setError(t('err_need_one_variant')); return; }
            draftVariants.splice(i,1);
            renderVariantRows();
          });
        });
        /* Same auto-sync as the inline price editors elsewhere: typing a
           retail price here means "sell this", so keep Public checked
           automatically instead of relying on a second, easy-to-miss click. */
        wrap.querySelectorAll('.v-retail-price').forEach(function(input){
          input.addEventListener('change', function(){
            var row = input.closest('.variant-row');
            var pub = row && row.querySelector('.v-is-public');
            if(pub){ pub.checked = input.value !== ''; }
          });
        });
      }

      var nameOptionsHTML = distinctProductNames().map(function(n){ return '<option value="' + esc(n) + '">'; }).join('');
      var categoryOptionsHTML = distinctCategories().map(function(c){ return '<option value="' + esc(c) + '">'; }).join('');

      el.innerHTML =
        '<div class="field-row">' +
          fieldHTML('prod-name', t('field_product_name'), '<input type="text" id="prod-name" list="prod-name-options" value="' + esc(existing && existing.name) + '" placeholder="e.g. Retatrutide"><datalist id="prod-name-options">' + nameOptionsHTML + '</datalist>') +
          fieldHTML('prod-category', t('field_category'), '<input type="text" id="prod-category" list="prod-category-options" value="' + esc(existing && existing.category) + '"><datalist id="prod-category-options">' + categoryOptionsHTML + '</datalist>') +
        '</div>' +
        fieldHTML('prod-desc', t('field_description'), '<textarea id="prod-desc">' + esc(existing && existing.description) + '</textarea>') +
        '<div class="field-row">' +
          fieldHTML('prod-category-es', t('field_category_es'), '<input type="text" id="prod-category-es" value="' + esc(existing && existing.categoryEs) + '">') +
          '<div></div>' +
        '</div>' +
        fieldHTML('prod-desc-es', t('field_description_es'), '<textarea id="prod-desc-es">' + esc(existing && existing.descriptionEs) + '</textarea>') +
        '<div class="field"><label>' + esc(t('field_variants_label')) + '</label><div id="variant-rows" class="variant-rows"></div>' +
        '<button type="button" class="link-btn" data-act="add-variant">' + esc(t('add_variant_btn')) + '</button>' +
        '<div class="hint">' + esc(t('hint_vials_per_kit')) + '</div>' +
        (existing ? '' : '<div class="hint">' + esc(t('hint_single_variant_autocat')) + '</div>') +
        (isAdmin ? '<div class="hint">' + esc(t('variant_retail_hint')) + '</div>' : '') +
        '</div>' +
        '<div class="modal-foot">' +
          ((existing && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('delete_product_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save">' + esc(existing ? t('save_changes_btn') : t('add_product_btn')) + '</button>' +
        '</div>';

      var wrap = el.querySelector('#variant-rows');
      renderVariantRows();
      el.querySelector('[data-act="add-variant"]').addEventListener('click', function(){
        syncVariantsFromDOM();
        draftVariants.push({id:null, label:'', sku:'', unitsPerPurchase:10, _price:'', retailPriceUsd:'', isPublic:false});
        renderVariantRows();
      });
      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        var vIds = variantsForProduct(existing.id).map(function(v){ return v.id; });
        var used = state.poLineItems.some(function(li){ return vIds.indexOf(li.variantId) !== -1; }) ||
                   state.soLineItems.some(function(li){ return vIds.indexOf(li.variantId) !== -1; });
        if(used){ setError(t('err_product_has_history')); return; }
        state.products = state.products.filter(function(p){ return p.id !== existing.id; });
        state.variants = state.variants.filter(function(v){ return v.productId !== existing.id; });
        state.supplierProducts = state.supplierProducts.filter(function(sp){ return vIds.indexOf(sp.variantId) === -1; });
        close(); persist(); toast(t('toast_product_deleted'));
      });

      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        var name = el.querySelector('#prod-name').value.trim();
        if(!name){ setError(t('err_enter_product_name')); return; }
        wrap.querySelectorAll('.variant-row').forEach(function(row, i){
          draftVariants[i].label = row.querySelector('.v-label').value.trim();
          draftVariants[i].sku = row.querySelector('.v-sku').value.trim();
          var perKitInput = row.querySelector('.v-per-kit');
          draftVariants[i].unitsPerPurchase = perKitInput && Number(perKitInput.value) > 0 ? Number(perKitInput.value) : 10;
          var priceInput = row.querySelector('.v-price');
          if(priceInput) draftVariants[i]._price = priceInput.value === '' ? '' : fromDisplayAmount(priceInput.value);
          var retailInput = row.querySelector('.v-retail-price');
          if(retailInput) draftVariants[i].retailPriceUsd = retailInput.value === '' ? null : Number(retailInput.value);
          var publicInput = row.querySelector('.v-is-public');
          if(publicInput) draftVariants[i].isPublic = publicInput.checked;
        });
        if(draftVariants.some(function(dv){ return !dv.label; })){ setError(t('err_variant_needs_label')); return; }
        if(isAdmin && draftVariants.some(function(dv){ return dv.isPublic && (dv.retailPriceUsd == null || dv.retailPriceUsd === ''); })){
          setError(t('err_public_variant_needs_price')); return;
        }

        var rec = existing || { id: uid('prod') };
        rec.name = name;
        rec.category = el.querySelector('#prod-category').value.trim();
        rec.description = el.querySelector('#prod-desc').value.trim();
        rec.categoryEs = el.querySelector('#prod-category-es').value.trim();
        rec.descriptionEs = el.querySelector('#prod-desc-es').value.trim();
        stampRecord(rec, !existing);
        if(!existing) state.products.push(rec);

        var savedVariantIds = [];
        draftVariants.forEach(function(dv){
          var v;
          if(dv.id){
            v = byId(state.variants, dv.id); v.label = dv.label; v.sku = dv.sku; v.unitsPerPurchase = dv.unitsPerPurchase;
            if(isAdmin){ v.retailPriceUsd = dv.retailPriceUsd; v.isPublic = !!dv.isPublic; }
          } else {
            v = { id: uid('var'), productId: rec.id, label: dv.label, sku: dv.sku, unitsPerPurchase: dv.unitsPerPurchase,
              retailPriceUsd: isAdmin ? dv.retailPriceUsd : null, isPublic: isAdmin ? !!dv.isPublic : false };
            state.variants.push(v);
          }
          savedVariantIds.push(v.id);
          dv.id = v.id;
        });

        var autoCatalogVariant = null, autoCatalogPrice = null;
        if(!existing && draftVariants.length === 1 && supplierContext && supplierContext.supplierId){
          var priceVal = draftVariants[0]._price;
          if(priceVal !== '' && priceVal !== undefined && !isNaN(Number(priceVal))){
            ensureCatalogEntry(supplierContext.supplierId, draftVariants[0].id, Number(priceVal));
            autoCatalogVariant = draftVariants[0].id;
            autoCatalogPrice = Number(priceVal);
          }
        }

        close(); persist();
        toast(existing ? t('toast_product_updated') : t('toast_product_added'));
        if(onDone) onDone(rec, savedVariantIds, autoCatalogVariant, autoCatalogPrice);
      });
    }
  });
}
