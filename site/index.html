tton\" data-act=\"inc\" data-id=\"'+it.id+'\">+</button></div>' :\n            '<button class=\"addbtn\" type=\"button\" data-act=\"add\" data-id=\"'+it.id+'\" '+(disabled?'disabled':'')+'><span class=\"addbtn-plus\">+</span>'+escapeHtml(L.add)+'</button>'\n          ) +\n        '</div>' +\n      '</div>' +\n    '</div>';\n}\n\nfunction renderGrid(){\n  var list = filteredSorted();\n  var grid = el('productGrid');\n  var L = t();\n  el('resultCount').textContent = L.results(list.length);\n  if(list.length === 0){\n    grid.innerHTML = '<div class=\"empty-state\" style=\"grid-column:1/-1;\">'+ (STATE.lang==='es' ? 'No se encontraron productos.' : 'No products found.') +'</div>';\n    return;\n  }\n  grid.innerHTML = list.map(cardHtml).join('');\n  grid.querySelectorAll('[data-act]').forEach(function(b){\n    b.addEventListener('click', function(e){ e.stopPropagation(); onCartAction(b.getAttribute('data-act'), b.getAttribute('data-id')); });\n  });\n  grid.querySelectorAll('[data-share]').forEach(function(b){\n    b.addEventListener('click', function(e){ e.stopPropagation(); shareProduct(b.getAttribute('data-share')); });\n  });\n  grid.querySelectorAll('.card').forEach(function(c){\n    c.addEventListener('click', function(){ openProductDetail(c.getAttribute('data-id')); });\n  });\n}\n\nfunction onCartAction(act, id){\n  if(act==='add'){ STATE.cart[id] = 1; }\n  else if(act==='inc'){ STATE.cart[id] = (STATE.cart[id]||0)+1; }\n  else if(act==='dec'){ STATE.cart[id] = (STATE.cart[id]||0)-1; if(STATE.cart[id]<=0) delete STATE.cart[id]; }\n  saveCart();\n  renderGrid();\n  renderCartBadge();\n  renderCartDrawer();\n  if(STATE.view==='detail' && STATE.detailId===id) renderProductDetail();\n}\n\n/* ------------------------- product detail view -------------------------\n   Clicking a card (anywhere except its buttons) swaps the catalog grid\n   for a single-product view, similar in spirit to a real product page,\n   without needing actual multi-page routing -- this is a static single\n   page. The hash update is a light touch so the URL reflects the open\n   product when the catalog is used standalone (not inside the admin\n   iframe), and back/forward through the hash closes it again. */\nfunction showView(){\n  el('catalogView').hidden = STATE.view !== 'grid';\n  el('productDetailView').hidden = STATE.view !== 'detail';\n  el('faqView').hidden = STATE.view !== 'faq';\n  var heroBanner = document.getElementById('heroBanner');\n  if(heroBanner) heroBanner.hidden = STATE.view !== 'grid';\n}\n/* Shareable product links: https://peptides506.com/#p-<variantId>.\n   The catalog runs inside an iframe (srcdoc) on the real site, so its own\n   location is about:srcdoc -- the link has to be built from, and kept in\n   sync with, the OUTER page's address. Same-origin (srcdoc, no sandbox),\n   so window.parent.location is readable; falls back to this window when\n   the catalog is opened standalone. */\nvar SHARE_BASE_FALLBACK = 'https://peptides506.com/';\nfunction hostWindow(){\n  try{ if(window.parent && window.parent !== window && window.parent.location.href) return window.parent; }catch(e){}\n  return window;\n}\nfunction siteBaseUrl(){\n  try{\n    var loc = hostWindow().location;\n    if(/^https?:$/.test(loc.protocol)) return loc.origin + loc.pathname;\n  }catch(e){}\n  return SHARE_BASE_FALLBACK;\n}\nfunction productShareUrl(id){\n  /* Each product has its own crawlable page (/productos/<slug>/) with its\n     own title and preview image; share that when we know the slug. */\n  var it = itemById(id);\n  if(it && it.slug){\n    var base = 'https://peptides506.com';\n    try{ var hl = hostWindow().location; if(/^https?:$/.test(hl.protocol)) base = hl.origin; }catch(e){}\n    return base + '/productos/' + it.slug + '/';\n  }\n  return siteBaseUrl() + '#p-' + encodeURIComponent(id);\n}\nfunction setHostHash(hash){\n  var w = hostWindow();\n  if(w === window) return;\n  try{\n    var loc = w.location;\n    w.history.replaceState(null, '', loc.pathname + loc.search + (hash ? '#' + hash : ''));\n  }catch(e){}\n}\nfunction copyText(text){\n  if(navigator.clipboard && navigator.clipboard.writeText){\n    return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });\n  }\n  return legacyCopy(text);\n}\nfunction legacyCopy(text){\n  return new Promise(function(resolve, reject){\n    try{\n      var ta = document.createElement('textarea');\n      ta.value = text; ta.setAttribute('readonly', '');\n      ta.style.position = 'fixed'; ta.style.top = '-1000px';\n      document.body.appendChild(ta); ta.select();\n      var ok = document.execCommand('copy');\n      document.body.removeChild(ta);\n      ok ? resolve() : reject(new Error('copy failed'));\n    }catch(err){ reject(err); }\n  });\n}\nfunction shareProduct(id){\n  var it = itemById(id);\n  if(!it) return;\n  var L = t();\n  var url = productShareUrl(id);\n  var title = it.name + ' ' + it.variant;\n  if(navigator.share && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')){\n    navigator.share({ title: title + ' | Peptides 506', text: title, url: url }).catch(function(err){\n      if(err && err.name === 'AbortError') return;\n      copyText(url).then(function(){ toast(L.shareCopied, false); }, function(){ toast(L.shareFailed + ' ' + url, true); });\n    });\n    return;\n  }\n  copyText(url).then(function(){ toast(L.shareCopied, false); }, function(){ toast(L.shareFailed + ' ' + url, true); });\n}\n\nfunction openProductDetail(id){\n  if(!itemById(id)) return;\n  STATE.view = 'detail';\n  STATE.detailId = id;\n  renderProductDetail();\n  showView();\n  try{ window.scrollTo(0,0); }catch(e){}\n  try{ if(location.hash !== '#p-'+id) location.hash = 'p-'+id; }catch(e){}\n  setHostHash('p-'+id);\n}\nfunction openFaq(){\n  STATE.view = 'faq';\n  renderFaq();\n  showView();\n  try{ window.scrollTo(0,0); }catch(e){}\n  try{ if(location.hash !== '#faq') location.hash = 'faq'; }catch(e){}\n}\nfunction closeFaq(){\n  STATE.view = 'grid';\n  showView();\n  try{ if(location.hash) history.replaceState(null, '', location.pathname + location.search); }catch(e){}\n  setHostHash('');\n}\n/* Accordion is rebuilt from I18N on every render (language switch, initial\n   load) rather than only translating text in place, since which item is\n   open is trivial UI state that's fine to reset on a language change. */\nfunction renderFaq(){\n  var L = t();\n  el('faqTitle').textContent = L.faqTitle;\n  el('faqBackLabel').textContent = L.detailBack;\n  el('faqCtaTitle').textContent = L.faqCtaTitle;\n  el('faqCtaSub').textContent = L.faqCtaSub;\n  el('faqContactBtnLabel').textContent = L.faqContactBtn;\n  var wa = (STATE.settings.whatsapp||'').replace(/[^0-9]/g,'');\n  var contactBtn = el('faqContactBtn');\n  contactBtn.onclick = function(){\n    if(wa){ window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(L.faqContactMsg), '_blank'); }\n    else { toast(STATE.lang==='es' ? 'El numero de WhatsApp aun no esta configurado.' : 'WhatsApp number is not set up yet.', true); }\n  };\n  var wrap = el('faqList');\n  wrap.innerHTML = (L.faqItems||[]).map(function(item, i){\n    return '<div class=\"faq-item\" data-i=\"'+i+'\">'\n      + '<button type=\"button\" class=\"faq-q\">'\n      + '<span>'+escapeHtml(item.q)+'</span>'\n      + '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 9l6 6 6-6\"></path></svg>'\n      + '</button>'\n      + '<div class=\"faq-a\"><p>'+escapeHtml(item.a)+'</p></div>'\n      + '</div>';\n  }).join('');\n  wrap.querySelectorAll('.faq-q').forEach(function(btn){\n    btn.addEventListener('click', function(){\n      btn.closest('.faq-item').classList.toggle('open');\n    });\n  });\n}\nfunction closeProductDetail(){\n  STATE.view = 'grid';\n  STATE.detailId = null;\n  showView();\n  try{ if(location.hash) history.replaceState(null, '', location.pathname + location.search); }catch(e){}\n  setHostHash('');\n}\n// The extra \"Product Information\" spec rows below are derived only from data\n// we already have (the product's own description text, its category, and real\n// storage instructions printed on our vial labels) -- never invented per-product\n// research claims. If a field can't be derived cleanly, it's left out rather\n// than guessed.\nvar FOCUS_LEADIN_EN = /^(widely studied in|also studied for its|studied also for its|studied for its|studied in|studied for|researched for|research on|used in|utilized in|used for)\\s+/i;\nvar FOCUS_TRAIL_EN = /\\s+(research|protocols|properties)\\.?$/i;\nvar FOCUS_LEADIN_ES = /^(ampliamente estudiad[oa] en investigacion sobre|estudiad[oa] en investigacion sobre|estudiad[oa] tambien por su|estudiad[oa] tambien en|estudiad[oa] en modelos de investigacion sobre|estudiad[oa] por su|estudiad[oa] en|estudiad[oa] por|investigad[oa] por su|investigad[oa] en|utilizad[oa] en protocolos de|utilizad[oa] en|usad[oa] en protocolos de|usad[oa] en)\\s+/i;\n\nfunction splitDesc(desc){\n  var idx = (desc||'').indexOf(',');\n  if(idx === -1) return { type: (desc||'').replace(/\\.$/, '').trim(), focusRaw: '' };\n  return { type: desc.slice(0, idx).trim(), focusRaw: desc.slice(idx+1).trim() };\n}\nfunction cleanFocus(focusRaw, lang){\n  if(!focusRaw) return '';\n  var original = focusRaw.replace(/\\.$/, '').trim();\n  var s = focusRaw.replace(lang==='es' ? FOCUS_LEADIN_ES : FOCUS_LEADIN_EN, '');\n  if(lang!=='es') s = s.replace(FOCUS_TRAIL_EN, '');\n  s = s.replace(/\\.$/, '').trim();\n  // if nothing could be confidently stripped, skip rather than show a raw run-on clause\n  if(s.length < 3 || s === original) return '';\n  return s.charAt(0).toUpperCase() + s.slice(1);\n}\nfunction deriveFormat(it, L){\n  var text = ((it.descEn||'') + ' ' + (it.descEs||'')).toLowerCase();\n  if(it.category === 'Solvents & Supplies') return L.specFormatSterile;\n  if(/inject|inyect|soluci[o\u00f3]n|solution/.test(text)) return L.specFormatInj;\n  return L.specFormatLyo;\n}\nfunction deriveStorage(format, L){\n  return format === L.specFormatLyo ? L.specStorageLyo : L.specStorageGeneric;\n}\n\nfunction renderProductDetail(){\n  var it = itemById(STATE.detailId);\n  if(!it){ closeProductDetail(); return; }\n  var L = t();\n  el('detailBackLabel').textContent = L.detailBack;\n  el('detailCat').textContent = catLabel(it.category);\n  el('detailTitle').textContent = it.name + ' ' + it.variant;\n  el('detailPriceRow').innerHTML = priceHtml(it.price);\n  var img = el('detailImage');\n  if(it.image){ img.src = it.image; img.hidden = false; } else { img.hidden = true; }\n  el('detailStockRow').innerHTML =\n    '<span class=\"stock-chip'+(it.available?' avail':' unavail')+'\">'+escapeHtml(it.available ? L.available : L.unavailable)+'</span>' +\n    (it.available && it.stockQty!=null ? '<span class=\"stock-count\">'+escapeHtml(L.inStockCount(it.stockQty))+'</span>' : '');\n  var promoNote = el('detailPromoNote');\n  if(promoNote){\n    promoNote.hidden = isWaterItem(it);\n    promoNote.innerHTML = '\ud83c\udf81 ' + escapeHtml(L.freeBacWaterNote);\n  }\n  var desc = STATE.lang==='es' ? it.descEs : it.descEn;\n  el('detailDesc').textContent = desc || '';\n  el('detailDesc').hidden = !desc;\n\n  var qty = STATE.cart[it.id] || 0;\n  var cta = el('detailCta');\n  cta.innerHTML = qty>0 ?\n    '<div class=\"qtyctl\"><button type=\"button\" data-act=\"dec\" data-id=\"'+it.id+'\">-</button><span>'+qty+'</span><button type=\"button\" data-act=\"inc\" data-id=\"'+it.id+'\">+</button></div>' :\n    '<button class=\"addbtn\" type=\"button\" data-act=\"add\" data-id=\"'+it.id+'\" '+(it.available?'':'disabled')+'><span class=\"addbtn-plus\">+</span>'+escapeHtml(L.add)+'</button>';\n  cta.querySelectorAll('[data-act]').forEach(function(b){\n    b.addEventListener('click', function(){ onCartAction(b.getAttribute('data-act'), b.getAttribute('data-id')); });\n  });\n\n  var wa = (STATE.settings.whatsapp||'').replace(/[^0-9]/g,'');\n  var secondary = el('detailSecondary');\n  var contactHref = wa ? ('https://wa.me/' + wa + '?text=' + encodeURIComponent(L.waContactMsg(it.name, it.variant))) : null;\n  var coaHref = wa ? ('https://wa.me/' + wa + '?text=' + encodeURIComponent(L.waCoaMsg(it.name, it.variant))) : null;\n  secondary.innerHTML =\n    '<a class=\"detail-secondary-btn detail-contact-btn\" href=\"'+(contactHref||'#')+'\" target=\"_blank\" rel=\"noopener\">' +\n      '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"></path></svg>' +\n      escapeHtml(L.detailContactBtn) +\n    '</a>' +\n    '<a class=\"detail-secondary-btn detail-coa-btn\" href=\"'+(coaHref||'#')+'\" target=\"_blank\" rel=\"noopener\">' +\n      '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z\"></path></svg>' +\n      escapeHtml(L.detailCoaBtn) +\n    '</a>' +\n    '<button type=\"button\" class=\"detail-secondary-btn detail-share-btn\" id=\"detailShareBtn\">' + '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18\" cy=\"5\" r=\"3\"></circle><circle cx=\"6\" cy=\"12\" r=\"3\"></circle><circle cx=\"18\" cy=\"19\" r=\"3\"></circle><line x1=\"8.6\" y1=\"13.5\" x2=\"15.4\" y2=\"17.5\"></line><line x1=\"15.4\" y1=\"6.5\" x2=\"8.6\" y2=\"10.5\"></line></svg>' + escapeHtml(L.shareBtn) + '</button>';\n  el('detailShareBtn').addEventListener('click', function(){ shareProduct(it.id); });\n  el('detailCoaNote').textContent = L.detailCoaNote;\n  if(!wa){\n    secondary.querySelectorAll('a').forEach(function(a){\n      a.addEventListener('click', function(e){\n        e.preventDefault();\n        toast(STATE.lang==='es' ? 'El numero de WhatsApp aun no esta configurado.' : 'WhatsApp number is not set up yet.', true);\n      });\n    });\n  }\n\n  el('detailSpecsTitle').textContent = L.detailInfoTitle;\n  var format = deriveFormat(it, L);\n  var split = splitDesc(desc);\n  var focus = cleanFocus(split.focusRaw, STATE.lang);\n  var rows = [\n    [L.specProduct, it.name],\n    [L.specCategory, catLabel(it.category)],\n    [L.specFormat, format],\n    [L.specVialContent, it.variant],\n    [L.specCompoundType, split.type],\n    [L.specFocus, focus],\n    [L.specDevStatus, L.specDevStatusVal],\n    [L.specStorage, deriveStorage(format, L)],\n    [L.specIntendedUse, L.specIntendedUseVal],\n    [L.specHumanUse, L.specHumanUseVal],\n    [L.specSku, it.sku]\n  ].filter(function(r){ return r[1] && String(r[1]).trim().length > 0; });\n  el('detailSpecsBody').innerHTML = rows.map(function(r){\n    return '<tr><td>'+escapeHtml(r[0])+'</td><td>'+escapeHtml(r[1]||'')+'</td></tr>';\n  }).join('');\n}\n\nfunction cartCount(){ var n=0; for(var k in STATE.cart) n += STATE.cart[k]; return n; }\n\nfunction renderCartBadge(){\n  var n = cartCount();\n  var badge = el('cartCount');\n  if(n>0){ badge.hidden=false; badge.textContent = n; } else { badge.hidden = true; }\n}\n\n/* -------- cross-sell: other dosages of the same product(s) in the cart -------- */\nfunction crossSellCandidates(cartIds){\n  var inCart = {}; cartIds.forEach(function(id){ inCart[id] = true; });\n  var namesInCart = {};\n  cartIds.forEach(function(id){ var it = itemById(id); if(it) namesInCart[it.name] = true; });\n  var out = [];\n  STATE.items.forEach(function(it){\n    if(inCart[it.id] || !namesInCart[it.name] || !it.available) return;\n    out.push(it);\n  });\n  return out.slice(0, 8);\n}\nfunction renderCrossSell(cartIds){\n  var L = t(), sym = STATE.settings.currencySymbol || '$';\n  var candidates = crossSellCandidates(cartIds);\n  var wrap = el('crossSell');\n  if(candidates.length === 0){ wrap.hidden = true; return; }\n  wrap.hidden = false;\n  el('crossSellTrack').innerHTML = candidates.map(function(it){\n    var thumb = it.image ? '<img src=\"'+escapeHtml(it.image)+'\" alt=\"\" loading=\"lazy\" onerror=\"this.hidden=true\">' : '';\n    return '<div class=\"cross-sell-card\">' + thumb +\n      '<div class=\"name\">'+escapeHtml(it.name + ' ' + it.variant)+'</div>' +\n      '<div class=\"price\">'+(it.price!=null ? fmtMoney(it.price, sym) : escapeHtml(L.askPrice))+'</div>' +\n      '<button type=\"button\" class=\"cross-sell-add\" data-id=\"'+it.id+'\" aria-label=\"+\">+</button>' +\n    '</div>';\n  }).join('');\n  el('crossSellTrack').querySelectorAll('.cross-sell-add').forEach(function(b){\n    b.addEventListener('click', function(){ onCartAction('inc', b.getAttribute('data-id')); });\n  });\n}\n\n/* -------- Costa Rica province/canton/district cascading selects -------- */\nfunction populateSelect(selectEl, values, placeholderText, placeholderId){\n  var current = selectEl.value;\n  selectEl.innerHTML = '<option value=\"\" id=\"'+placeholderId+'\">'+escapeHtml(placeholderText)+'</option>' +\n    values.map(function(v){ return '<option value=\"'+escapeHtml(v)+'\">'+escapeHtml(v)+'</option>'; }).join('');\n  if(values.indexOf(current) !== -1) selectEl.value = current;\n}\nfunction initGeoSelects(){\n  var CO = t().co;\n  populateSelect(el('custProvince'), Object.keys(CR_GEO), CO.provincePh, 'provincePh');\n}\nfunction onProvinceChange(){\n  var CO = t().co;\n  var prov = el('custProvince').value;\n  var cantonSel = el('custCanton'), districtSel = el('custDistrict');\n  if(prov && CR_GEO[prov]){\n    populateSelect(cantonSel, Object.keys(CR_GEO[prov]), CO.cantonPh, 'cantonPh');\n    cantonSel.disabled = false;\n  } else {\n    cantonSel.innerHTML = '<option value=\"\" id=\"cantonPh\">'+escapeHtml(CO.cantonPh)+'</option>';\n    cantonSel.disabled = true;\n  }\n  districtSel.innerHTML = '<option value=\"\" id=\"districtPh\">'+escapeHtml(CO.districtPh)+'</option>';\n  districtSel.disabled = true;\n}\nfunction onCantonChange(){\n  var CO = t().co;\n  var prov = el('custProvince').value, canton = el('custCanton').value;\n  var districtSel = el('cust t = fmtMoney(0, sym);\n    el('summaryDiscountRow').hidden = true;\n    el('summaryShippingValue').textContent = fmtMoney(0, sym);\n    el('summaryFreeShipNote').hidden = true;\n    el('summaryTotalValue').textContent = fmtMoney(0, sym);\n    el('payTotalValue').textContent = fmtMoney(0, sym);\n    el('poaNote').hidden = true;\n    el('checkoutBtn').disabled = true;\n    return;\n  }\n  el('checkoutBtn').disabled = false;\n  var totals = computeCartTotals();\n\n  itemsList.innerHTML = totals.lines.map(function(line){\n    var it = line.it, qty = line.qty, id = it.id;\n    var thumb = it.image ?\n      ('<img class=\"thumb\" src=\"'+escapeHtml(it.image)+'\" alt=\"\" onerror=\"this.hidden=true; this.nextElementSibling.hidden=false;\"><div class=\"thumb-placeholder\" hidden></div>') :\n      '<div class=\"thumb-placeholder\"></div>';\n    return '<div class=\"cart-item\">' + thumb +\n      '<div class=\"info\">' +\n        '<div class=\"cart-item-top\"><div class=\"name\">'+escapeHtml(it.name + ' ' + it.variant)+'</div>' +\n        '<button class=\"cart-remove\" data-id=\"'+id+'\" aria-label=\"'+escapeHtml(L.remove)+'\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z\"></path></svg></button></div>' +\n        '<div class=\"unit-price\">'+(it.price!=null ? fmtMoney(it.price, sym) + ' ' + CO.each : escapeHtml(L.askPrice))+'</div>' +\n        '<div class=\"row-bottom\">' +\n          '<div class=\"qtyctl\"><button type=\"button\" data-act=\"dec\" data-id=\"'+id+'\">-</button><span>'+qty+'</span><button type=\"button\" data-act=\"inc\" data-id=\"'+id+'\">+</button></div>' +\n          '<div class=\"linetotal money\">'+(line.lineTotal!=null ? fmtMoney(line.lineTotal, sym) : escapeHtml(L.askPrice))+'</div>' +\n        '</div>' +\n      '</div>' +\n    '</div>';\n  }).join('');\n  itemsList.querySelectorAll('[data-act]').forEach(function(b){\n    b.addEventListener('click', function(){ onCartAction(b.getAttribute('data-act'), b.getAttribute('data-id')); });\n  });\n  itemsList.querySelectorAll('.cart-remove').forEach(function(b){\n    b.addEventListener('click', function(){\n      var removedId = b.getAttribute('data-id');\n      delete STATE.cart[removedId]; saveCart(); renderGrid(); renderCartBadge(); renderCartDrawer();\n      if(STATE.view==='detail' && STATE.detailId===removedId) renderProductDetail();\n    });\n  });\n\n  renderCrossSell(ids);\n\n  var waterBanner = el('bacWaterBanner');\n  if(totals.freeWaterQty > 0){\n    waterBanner.hidden = false;\n    el('bacWaterBannerText').textContent = CO.bacWaterBanner(totals.freeWaterQty);\n    el('bacWaterBannerTag').textContent = CO.freeTag;\n  } else { waterBanner.hidden = true; }\n\n  el('dealBanner').hidden = false;\n  el('dealBannerText').textContent = CO.dealBannerText(totals.dealMinQty, totals.dealPct, getSetting('dealBuyQtyForFree', 4));\n\n  var sumHtml = totals.lines.map(function(line){\n    return '<div class=\"summary-item-row\"><span>'+line.qty+' &times; '+escapeHtml(line.it.name+' '+line.it.variant)+'</span><span>'+(line.lineTotal!=null?fmtMoney(line.lineTotal,sym):escapeHtml(L.askPrice))+'</span></div>';\n  }).join('') + totals.bonusLines.map(function(b){\n    return '<div class=\"summary-item-row free\"><span>&#127873; '+b.qty+' &times; '+escapeHtml(b.it.name+' '+b.it.variant)+' <span class=\"sub\">('+escapeHtml(CO.freeBonusNote(getSetting('dealBuyQtyForFree',4)))+')</span></span><span>'+escapeHtml(CO.freeTag)+'</span></div>';\n  }).join('');\n  el('summaryItemsList').innerHTML = sumHtml;\n  el('summarySubtotalValue').textContent = fmtMoney(totals.subtotal, sym);\n  if(totals.effectivePct > 0){\n    el('summaryDiscountRow').hidden = false;\n    el('summaryDiscountLabel').textContent = CO.summaryDiscount(totals.effectivePct);\n    el('summaryDiscountValue').textContent = '-' + fmtMoney(totals.discountAmount, sym);\n  } else {\n    el('summaryDiscountRow').hidden = true;\n  }\n  el('summaryShippingValue').textContent = totals.freeShipping ? CO.freeTag : fmtMoney(totals.shippingFee, sym);\n  if(!totals.freeShipping && totals.shippingFeeUsd > 0){\n    el('summaryFreeShipNote').hidden = false;\n    var remaining = Math.max(0, totals.freeShipThreshold - totals.discountedSubtotal);\n    el('summaryFreeShipNote').textContent = CO.freeShipNote(fmtMoney(remaining, sym), fmtMoney(totals.freeShipThreshold, sym));\n  } else {\n    el('summaryFreeShipNote').hidden = true;\n  }\n  el('summaryTotalValue').textContent = fmtMoney(totals.total, sym);\n  el('payTotalValue').textContent = fmtMoney(totals.total, sym);\n\n  el('poaNote').hidden = !totals.hasPoa;\n  if(totals.hasPoa) el('poaNote').textContent = L.poaNote;\n}\n\nfunction buildWhatsAppMessage(cust){\n  var L = t(), CO = L.co, sym = STATE.settings.currencySymbol || '$';\n  var totals = computeCartTotals();\n  var lines = [L.waGreeting + (cust.name ? ' (' + cust.name + ')' : ''), ''];\n  if(STATE.currentOrderNumber){ lines.push(CO.orderNumberLabel + ': ' + STATE.currentOrderNumber); lines.push(''); }\n  totals.lines.forEach(function(line){\n    var priceStr = line.lineTotal != null ? fmtMoney(line.lineTotal, sym) : L.waAskPrice;\n    lines.push('- ' + line.it.name + ' (' + line.it.variant + ') x' + line.qty + ' - ' + priceStr);\n  });\n  totals.bonusLines.forEach(function(b){\n    lines.push('- ' + CO.freeTag + ': ' + b.it.name + ' (' + b.it.variant + ') x' + b.qty + ' (' + CO.freeBonusNote(getSetting('dealBuyQtyForFree',4)) + ')');\n  });\n  lines.push('');\n  lines.push(L.waTotal + ': ' + fmtMoney(totals.subtotal, sym) + (totals.hasPoa ? ' + ' + L.waAskPrice : ''));\n  if(totals.effectivePct > 0){\n    lines.push(CO.summaryDiscount(totals.effectivePct) + ': -' + fmtMoney(totals.discountAmount, sym));\n  }\n  lines.push(CO.waShipping + ': ' + (totals.freeShipping ? CO.freeTag : fmtMoney(totals.shippingFee, sym)));\n  lines.push(CO.waGrandTotal + ': ' + fmtMoney(totals.total, sym));\n  if(totals.freeWaterQty > 0){ lines.push(L.freeBacWaterOrderLine(totals.freeWaterQty)); }\n  lines.push('');\n  lines.push(CO.waSectionShipping + ':');\n  lines.push(CO.waFieldEmail + ': ' + (cust.email || '-'));\n  lines.push(CO.waFieldId + ': ' + idTypeLabel(cust.idType) + ' ' + (cust.idNumber || '-'));\n  lines.push(CO.waFieldAddress + ': ' + [cust.address, cust.district, cust.canton, cust.province].filter(function(s){return !!s;}).join(', ') + (cust.postal ? ' (CP ' + cust.postal + ')' : ''));\n  lines.push(CO.waFieldPayment + ': ' + CO.payWaTitle);\n  lines.push('');\n  lines.push(CO.waAckLine);\n  lines.push('');\n  lines.push(L.waClosing);\n  return lines.join('\\n');\n}\n\nfunction openCart(){ el('cartOverlay').classList.add('show'); el('cartDrawer').classList.add('show'); }\nfunction closeCart(){ el('cartOverlay').classList.remove('show'); el('cartDrawer').classList.remove('show'); }\n\nfunction renderAll(){\n  renderChrome();\n  renderChips();\n  renderGrid();\n  renderCartBadge();\n  renderCartDrawer();\n  if(STATE.view==='detail') renderProductDetail();\n  if(STATE.view==='faq') renderFaq();\n}\n\nfunction toast(msg, isErr){\n  var tEl = el('toast');\n  tEl.textContent = msg;\n  tEl.style.background = isErr ? 'var(--danger)' : 'var(--ink)';\n  tEl.classList.add('show');\n  clearTimeout(toast._t);\n  toast._t = setTimeout(function(){ tEl.classList.remove('show'); }, 3200);\n}\n\n/* ---------------- admin ---------------- */\n\nfunction renderAdminCategoryFilter(){\n  var sel = el('adminCatFilter');\n  var cats = getCategories();\n  sel.innerHTML = '<option value=\"ALL\">' + (STATE.lang==='es'?'Todas las categorias':'All categories') + '</option>' +\n    cats.map(function(c){ return '<option value=\"'+escapeHtml(c)+'\">'+escapeHtml(catLabel(c))+'</option>'; }).join('');\n}\n\nfunction renderAdminTable(){\n  var body = el('adminTableBody');\n  var titleEl = el('adminInventoryTitle');\n  if(titleEl){\n    var label = STATE.lang==='es' ? 'Precios e inventario' : 'Prices & inventory';\n    var countLabel = STATE.lang==='es' ? (STATE.items.length+' productos') : (STATE.items.length+' products');\n    titleEl.textContent = label + ' (' + countLabel + ')';\n  }\n  var q = (el('adminSearch').value||'').trim().toLowerCase();\n  var cat = el('adminCatFilter').value || 'ALL';\n  var missingOnly = el('adminMissingOnly').checked;\n  var rows = STATE.items.filter(function(it){\n    if(cat!=='ALL' && it.category!==cat) return false;\n    if(missingOnly && it.price!=null) return false;\n    if(q && (it.name+' '+it.variant+' '+it.sku+' '+(it.internalName||'')).toLowerCase().indexOf(q)===-1) return false;\n    return true;\n  });\n  body.innerHTML = rows.map(function(it){\n    var nameCell = escapeHtml(it.internalName || it.name);\n    if(it.internalName && it.internalName !== it.name){\n      nameCell += '<div style=\"font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:2px;\">' +\n        (STATE.lang==='es' ? 'publico: ' : 'public: ') + escapeHtml(it.name) + '</div>';\n    }\n    return '<tr data-id=\"'+it.id+'\">' +\n      '<td>'+nameCell+'</td>' +\n      '<td>'+escapeHtml(catLabel(it.category))+'</td>' +\n      '<td class=\"mono\">'+escapeHtml(it.variant)+'</td>' +\n      '<td class=\"mono\">'+escapeHtml(it.sku)+'</td>' +\n      '<td><input type=\"number\" step=\"0.01\" min=\"0\" class=\"admin-price\" data-id=\"'+it.id+'\" value=\"'+(it.price!=null?it.price:'')+'\" placeholder=\"--\"></td>' +\n      '<td><input type=\"checkbox\" class=\"admin-avail\" data-id=\"'+it.id+'\" '+(it.available?'checked':'')+'></td>' +\n    '</tr>';\n  }).join('');\n  body.querySelectorAll('.admin-price').forEach(function(inp){\n    inp.addEventListener('input', function(){\n      var it = itemById(inp.getAttribute('data-id'));\n      if(!it) return;\n      var v = inp.value.trim();\n      it.price = v==='' ? null : Math.max(0, parseFloat(v));\n      STATE.dirty = true;\n      updateSaveStatus();\n    });\n  });\n  body.querySelectorAll('.admin-avail').forEach(function(inp){\n    inp.addEventListener('change', function(){\n      var it = itemById(inp.getAttribute('data-id'));\n      if(!it) return;\n      it.available = inp.checked;\n      STATE.dirty = true;\n      updateSaveStatus();\n    });\n  });\n}\n\nfunction updateSaveStatus(){\n  var s = el('saveStatus');\n  s.className = 'admin-status';\n  s.textContent = STATE.dirty ? (STATE.lang==='es' ? 'Cambios sin guardar' : 'Unsaved changes') : '';\n}\n\nfunction openAdmin(){\n  el('fBusinessName').value = STATE.settings.businessName || '';\n  el('fWhatsapp').value = STATE.settings.whatsapp || '';\n  el('fTaglineEs').value = STATE.settings.taglineEs || '';\n  el('fTaglineEn').value = STATE.settings.taglineEn || '';\n  renderAdminCategoryFilter();\n  renderAdminTable();\n  el('adminPanel').classList.add('show');\n}\nfunction closeAdmin(){ el('adminPanel').classList.remove('show'); }\n\nfunction collectSettingsFromForm(){\n  STATE.settings.businessName = el('fBusinessName').value.trim();\n  STATE.settings.whatsapp = el('fWhatsapp').value.trim();\n  STATE.settings.taglineEs = el('fTaglineEs').value.trim();\n  STATE.settings.taglineEn = el('fTaglineEn').value.trim();\n  STATE.settings.updatedAt = new Date().toISOString();\n}\n\nfunction buildFullDocument(){\n  var dataObj = { items: STATE.items, settings: STATE.settings };\n  var dataJson = JSON.stringify(dataObj).replace(/<\\//g, '<\\\\/');\n  var titleSafe = escapeHtml(STATE.settings.businessName ? (STATE.settings.businessName + ' Catalog') : 'Peptides506 Catalog');\n  // NOTE: use function replacers, not string replacers -- a string\n  // replacement value is scanned by String.replace for \"$\"-patterns\n  // ($&, $', $1, ...), and both dataJson and APP_JS_SOURCE contain literal\n  // \"$\" sequences (currency symbols, code) that must be inserted verbatim.\n  var bodyHtml = \"\\n<div class=\\\"agegate-overlay\\\" id=\\\"ageGateOverlay\\\" role=\\\"dialog\\\" aria-modal=\\\"t ntListener('click', function(){ STATE.lang='es'; saveLang(); renderAll(); });\n  el('ageGateLangEn').addEventListener('click', function(){ STATE.lang='en'; saveLang(); renderAll(); });\n  el('currUsd').addEventListener('click', function(){ STATE.currency='usd'; saveCurrency(); renderAll(); });\n  el('currCrc').addEventListener('click', function(){ STATE.currency='crc'; saveCurrency(); renderAll(); });\n  el('themeLight').addEventListener('click', function(){ STATE.theme='light'; saveTheme(); applyTheme(); });\n  el('themeDark').addEventListener('click', function(){ STATE.theme='dark'; saveTheme(); applyTheme(); });\n  el('waStickyBtn').addEventListener('click', openCart);\n\n  el('cartBtn').addEventListener('click', openCart);\n  el('cartClose').addEventListener('click', closeCart);\n  el('cartOverlay').addEventListener('click', closeCart);\n  el('clearCartBtn').addEventListener('click', function(){\n    STATE.cart = {}; saveCart(); renderGrid(); renderCartBadge(); renderCartDrawer();\n    if(STATE.view==='detail') renderProductDetail();\n  });\n  el('detailBackBtn').addEventListener('click', closeProductDetail);\n  el('faqBackBtn').addEventListener('click', closeFaq);\n  el('introFaqLink').addEventListener('click', openFaq);\n  el('footFaqLink').addEventListener('click', openFaq);\n  window.addEventListener('hashchange', function(){\n    var h = location.hash.replace('#','');\n    if(h.indexOf('p-')===0){\n      var id = h.slice(2);\n      if(itemById(id)){ if(STATE.detailId!==id || STATE.view!=='detail'){ STATE.view='detail'; STATE.detailId=id; renderProductDetail(); showView(); } }\n    } else if(h==='faq'){\n      if(STATE.view!=='faq'){ STATE.view='faq'; renderFaq(); showView(); }\n    } else if(STATE.view==='detail' || STATE.view==='faq'){\n      if(STATE.view==='detail') closeProductDetail(); else closeFaq();\n    }\n  });\n  /* Full checkout validation -- every field below now actually ships to\n     staff (via the WhatsApp/email message and the Supabase draft order), so\n     each one is required except the postal code. Stops and focuses on the\n     first missing field, same pattern as the old name-only check.\n     `opts.skipPhone` is used by the email-order path: that button exists\n     specifically for visitors without WhatsApp, so it can't also demand a\n     WhatsApp number. */\n  function requireCustomerInfo(opts){\n    opts = opts || {};\n    var L = t(), CO = L.co;\n    var name = (el('custName').value||'').trim();\n    var email = (el('custEmail').value||'').trim();\n    var countryCode = el('custCountryCode').value;\n    var phone = (el('custPhone').value||'').trim();\n    var idType = el('custIdType').value;\n    var idNumber = (el('custIdNumber').value||'').trim();\n    var province = el('custProvince').value;\n    var canton = el('custCanton').value;\n    var district = el('custDistrict').value;\n    var postal = (el('custPostal').value||'').trim();\n    var address = (el('custAddress').value||'').trim();\n\n    var checks = [\n      [!!name, 'custName', CO.errName],\n      [!!email && /\\S+@\\S+\\.\\S+/.test(email), 'custEmail', CO.errEmail]\n    ];\n    if(!opts.skipPhone){ checks.push([!!phone, 'custPhone', CO.errPhone]); }\n    checks.push(\n      [!!idNumber, 'custIdNumber', CO.errId],\n      [!!province, 'custProvince', CO.errProvince],\n      [!!canton, 'custCanton', CO.errCanton],\n      [!!district, 'custDistrict', CO.errDistrict],\n      [!!address, 'custAddress', CO.errAddress]\n    );\n    for(var i=0;i<checks.length;i++){\n      if(!checks[i][0]){\n        toast(checks[i][2], true);\n        el(checks[i][1]).focus();\n        return null;\n      }\n    }\n    var cust = { name:name, email:email, countryCode:countryCode, phone:phone, idType:idType, idNumber:idNumber, province:province, canton:canton, district:district, postal:postal, address:address };\n    Object.keys(cust).forEach(function(f){ saveCustField(f, cust[f]); });\n    return cust;\n  }\n\n  el('promoApplyBtn').addEventListener('click', function(){\n    var CO = t().co;\n    var code = (el('promoInput').value||'').trim().toUpperCase();\n    var codes = defaultPromoCodes();\n    var msgEl = el('promoMsg');\n    if(!code){ msgEl.hidden = true; STATE.promo = {code:'', pct:0}; renderCartDrawer(); return; }\n    msgEl.hidden = false;\n    if(codes[code]){\n      STATE.promo = { code: code, pct: Number(codes[code]) };\n      msgEl.className = 'promo-msg ok';\n      msgEl.textContent = CO.promoApplied(STATE.promo.pct);\n    } else {\n      STATE.promo = { code:'', pct:0 };\n      msgEl.className = 'promo-msg err';\n      msgEl.textContent = CO.promoInvalid;\n    }\n    renderCartDrawer();\n  });\n\n  el('custProvince').addEventListener('change', onProvinceChange);\n  el('custCanton').addEventListener('change', onCantonChange);\n  el('crossSellPrev').addEventListener('click', function(){ el('crossSellTrack').scrollBy({left:-150, behavior:'smooth'}); });\n  el('crossSellNext').addEventListener('click', function(){ el('crossSellTrack').scrollBy({left:150, behavior:'smooth'}); });\n  el('payCardOpt').addEventListener('click', function(){ toast(t().co.payCardComingSoonMsg, false); });\n\n  el('ackCheckbox').addEventListener('change', function(){\n    el('ackContinueBtn').disabled = !this.checked;\n  });\n  el('ackContinueBtn').addEventListener('click', function(){\n    if(!el('ackCheckbox').checked){ toast(t().co.ackRequired, true); return; }\n    STATE.ackAccepted = true;\n    syncAckGate();\n    var sec = el('checkoutSection');\n    if(sec && sec.scrollIntoView) sec.scrollIntoView({behavior:'smooth', block:'start'});\n  });\n\n  el('checkoutBtn').addEventListener('click', function(){\n    if(!STATE.ackAccepted){ toast(t().co.ackRequired, true); return; }\n    var cust = requireCustomerInfo(); if(!cust) return;\n    STATE.currentOrderNumber = genOrderNumber();\n    var wa = (STATE.settings.whatsapp||'').replace(/[^0-9]/g,'');\n    var msg = encodeURIComponent(buildWhatsAppMessage(cust));\n    // Best-effort sync to Supabase as a draft sales order; never blocks WhatsApp.\n    submitOrderToSupabase(cust, STATE.currentOrderNumber);\n    toast(t().co.orderNumberToast(STATE.currentOrderNumber), false);\n    if(wa){ window.open('https://wa.me/' + wa + '?text=' + msg, '_blank'); }\n    else { toast(STATE.lang==='es' ? 'El numero de WhatsApp aun no esta configurado.' : 'WhatsApp number is not set up yet.', true); }\n  });\n\n  el('emailOrderBtn').addEventListener('click', function(){\n    if(!STATE.ackAccepted){ toast(t().co.ackRequired, true); return; }\n    var L = t();\n    var cust = requireCustomerInfo({ skipPhone: true }); if(!cust) return;\n    STATE.currentOrderNumber = genOrderNumber();\n    var orderEmail = (STATE.settings.orderEmail||'').trim();\n    if(!orderEmail){\n      toast(STATE.lang==='es' ? 'El correo de pedidos aun no esta configurado.' : 'Order email is not set up yet.', true);\n      return;\n    }\n    // Best-effort sync to Supabase as a draft sales order; never blocks the email.\n    submitOrderToSupabase(cust, STATE.currentOrderNumber);\n    toast(t().co.orderNumberToast(STATE.currentOrderNumber), false);\n    var subject = encodeURIComponent(L.emailSubject);\n    var body = encodeURIComponent(buildWhatsAppMessage(cust));\n    window.location.href = 'mailto:' + orderEmail + '?subject=' + subject + '&body=' + body;\n  });\n\n  el('searchInput').addEventListener('input', debounce(function(e){ STATE.filters.q = e.target.value; renderGrid(); }, 150));\n  el('sortSelect').addEventListener('change', function(e){ STATE.filters.sort = e.target.value; renderGrid(); });\n\n  el('adminEntry').addEventListener('click', openAdmin);\n  el('adminEntryFoot').addEventListener('click', openAdmin);\n  el('adminClose').addEventListener('click', closeAdmin);\n  el('adminSearch').addEventListener('input', debounce(renderAdminTable, 150));\n  el('adminCatFilter').addEventListener('change', renderAdminTable);\n  el('adminMissingOnly').addEventListener('change', renderAdminTable);\n  el('saveBtn').addEventListener('click', saveAndPublish);\n  ['fBusinessName','fWhatsapp','fTaglineEs','fTaglineEn'].forEach(function(id){\n    el(id).addEventListener('input', function(){ STATE.dirty = true; updateSaveStatus(); });\n  });\n\n  document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeCart(); } });\n}\n\nfunction detectEditor(){\n  if(!window.claude || typeof window.claude.use !== 'function'){ return; }\n  window.claude.use('user').then(function(userCap){\n    if(!userCap) return;\n    return userCap.canEdit();\n  }).then(function(canEdit){\n    if(canEdit){\n      STATE.isEditor = true;\n      el('adminEntry').hidden = false;\n      el('adminEntryFoot').hidden = false;\n    }\n  }).catch(function(){});\n}\n\n/* When this catalog is embedded (via iframe) inside the peptides506.com\n   admin app as the public entrance, that parent page posts a small\n   handshake message once the iframe has loaded. Only then do we reveal\n   the \"Staff login\" link and wire it to ask the parent to show its login\n   screen -- so this link stays hidden everywhere else this catalog is\n   used (e.g. published standalone as a Claude artifact), where nothing\n   would be listening for it anyway. */\nfunction detectAdminHost(){\n  window.addEventListener('message', function(ev){\n    if(!ev || !ev.data || ev.data.type !== 'p506-admin-host') return;\n    var goStaff = function(){\n      try{ window.parent.postMessage({type:'p506-staff-login'}, '*'); }catch(e){}\n    };\n    var link = el('pubStaffLink');\n    if(link && link.hidden){\n      link.hidden = false;\n      link.addEventListener('click', goStaff);\n    }\n    var topBtn = el('topbarStaffBtn');\n    if(topBtn && topBtn.hidden){\n      topBtn.hidden = false;\n      topBtn.addEventListener('click', goStaff);\n    }\n  });\n}\n\nfunction init(){\n  wireAgeGate();\n  showAgeGate();\n  wire();\n  applyTheme();\n  try{\n    var initHash = location.hash.replace('#','');\n    if(!initHash){ try{ initHash = decodeURIComponent((hostWindow().location.hash || '').replace('#','')); }catch(e){} }\n    if(initHash.indexOf('p-')===0 && itemById(initHash.slice(2))){\n      STATE.view = 'detail';\n      STATE.detailId = initHash.slice(2);\n    } else if(initHash==='faq'){\n      STATE.view = 'faq';\n    }\n  }catch(e){}\n  populateCountryCodeSelect();\n  initGeoSelects();\n  renderAll();\n  showView();\n  detectEditor();\n  detectAdminHost();\n  initFxRate();\n  loadLiveCatalog();\n  el('custName').value = SAVED_CUST.name;\n  el('custEmail').value = SAVED_CUST.email;\n  if(SAVED_CUST.countryCode) el('custCountryCode').value = SAVED_CUST.countryCode;\n  el('custPhone').value = SAVED_CUST.phone;\n  if(SAVED_CUST.idType) el('custIdType').value = SAVED_CUST.idType;\n  el('custIdNumber').value = SAVED_CUST.idNumber;\n  if(SAVED_CUST.province){\n    el('custProvince').value = SAVED_CUST.province;\n    onProvinceChange();\n    if(SAVED_CUST.canton){\n      el('custCanton').value = SAVED_CUST.canton;\n      onCantonChange();\n      if(SAVED_CUST.district) el('custDistrict').value = SAVED_CUST.district;\n    }\n  }\n  el('custPostal').value = SAVED_CUST.postal;\n  el('custAddress').value = SAVED_CUST.address;\n}\n\nif(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }\n})();\n<\/script>\n";

function goToStaffLogin(){
  /* Sign-in now opens as a popup ON TOP of this catalog (see
     renderAuthScreen's pushModal-based rewrite) rather than replacing
     it, so the catalog stays visible -- and at ITS zoom -- behind the
     dimmed backdrop the whole time. The admin app's own 80% zoom is
     applied later, in enterApp(), only once a real sign-in actually
     happens and the catalog is about to be torn down anyway. */
  authScreenMode = 'signin';
  renderAuthScreen();
}

/* The catalog (running inside the iframe, a separate document) asks to
   switch to staff login via postMessage -- it has no other way to reach
   this outer page's own renderAuthScreen(). Registered once, not per
   render, so repeated sign-out/sign-in cycles don't stack listeners. */
window.addEventListener('message', function(ev){
  if(ev && ev.data && ev.data.type === 'p506-staff-login'){ goToStaffLogin(); }
});

function renderCustomerCatalog(){
  /* The admin app runs at a deliberate 80% CSS zoom (Pedro's own
     preference, set via `html { zoom: 0.8 }`) which is not meant for
     customers and throws off viewport-relative layout math for the
     catalog below. Run the public view at normal zoom -- restored only
     once someone actually signs in (enterApp() sets it back to the
     admin default), since the staff-login popup now floats on top of
     this same catalog rather than replacing it. */
  document.documentElement.style.zoom = '1';
  var root = document.getElementById('app-root');
  /* position:fixed + inset:0 pins this to the actual viewport rather
     than relying on 100vh/height:100% math down a chain of ancestor
     elements, so there's no way for it to end up short of the window
     and reveal blank page background underneath. */
  root.innerHTML =
    '<iframe id="pub-catalog-frame" title="Peptides 506" style="position:fixed;inset:0;border:0;width:100%;height:100%;display:block"></iframe>';
  var frame = document.getElementById('pub-catalog-frame');
  /* Tell the catalog we're the admin host once it has actually loaded,
     so it can reveal its own in-footer "Staff login" link -- it stays
     hidden anywhere else this same catalog is used (e.g. a standalone
     Claude artifact), where nothing would be listening for it. */
  frame.addEventListener('load', function(){
    try{ frame.contentWindow.postMessage({type:'p506-admin-host'}, '*'); }catch(e){}
  });
  frame.srcdoc = PUBLIC_CATALOG_HTML;
}

bootAuth();

})();
