function renderMiniOrderTable(list, kind){
  if(!list.length) return '<p class="muted small">' + esc(t('nothing_yet')) + '</p>';
  var rows = list.map(function(o){
    var who = kind === 'po' ? (byId(state.suppliers, o.supplierId)||{}).name : (byId(state.customers, o.customerId)||{}).name;
    var total = kind === 'po' ? poTotal(o) : soTotal(o);
    return '<tr class="row-click" data-open="' + kind + '" data-id="' + o.id + '">' +
      '<td>' + esc(who || '—') + '</td><td>' + fmtDate(o.date) + '</td><td>' + statusChip(o.status) + '</td><td class="num">' + fmtMoney(total) + '</td>' +
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>' + (kind==='po'?esc(t('mini_supplier_header')):esc(t('mini_customer_header'))) + '</th><th>' + esc(t('mini_date')) + '</th><th>' + esc(t('mini_status')) + '</th><th class="num">' + esc(t('mini_total')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

var expandedSupplier = null;
/* Ephemeral (not persisted) selection state for building a purchase order
   directly from a supplier's catalog panel. Keyed by "supplierId|variantId". */
var catalogSelection = {};
function renderSuppliers(){
  var html = '<div class="view-header"><div><h1>' + esc(t('sup_title')) + '</h1><div class="sub">' + esc(t('sup_sub')) + '</div></div>' +
    '<div class="actions"><button class="btn btn-primary" data-act="new-supplier">' + esc(t('sup_new_btn')) + '</button></div></div>';

  if(!state.suppliers.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('sup_empty_title')) + '</div>' + esc(t('sup_empty_body')) + '</div>';
    return html;
  }

  var rows = sortBy(state.suppliers, function(s){ return s.name.toLowerCase(); }).map(function(s){
    var catalogCount = state.supplierProducts.filter(function(sp){ return sp.supplierId === s.id; }).length;
    var isOpen = expandedSupplier === s.id;
    var rowHtml = '<tr class="row-click" data-toggle-supplier="' + s.id + '">' +
      '<td><button class="expand-toggle' + (isOpen?' open':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button> ' + esc(s.name) + '</td>' +
      '<td class="muted">' + esc(s.contact || '—') + '</td>' +
      '<td class="muted">' + esc(s.phone || s.email || '—') + '</td>' +
      '<td class="num">' + catalogCount + '</td>' +
      '<td class="num">' + fmtMoney(supplierTotalPurchased(s.id)) + '</td>' +
      '<td style="white-space:nowrap">' + (isAdmin ? '<button class="btn btn-sm" data-import-catalog="' + s.id + '">' + esc(t('import_catalog_btn')) + '</button> ' : '') + '<button class="btn btn-sm" data-edit-supplier="' + s.id + '">' + esc(t('edit_btn')) + '</button></td>' +
    '</tr>';
    if(isOpen){
      var prices = state.supplierProducts.filter(function(sp){ return sp.supplierId === s.id; });
      var body;
      if(!prices.length){
        body = '<p class="muted small">' + esc(t('sup_no_catalog')) + '</p>';
      } else {
        var byProduct = {};
        prices.forEach(function(sp){
          var v = byId(state.variants, sp.variantId);
          if(!v) return;
          var p = byId(state.products, v.productId);
          if(!p) return;
          if(!byProduct[p.id]) byProduct[p.id] = { product: p, items: [] };
          byProduct[p.id].items.push({ sp: sp, v: v });
        });
        var groups = sortBy(Object.keys(byProduct).map(function(k){ return byProduct[k]; }), function(g){ return g.product.name.toLowerCase(); });
        var groupsHTML = groups.map(function(g){
          var itemsHTML = sortBy(g.items, function(it){ return it.v.label.toLowerCase(); }).map(function(it){
            var sp = it.sp, v = it.v;
            var compare = supplierPricesForVariant(v.id);
            var isBest = compare.length > 0 && compare[0].supplierId === s.id;
            var diff = compare.length ? (Number(sp.unitCost) - compare[0].unitCost) : 0;
            var key = s.id + '|' + v.id;
            var sel = catalogSelection[key];
            var checked = !!sel;
            var qty = sel ? sel.qty : 1;
            return '<div class="price-row cat-row' + (isBest?' best':'') + '">' +
              '<label class="cat-check"><input type="checkbox" data-cat-select="' + esc(key) + '"' + (checked?' checked':'') + '> <span class="p-supplier">' + esc(v.label) + (v.sku ? ' <span class="faint small">SKU ' + esc(v.sku) + '</span>' : '') + (sp.isPreferred ? ' <span class="chip accent">' + esc(t('chip_preferred')) + '</span>' : '') + '</span></label>' +
              '<span class="cat-mid">' + (isBest ? '<span class="best-badge">' + esc(t('best_badge')) + '</span>' : (diff > 0.004 ? '<span class="faint small">' + esc(tf('vs_best_label', { amount: fmtMoney(diff) })) + '</span>' : '')) + '</span>' +
              '<span class="p-cost">' + fmtMoney(sp.unitCost) + '</span>' +
              '<input type="number" class="cat-qty" min="1" step="1" value="' + esc(qty) + '" data-cat-qty="' + esc(key) + '"' + (checked?'':' disabled') + '>' +
            '</div>';
          }).join('');
          return '<div class="cat-group"><div class="cat-group-title">' + esc(g.product.name) + '</div>' + itemsHTML + '</div>';
        }).join('');
        var selectedCount = Object.keys(catalogSelection).filter(function(k){ return k.indexOf(s.id + '|') === 0; }).length;
        body = '<div class="price-list cat-list">' + groupsHTML + '</div>' +
          '<div class="cat-actions"><button type="button" class="btn btn-primary btn-sm" data-create-po-from-catalog="' + s.id + '"' + (selectedCount ? '' : ' disabled') + '>' + esc(tf('create_po_from_catalog_btn', { count: selectedCount })) + '</button></div>';
      }
      rowHtml += '<tr><td colspan="6" class="expand-panel">' + body + '</td></tr>';
    }
    return rowHtml;
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('sup_col_name')) + '</th><th>' + esc(t('sup_col_contact')) + '</th><th>' + esc(t('sup_col_phone')) + '</th><th class="num">' + esc(t('sup_col_products')) + '</th><th class="num">' + esc(t('sup_col_total')) + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return html;
}

var expandedProduct = null;
/* Ephemeral (not persisted) selection state for building a purchase order
   directly from the Products page. Keyed by "variantId|supplierId", since a
   single product page can have selections spanning several suppliers. */
var productSelection = {};
var productSearchQuery = '';

/* Inline retail-price/public editing, used by both the Products page's
   expanded row and the In Stock page — lets an admin set a variant's
   customer-facing price right where they're looking at it, instead of
   having to open the separate Edit-product modal just for that. Mirrors
   the validation + save flow the modal's own save button uses. */
function saveVariantPricing(variantId, priceRaw, isPublicVal){
  var v = byId(state.variants, variantId);
  if(!v) return;
  var price = (priceRaw === '' || priceRaw === null || priceRaw === undefined) ? null : Number(priceRaw);
  if(price != null && isNaN(price)) price = null;
  if(isPublicVal && price == null){
    toast(t('err_public_variant_needs_price'), true);
    render();
    return;
  }
  v.retailPriceUsd = price;
  v.isPublic = !!isPublicVal;
  persist();
  toast(t('toast_price_updated'));
}
function renderProducts(){
  var html = '<div class="view-header"><div><h1>' + esc(t('prod_title')) + '</h1><div class="sub">' + esc(t('prod_sub')) + '</div></div>' +
    '<div class="actions"><button class="btn btn-primary" data-act="new-product">' + esc(t('prod_new_btn')) + '</button></div></div>';

  if(!state.products.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('prod_empty_title')) + '</div>' + esc(t('prod_empty_body')) + '</div>';
    return html;
  }

  html += '<div class="field" style="max-width:360px;margin-bottom:16px">' +
    '<input type="text" id="product-search" placeholder="' + esc(t('prod_search_placeholder')) + '" value="' + esc(productSearchQuery) + '">' +
  '</div>';

  var query = productSearchQuery.trim().toLowerCase();
  var visibleProducts = !query ? state.products : state.products.filter(function(p){
    return p.name.toLowerCase().indexOf(query) !== -1 || productCategory(p).toLowerCase().indexOf(query) !== -1;
  });

  if(!visibleProducts.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('prod_search_empty_title')) + '</div>' + esc(t('prod_search_empty_body')) + '</div>';
    return html;
  }

  var selectedKeys = Object.keys(productSelection);
  if(selectedKeys.length){
    var bySupplier = {};
    selectedKeys.forEach(function(key){
      var parts = key.split('|');
      var variantId = parts[0], supplierId = parts[1];
      var v = byId(state.variants, variantId);
      if(!v) return;
      var s = byId(state.suppliers, supplierId);
      if(!bySupplier[supplierId]) bySupplier[supplierId] = { supplierName: s ? s.name : '(deleted supplier)', count: 0 };
      bySupplier[supplierId].count++;
    });
    var groupIds = Object.keys(bySupplier);
    if(groupIds.length){
      html += '<div class="prod-cart">' +
        sortBy(groupIds.map(function(id){ return { id: id, g: bySupplier[id] }; }), function(x){ return x.g.supplierName.toLowerCase(); }).map(function(x){
          return '<div class="prod-cart-row">' +
            '<span>' + esc(tf('prod_cart_line', { count: x.g.count, supplier: x.g.supplierName })) + '</span>' +
            '<button type="button" class="btn btn-primary btn-sm" data-create-po-for-supplier="' + x.id + '">' + esc(t('prod_cart_create_btn')) + '</button>' +
          '</div>';
        }).join('') +
      '</div>';
    }
  }

  var rows = sortBy(visibleProducts, function(p){ return p.name.toLowerCase(); }).map(function(p){
    var variants = variantsForProduct(p.id);
    var isOpen = expandedProduct === p.id;
    var totalStock = variants.reduce(function(s,v){ return s + stockForVariant(v.id); }, 0);
    var pDesc = productDescription(p);
    var rowHtml = '<tr class="row-click" data-toggle-product="' + p.id + '"' + (pDesc ? ' title="' + esc(pDesc) + '"' : '') + '>' +
      '<td><button class="expand-toggle' + (isOpen?' open':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button> ' + esc(p.name) + '</td>' +
      '<td class="muted">' + esc(productCategory(p) || '—') + '</td>' +
      '<td class="num">' + variants.length + '</td>' +
      '<td class="num' + (totalStock<=0?' critical':'') + '">' + totalStock + '</td>' +
      '<td><button class="btn btn-sm" data-edit-product="' + p.id + '">' + esc(t('edit_btn')) + '</button></td>' +
    '</tr>';
    if(isOpen){
      var sellerOnlyRow = isSellerOnly();
      var body = variants.map(function(v){
        var stock = stockForVariant(v.id);
        var publicChip = isAdmin ?
          ('<div class="variant-inline-price" style="display:flex;align-items:center;gap:8px;">' +
            '<input type="number" class="num" style="width:92px" step="0.01" min="0" placeholder="' + esc(t('variant_placeholder_retail')) + '" value="' + (v.retailPriceUsd != null && v.retailPriceUsd !== '' ? v.retailPriceUsd : '') + '" data-variant-price="' + v.id + '">' +
            '<label class="small" title="' + esc(t('variant_is_public_title')) + '" style="display:flex;align-items:center;gap:4px;white-space:nowrap;">' +
              '<input type="checkbox" data-variant-public="' + v.id + '"' + (v.isPublic ? ' checked' : '') + '> ' + esc(t('variant_col_public')) +
            '</label>' +
          '</div>') : '';
        var head = '<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap;">' +
            '<div><strong>' + esc(v.label) + '</strong>' + (v.sku ? ' <span class="faint small">SKU ' + esc(v.sku) + '</span>' : '') + '</div>' +
            '<div style="display:flex;align-items:center;gap:10px;">' + publicChip + '<div class="chip' + (stock<=0?' critical':stock<5?' warn':' good') + '">' + esc(t('stock_label')) + ' ' + stock + '</div></div>' +
          '</div>';
        /* Sellers never see supplier pricing/catalog data — not even a
           "no prices yet" placeholder, since that section shouldn't exist
           for them at all. */
        if(sellerOnlyRow) return head + '</div>';
        var prices = supplierPricesForVariant(v.id);
        return head +
          (prices.length ?
            '<div class="price-list">' + prices.map(function(r, i){
              var key = v.id + '|' + r.supplierId;
              var sel = productSelection[key];
              var checked = !!sel;
              var qty = sel ? sel.qty : 1;
              var diff = i === 0 ? 0 : (r.unitCost - prices[0].unitCost);
              return '<div class="price-row cat-row' + (i===0?' best':'') + '">' +
                '<label class="cat-check"><input type="checkbox" data-prod-select="' + esc(key) + '"' + (checked?' checked':'') + '> <span class="p-supplier">' + (i===0?'<span class="best-badge">' + esc(t('best_badge')) + '</span> ':'') + esc(r.supplierName) + (r.isPreferred?' <span class="chip accent">' + esc(t('chip_preferred')) + '</span>':'') + '</span></label>' +
                '<span class="cat-mid">' + (i>0 && diff > 0.004 ? '<span class="faint small">' + esc(tf('vs_best_label', { amount: fmtMoney(diff) })) + '</span>' : '') + '</span>' +
                '<span class="p-cost">' + fmtMoney(r.unitCost) + '</span>' +
                '<input type="number" class="cat-qty" min="1" step="1" value="' + esc(qty) + '" data-prod-qty="' + esc(key) + '"' + (checked?'':' disabled') + '>' +
                (isAdmin ? '<button type="button" class="link-btn small" data-edit-price="' + v.id + '|' + r.supplierId + '" title="' + esc(t('edit_price_btn')) + '">✎</button>' : '') +
              '</div>';
            }).join('') + '</div>' :
            '<p class="muted small">' + esc(t('prod_no_prices')) + '</p>') +
          (isAdmin ? '<button type="button" class="link-btn" style="margin-top:8px" data-add-price="' + v.id + '">' + esc(t('add_supplier_price_btn')) + '</button>' : '') +
        '</div>';
      }).join('');
      rowHtml += '<tr><td colspan="5" class="expand-panel">' + body + '</td></tr>';
    }
    return rowHtml;
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('prod_col_product')) + '</th><th>' + esc(t('prod_col_category')) + '</th><th class="num">' + esc(t('prod_col_variants')) + '</th><th class="num">' + esc(t('prod_col_stock')) + '</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return html;
}

/* =========================================================================
   VIEW: In stock — a simple, read-only, searchable list of every variant
   that currently has stock > 0 (same stockForVariant()/inStockVariants()
   used by the dashboard's "In stock" panel, just as its own full page
   instead of a capped-height summary). Visible to everyone, sellers
   included, since knowing what's available to sell doesn't touch
   supplier pricing or purchase-order data.
   ========================================================================= */
var instockSearchQuery = '';
function renderInStock(){
  var html = '<div class="view-header"><div><h1>' + esc(t('instock_title')) + '</h1><div class="sub">' + esc(t('instock_sub')) + '</div></div></div>';

  var rows0 = inStockVariants();
  if(!rows0.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('instock_empty_title')) + '</div>' + esc(t('instock_empty_body')) + '</div>';
    return html;
  }

  html += '<div class="field" style="max-width:360px;margin-bottom:16px">' +
    '<input type="text" id="instock-search" placeholder="' + esc(t('instock_search_placeholder')) + '" value="' + esc(instockSearchQuery) + '">' +
  '</div>';

  var query = instockSearchQuery.trim().toLowerCase();
  var rows = rows0.map(function(r){
    var p = byId(state.products, r.variant.productId);
    return { variant: r.variant, stock: r.stock, product: p, category: p ? productCategory(p) : '' };
  }).filter(function(r){ return r.product; });
  if(query){
    rows = rows.filter(function(r){
      return r.product.name.toLowerCase().indexOf(query) !== -1 ||
        r.variant.label.toLowerCase().indexOf(query) !== -1 ||
        (r.category || '').toLowerCase().indexOf(query) !== -1;
    });
  }
  rows = sortBy(rows, function(r){ return (r.product.name + ' ~ ' + r.variant.label).toLowerCase(); });

  if(!rows.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('prod_search_empty_title')) + '</div>' + esc(t('prod_search_empty_body')) + '</div>';
    return html;
  }

  var rowsHTML = rows.map(function(r){
    var chipClass = r.stock < 5 ? 'warn' : 'good';
    var v = r.variant;
    return '<tr>' +
      '<td>' + esc(r.product.name) + '</td>' +
      '<td>' + esc(v.label) + (v.sku ? ' <span class="faint small">SKU ' + esc(v.sku) + '</span>' : '') + '</td>' +
      '<td class="muted">' + esc(r.category || '—') + '</td>' +
      '<td class="num"><span class="chip ' + chipClass + '">' + r.stock + '</span></td>' +
      (isAdmin ?
        '<td><input type="number" class="num" style="width:92px" step="0.01" min="0" placeholder="' + esc(t('variant_placeholder_retail')) + '" value="' + (v.retailPriceUsd != null && v.retailPriceUsd !== '' ? v.retailPriceUsd : '') + '" data-variant-price="' + v.id + '"></td>' +
        '<td><input type="checkbox" title="' + esc(t('variant_is_public_title')) + '" data-variant-public="' + v.id + '"' + (v.isPublic ? ' checked' : '') + '></td>'
        : '') +
    '</tr>';
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('prod_col_product')) + '</th><th>' + esc(t('instock_col_variant')) + '</th><th>' + esc(t('prod_col_category')) + '</th><th class="num">' + esc(t('instock_col_stock')) + '</th>' +
    (isAdmin ? '<th>' + esc(t('variant_col_retail')) + '</th><th>' + esc(t('variant_col_public')) + '</th>' : '') +
    '</tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
  return html;
}

function renderPurchaseOrders(){
  var html = '<div class="view-header"><div><h1>' + esc(t('po_title')) + '</h1><div class="sub">' + esc(t('po_sub')) + '</div></div>' +
    '<div class="actions"><button class="btn btn-primary" data-act="new-po"' + (state.suppliers.length?'':' disabled') + '>' + esc(t('po_new_btn')) + '</button></div></div>';

  if(!state.purchaseOrders.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('po_empty_title')) + '</div>' + esc(state.suppliers.length ? t('po_empty_body_has_sup') : t('po_empty_body_no_sup')) + '</div>';
    return html;
  }

  /* Received + Ordered totals, and a grand total of the two -- Draft and
     Cancelled orders aren't real commitments yet, so (matching the same
     convention as supplierTotalPurchased()/so_total_sales) they're left out
     of all three figures here. */
  var receivedTotal = state.purchaseOrders.filter(function(po){ return po.status === 'received'; })
    .reduce(function(sum, po){ return sum + poTotal(po); }, 0);
  var orderedTotal = state.purchaseOrders.filter(function(po){ return po.status === 'ordered'; })
    .reduce(function(sum, po){ return sum + poTotal(po); }, 0);
  html += '<div class="grid stat-row" style="margin-bottom:18px">' +
    '<div class="stat-card"><div class="label">' + esc(t('po_total_received_label')) + '</div><div class="value">' + fmtMoney(receivedTotal) + '</div></div>' +
    '<div class="stat-card"><div class="label">' + esc(t('po_total_ordered_label')) + '</div><div class="value">' + fmtMoney(orderedTotal) + '</div></div>' +
    '<div class="stat-card"><div class="label">' + esc(t('po_total_grand_label')) + '</div><div class="value">' + fmtMoney(receivedTotal + orderedTotal) + '</div></div>' +
  '</div>';

  var rows = sortBy(state.purchaseOrders, function(p){ return p.date; }).reverse().map(function(po){
    var s = byId(state.suppliers, po.supplierId);
    var lineCount = state.poLineItems.filter(function(li){ return li.poId===po.id; }).length;
    return '<tr class="row-click" data-edit-po="' + po.id + '">' +
      '<td>' + esc(s ? s.name : '(deleted supplier)') + '</td>' +
      '<td>' + fmtDate(po.date) + '</td>' +
      '<td>' + statusChip(po.status) + '</td>' +
      '<td>' + trackingCellHTML(po) + '</td>' +
      '<td class="num">' + lineCount + '</td>' +
      '<td class="num">' + fmtMoney(poTotal(po)) + '</td>' +
      '<td>' + userChipHTML(po.createdBy) + '</td>' +
    '</tr>';
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('po_col_supplier')) + '</th><th>' + esc(t('po_col_date')) + '</th><th>' + esc(t('po_col_status')) + '</th><th>' + esc(t('po_col_tracking')) + '</th><th class="num">' + esc(t('po_col_lines')) + '</th><th class="num">' + esc(t('po_col_total')) + '</th><th>' + esc(t('po_col_by')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return html;
}

function renderSalesOrders(){
  /* Internal Use records share this same table but live on their own page
     now (see renderInternalUse) — never show them here, and never count
     them into this page's own stats. */
  var salesOnly = state.salesOrders.filter(function(so){ return so.orderKind !== 'internal_use'; });

  var html = '<div class="view-header"><div><h1>' + esc(t('so_title')) + '</h1><div class="sub">' + esc(t('so_sub')) + '</div></div>' +
    '<div class="actions"><button class="btn btn-primary" data-act="new-so"' + (state.customers.length?'':' disabled') + '>' + esc(t('so_new_btn')) + '</button></div></div>';

  if(!salesOnly.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('so_empty_title')) + '</div>' + esc(state.customers.length ? t('so_empty_body_has_cus') : t('so_empty_body_no_cus')) + '</div>';
    return html;
  }

  /* Total sales — completed orders only, matching the same convention
     already used for customerTotalPurchased()/supplierTotalPurchased()
     (a draft or cancelled order isn't a real sale yet). */
  var completedOrders = salesOnly.filter(function(so){ return so.status === 'completed'; });
  var totalSales = completedOrders.reduce(function(sum, so){ return sum + soTotal(so); }, 0);
  html += '<div class="grid stat-row" style="margin-bottom:18px">' +
    '<div class="stat-card"><div class="label">' + esc(t('so_total_sales_label')) + '</div><div class="value">' + fmtMoney(totalSales) + '</div></div>' +
  '</div>';

  var rows = sortBy(salesOnly, function(s){ return s.date; }).reverse().map(function(so){
    var c = byId(state.customers, so.customerId);
    var lineCount = state.soLineItems.filter(function(li){ return li.soId===so.id; }).length;
    return '<tr class="row-click" data-edit-so="' + so.id + '">' +
      '<td style="white-space:nowrap;font-weight:600">' + esc(so.orderNumber || '') + '</td>' +
      '<td>' + esc(c ? c.name : '(deleted customer)') + '</td>' +
      '<td>' + fmtDate(so.date) + '</td>' +
      '<td>' + statusChip(so.status) + '</td>' +
      '<td>' + trackingCellHTML(so) + '</td>' +
      '<td class="num">' + lineCount + '</td>' +
      '<td class="num">' + fmtMoney(soTotal(so)) + '</td>' +
      '<td>' + userChipHTML(so.createdBy) + '</td>' +
    '</tr>';
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('so_col_number')) + '</th><th>' + esc(t('so_col_customer')) + '</th><th>' + esc(t('po_col_date')) + '</th><th>' + esc(t('po_col_status')) + '</th><th>' + esc(t('so_col_tracking')) + '</th><th class="num">' + esc(t('po_col_lines')) + '</th><th class="num">' + esc(t('po_col_total')) + '</th><th>' + esc(t('po_col_by')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return html;
}

function renderInternalUse(){
  var records = state.salesOrders.filter(function(so){ return so.orderKind === 'internal_use'; });

  var html = '<div class="view-header"><div><h1>' + esc(t('iu_title')) + '</h1><div class="sub">' + esc(t('iu_sub')) + '</div></div>' +
    '<div class="actions"><button class="btn btn-primary" data-act="new-internal-use">' + esc(t('iu_new_btn')) + '</button></div></div>';

  if(!records.length){
    html += '<div class="empty-state"><div class="display">' + esc(t('iu_empty_title')) + '</div>' + esc(t('iu_empty_body')) + '</div>';
    return html;
  }

  /* Real cost — the landed cost (per each line's chosen source PO) of
     everything active on this page, so Pedro can see what staff/self-use
     actually cost him. Cancelled records, and lines with no source PO
     picked yet, contribute $0. */
  var totalCost = records.filter(function(so){ return so.status !== 'cancelled'; })
    .reduce(function(sum, so){
      return sum + state.soLineItems.filter(function(li){ return li.soId === so.id; })
        .reduce(function(s, li){ return s + (Number(li.qty)||0) * (Number(li.sourceCostUsd)||0); }, 0);
    }, 0);
  html += '<div class="grid stat-row" style="margin-bottom:18px">' +
    '<div class="stat-card"><div class="label">' + esc(t('iu_cost_label')) + '</div><div class="value">' + fmtMoney(totalCost) + '</div></div>' +
  '</div>';

  var rows = sortBy(records, function(s){ return s.date; }).reverse().map(function(so){
    var lineItems = state.soLineItems.filter(function(li){ return li.soId===so.id; });
    var cost = lineItems.reduce(function(s, li){ return s + (Number(li.qty)||0) * (Number(li.sourceCostUsd)||0); }, 0);
    return '<tr class="row-click" data-edit-internal-use="' + so.id + '">' +
      '<td>' + fmtDate(so.date) + '</td>' +
      '<td>' + esc(so.usedBy || '—') + '</td>' +
      '<td>' + internalUseStatusChip(so.status) + '</td>' +
      '<td class="num">' + lineItems.length + '</td>' +
      '<td class="num">' + fmtMoney(cost) + '</td>' +
      '<td>' + userChipHTML(so.createdBy) + '</td>' +
    '</tr>';
  }).join('');

  html += '<div class="table-wrap"><table><thead><tr><th>' + esc(t('po_col_date')) + '</th><th>' + esc(t('iu_col_used_by')) + '</th><th>' + esc(t('po_col_status')) + '</th><th class="num">' + esc(t('po_col_lines')) + '</th><th class="num">' + esc(t('col_line_cost')) + '</th><th>' + esc(t('po_col_by')) + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  return html;
}

/* ------------------------------ dispatch -------------------------------- */

function renderView(){
  if(isSellerOnly() && (currentTab === 'suppliers' || currentTab === 'purchases' || currentTab === 'internal_use')){
    currentTab = 'dashboard';
    sessionStorage.setItem('manifest_tab', currentTab);
  }
  switch(currentTab){
    case 'suppliers': return renderSuppliers();
    case 'customers': return renderCustomers();
    case 'products': return renderProducts();
    case 'instock': return renderInStock();
    case 'purchases': return renderPurchaseOrders();
    case 'sales': return renderSalesOrders();
    case 'internal_use': return renderInternalUse();
    default: return renderDashboard();
  }
}

function render(){
  document.documentElement.lang = lang;
  var root = document.getElementById('app-root');
  /* Full re-render replaces the DOM, which would normally drop focus (and
     cursor position) out of whatever text input the person is typing in —
     e.g. a live search box. Capture it beforehand and restore it after. */
  var active = document.activeElement;
  var restoreId = null, restoreStart = null, restoreEnd = null;
  if(active && root.contains(active) && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')){
    restoreId = active.id;
    if(typeof active.selectionStart === 'number'){ restoreStart = active.selectionStart; restoreEnd = active.selectionEnd; }
  }
  root.innerHTML =
    '<div id="app-shell">' +
      '<button id="menu-toggle" class="btn btn-ghost" aria-label="Menu" style="position:fixed;top:14px;left:14px;z-index:95;">' + iconMenu(false) + '</button>' +
      '<aside id="sidebar">' + renderSidebar() + '</aside>' +
      '<main id="main">' + renderView() + '</main>' +
    '</div>';
  attachEvents();
  setSyncIndicator(saving ? 'busy' : 'ok');
  if(restoreId){
    var el = document.getElementById(restoreId);
    if(el){
      el.focus();
      if(restoreStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(restoreStart, restoreEnd); } catch(e){}
      }
    }
  }
}

function attachEvents(){
  document.querySelectorAll('.navlink').forEach(function(btn){
    btn.addEventListener('click', function(){
      currentTab = btn.getAttribute('data-tab');
      sessionStorage.setItem('manifest_tab', currentTab);
      document.getElementById('sidebar').classList.remove('open');
      render();
    });
  });
  var menuToggle = document.getElementById('menu-toggle');
  if(menuToggle) menuToggle.addEventListener('click', function(){
    var sb = document.getElementById('sidebar');
    var open = sb.classList.toggle('open');
    menuToggle.innerHTML = iconMenu(open);
  });
  var settingsBtn = document.getElementById('settings-btn');
  if(settingsBtn) settingsBtn.addEventListener('click', function(){ openSettingsModal(); });
  var yourNameBtn = document.getElementById('your-name-btn');
  if(yourNameBtn) yourNameBtn.addEventListener('click', function(){ openYourNameModal(); });
  var signOutBtn = document.getElementById('sign-out-btn');
  if(signOutBtn) signOutBtn.addEventListener('click', function(){ signOut(); });

  document.querySelectorAll('[data-set-theme]').forEach(function(btn){
    btn.addEventListener('click', function(){ setTheme(btn.getAttribute('data-set-theme')); render(); });
  });
  document.querySelectorAll('[data-set-lang]').forEach(function(btn){
    btn.addEventListener('click', function(){ setLang(btn.getAttribute('data-set-lang')); render(); });
  });

  var newSupBtn = document.querySelector('[data-act="new-supplier"]');
  if(newSupBtn) newSupBtn.addEventListener('click', function(){ openSupplierModal(null); });
  var newCusBtn = document.querySelector('[data-act="new-customer"]');
  if(newCusBtn) newCusBtn.addEventListener('click', function(){ openCustomerModal(null); });
  var newProdBtn = document.querySelector('[data-act="new-product"]');
  if(newProdBtn) newProdBtn.addEventListener('click', function(){ openProductModal(null, null); });
  var prodSearch = document.getElementById('product-search');
  if(prodSearch) prodSearch.addEventListener('input', function(){
    productSearchQuery = prodSearch.value;
    render();
  });
  var instockSearch = document.getElementById('instock-search');
  if(instockSearch) instockSearch.addEventListener('input', function(){
    instockSearchQuery = instockSearch.value;
    render();
  });
  var newPOBtn = document.querySelector('[data-act="new-po"]');
  if(newPOBtn) newPOBtn.addEventListener('click', function(){ openPOModal(null); });
  var newSOBtn = document.querySelector('[data-act="new-so"]');
  if(newSOBtn) newSOBtn.addEventListener('click', function(){ openSOModal(null); });
  var newIUBtn = document.querySelector('[data-act="new-internal-use"]');
  if(newIUBtn) newIUBtn.addEventListener('click', function(){ openInternalUseModal(null); });

  document.querySelectorAll('[data-toggle-supplier]').forEach(function(el){
    el.addEventListener('click', function(e){
      if(e.target.closest('[data-edit-supplier]') || e.target.closest('[data-import-catalog]')) return;
      var id = el.getAttribute('data-toggle-supplier');
      expandedSupplier = expandedSupplier === id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-edit-supplier]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); openSupplierModal(byId(state.suppliers, el.getAttribute('data-edit-supplier'))); });
  });
  document.querySelectorAll('[data-import-catalog]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); openImportCatalogModal(byId(state.suppliers, el.getAttribute('data-import-catalog'))); });
  });
  document.querySelectorAll('[data-cat-select]').forEach(function(el){
    el.addEventListener('change', function(){
      var key = el.getAttribute('data-cat-select');
      if(el.checked){ catalogSelection[key] = catalogSelection[key] || { qty: 1 }; }
      else { delete catalogSelection[key]; }
      render();
    });
  });
  document.querySelectorAll('[data-cat-qty]').forEach(function(el){
    el.addEventListener('change', function(){
      var key = el.getAttribute('data-cat-qty');
      var q = Math.max(1, Math.round(Number(el.value)) || 1);
      if(catalogSelection[key]) catalogSelection[key].qty = q;
      render();
    });
  });
  document.querySelectorAll('[data-create-po-from-catalog]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var supplierId = el.getAttribute('data-create-po-from-catalog');
      var lines = Object.keys(catalogSelection).filter(function(k){ return k.indexOf(supplierId + '|') === 0; }).map(function(k){
        var variantId = k.slice(supplierId.length + 1);
        var entry = catalogEntry(supplierId, variantId);
        return { variantId: variantId, qty: catalogSelection[k].qty, unitCost: entry ? entry.unitCost : '' };
      });
      if(!lines.length) return;
      catalogSelection = {};
      openPOModal(null, { supplierId: supplierId, lines: lines });
    });
  });
  document.querySelectorAll('[data-edit-customer]').forEach(function(el){
    el.addEventListener('click', function(){ openCustomerModal(byId(state.customers, el.getAttribute('data-edit-customer'))); });
  });

  document.querySelectorAll('[data-toggle-product]').forEach(function(el){
    el.addEventListener('click', function(e){
      if(e.target.closest('[data-edit-product]')) return;
      var id = el.getAttribute('data-toggle-product');
      expandedProduct = expandedProduct === id ? null : id;
      render();
    });
  });
  document.querySelectorAll('[data-edit-product]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); openProductModal(byId(state.products, el.getAttribute('data-edit-product')), null); });
  });
  document.querySelectorAll('[data-add-price]').forEach(function(el){

  document.querySelectorAll('[data-variant-price]').forEach(function(el){

      /* Setting a price is how staff mean "sell this on the site" -- keep
         the checkbox in sync automatically instead of requiring a second,
         easy-to-miss click. Clearing the price un-publics it the same way.
         The checkbox itself can still be unchecked manually afterward to
         hide a priced item without erasing its price. */
      if(pub){ pub.checked = el.value !== ''; }
      saveVariantPricing(id, el.value, pub ? pub.checked : false);

  });
  document.querySelectorAll('[data-variant-public]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); });

  });
  document.querySelectorAll('[data-create-po-for-supplier]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var supplierId = el.getAttribute('data-create-po-for-supplier');
      var lines = Object.keys(productSelection).filter(function(key){ return key.split('|')[1] === supplierId; }).map(function(key){
        var variantId = key.split('|')[0];

        var line = { variantId: variantId, qty: productSelection[key].qty, unitCost: entry ? entry.unitCost : '' };
        delete productSelection[key];
        return line;
      });
      if(!lines.length) return;
      openPOModal(null, { supplierId: supplierId, lines: lines });
    });
  });

  document.querySelectorAll('[data-stop-row-click]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  document.querySelectorAll('[data-edit-po]').forEach(function(el){

  });

  });
  document.querySelectorAll('[data-open="so"]').forEach(function(el){

  });

/* One-time admin tool: paste the JSON exported from the old single-file
   version of this app (its `state` object) and push it into Supabase.
   Falls back to the current admin as the recorded creator for every
   migrated record — createdBy (the display name shown in the UI) is
   preserved as-is from the export either way. */
function importLegacyJSON(raw){
  var legacy;
  try { legacy = JSON.parse(raw); } catch(e){ return Promise.reject(new Error(t('legacy_import_err_parse'))); }
  var priorApiKey = state.settings && state.settings.currencyApiKey;
  var next = emptyState();
  ['suppliers','customers','products','variants','supplierProducts','purchaseOrders','poLineItems','salesOrders','soLineItems'].forEach(function(k){
    if(Array.isArray(legacy[k])) next[k] = legacy[k];
  });
  if(legacy.settings && typeof legacy.settings === 'object'){
    next.settings.exchangeRate = legacy.settings.exchangeRate || null;
  }
  next.settings.currencyApiKey = priorApiKey || null;
  state = next;
  return syncToSupabase();
}

/* Admin tool: paste a JSON array of {name, category, description} and fill
   in those two fields on existing products, matched by exact (trimmed,
   case-insensitive) name. Never creates products, never touches anything
   else about them — safe to run repeatedly. */
function importProductDetails(raw){
  var list;
  try { list = JSON.parse(raw); } catch(e){ return Promise.reject(new Error(t('product_details_import_err_parse'))); }
  if(!Array.isArray(list)) return Promise.reject(new Error(t('product_details_import_err_parse')));
  var updated = 0, skipped = [];
  list.forEach(function(item){
    if(!item || !item.name) return;
    var key = String(item.name).trim().toLowerCase();
    /* Update every product with this name, not just the first — a couple
       of names in real data are exact duplicates (two separate rows). */
    var matches = state.products.filter(function(p){ return p.name.trim().toLowerCase() === key; });
    if(!matches.length){ skipped.push(item.name); return; }
    var catEs = item.categoryEs !== undefined ? item.categoryEs : item.category_es;
    var descEs = item.descriptionEs !== undefined ? item.descriptionEs : item.description_es;
    matches.forEach(function(product){
      if(item.category !== undefined && item.category !== null) product.category = String(item.category);
      if(item.description !== undefined && item.description !== null) product.description = String(item.description);
      if(catEs !== undefined && catEs !== null) product.categoryEs = String(catEs);
      if(descEs !== undefined && descEs !== null) product.descriptionEs = String(descEs);
      updated++;
    });
  });
  return syncToSupabase().then(function(){ return { updated: updated, skipped: skipped }; });
}

/* The sign-in/sign-up screen lives in the SAME modal system as every other
   form in the app (pushModal/#modal-root) instead of overwriting #app-root
   — so on the merged public site, where #app-root already holds the
   customer catalog iframe, opening this just floats a dismissible popup on
   top of it (with the standard × in the corner, same as every other modal)
   rather than tearing the catalog down to show a bare login page. Cancel
   or × simply closes the popup; the catalog underneath was never touched,
   so it's still exactly as the visitor left it, no reload. */
var authModalEntry = null;
function closeAuthModal(){
  var idx = modalStack.indexOf(authModalEntry);
  if(idx !== -1){ while(modalStack.length > idx) closeTopModal(); }
  authModalEntry = null;
}
function renderAuthScreen(errorMsg){
  document.documentElement.lang = lang;
  closeAuthModal(); /* re-opening (mode switch, error, etc.) replaces the popup rather than stacking another one on top */
  var isSignup = authScreenMode === 'signup';
  pushModal({
    title: isSignup ? t('auth_signup_title') : t('auth_signin_title'),
    body: function(el, setError, close){
      el.innerHTML =
        '<div style="display:flex;justify-content:center;margin-bottom:8px">' + brandLogoHTML(40) + '</div>' +
        '<p class="muted small" style="margin:0 0 16px;text-align:center">' + esc(t('auth_subtitle')) + '</p>' +
        (errorMsg ? '<p style="color:var(--critical);background:var(--critical-soft);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:13px">' + esc(errorMsg) + '</p>' : '') +
        (authScreenMode === 'signup_check_email' ?
          '<p style="margin:0 0 16px">' + esc(t('auth_check_email')) + '</p>' +
          '<button type="button" class="btn btn-primary" id="auth-back-to-signin" style="width:100%">' + esc(t('auth_back_to_signin')) + '</button>'
        :
          /* A real <form> (rather than a bare button) means pressing Enter
             in either field submits natively — no per-key listener needed,
             and it works the same whether focus is on email or password. */
          '<form id="auth-form" novalidate>' +
            fieldHTML('auth-email', t('field_email'), '<input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com">') +
            fieldHTML('auth-password', t('field_password'), '<input type="password" id="auth-password" autocomplete="' + (isSignup ? 'new-password' : 'current-password') + '" placeholder="••••••••">') +
            '<div style="display:flex;gap:8px;margin-top:6px">' +
              '<button type="button" class="btn" data-act="auth-cancel" style="flex:1">' + esc(t('cancel_btn')) + '</button>' +
              '<button type="submit" class="btn btn-primary" id="auth-submit-btn" style="flex:1">' + esc(isSignup ? t('auth_signup_btn') : t('auth_signin_btn')) + '</button>' +
            '</div>' +
          '</form>' +
          '<p class="muted small" style="margin:14px 0 0;text-align:center">' +
            (isSignup ? esc(t('auth_have_account')) : esc(t('auth_need_account'))) + ' ' +
            '<button type="button" class="link-btn" id="auth-switch-btn">' + esc(isSignup ? t('auth_switch_to_signin') : t('auth_switch_to_signup')) + '</button>' +
          '</p>'
        );

      var switchBtn = el.querySelector('#auth-switch-btn');
      if(switchBtn) switchBtn.addEventListener('click', function(){
        authScreenMode = isSignup ? 'signin' : 'signup';
        renderAuthScreen();
      });
      var backBtn = el.querySelector('#auth-back-to-signin');
      if(backBtn) backBtn.addEventListener('click', function(){ authScreenMode = 'signin'; renderAuthScreen(); });
      var cancelBtn = el.querySelector('[data-act="auth-cancel"]');
      if(cancelBtn) cancelBtn.addEventListener('click', close);

      var authForm = el.querySelector('#auth-form');
      var submitBtn = el.querySelector('#auth-submit-btn');
      if(authForm) authForm.addEventListener('submit', function(e){
        e.preventDefault();
        var email = (el.querySelector('#auth-email').value || '').trim();
        var password = el.querySelector('#auth-password').value || '';
        if(!email || !password){ renderAuthScreen(t('auth_err_missing_fields')); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = t('auth_working');
        var call = isSignup
          ? sb.auth.signUp({ email: email, password: password })
          : sb.auth.signInWithPassword({ email: email, password: password });
        call.then(function(res){
          if(res.error){ renderAuthScreen(res.error.message); return; }
          if(isSignup && res.data && !res.data.session){
            authScreenMode = 'signup_check_email';
            renderAuthScreen();
          }
          /* On success with a session, onAuthStateChange (registered in
             bootAuth) fires SIGNED_IN, and enterApp() closes this popup. */
        }).catch(function(err){
          renderAuthScreen((err && err.message) || t('auth_err_generic'));
        });
      });
    }
  });
  authModalEntry = modalStack[modalStack.length - 1];
}

/* Auto sign-out after 5 minutes with no activity in the admin area. The
   customer catalog renders in its own <iframe srcdoc> document, so events
   there never bubble up to this document — only real staff activity
   (clicks, typing, scrolling, taps) in the admin UI itself resets the
   clock. A single "last activity" timestamp checked on a slow interval,
   rather than clearing/resetting a timer on every mousemove, keeps this
   cheap regardless of how much the admin is used. */
var INACTIVITY_LIMIT_MS = 5 * 60 * 1000;
var lastActivityAt = Date.now();
function noteActivity(){ lastActivityAt = Date.now(); }
['mousemove','mousedown','keydown','scroll','touchstart','wheel'].forEach(function(evt){
  document.addEventListener(evt, noteActivity, { passive: true });
});
setInterval(function(){
  if(!currentSession) return; /* already signed out — nothing to time out */
  if(Date.now() - lastActivityAt >= INACTIVITY_LIMIT_MS){
    toast(t('toast_inactivity_signout'));
    signOut();
  }
}, 15000);

idth:100%; height:100%; object-fit:cover; object-position:center bottom; display:block;}\n.hero-banner[hidden]{display:none;}\n\n/* intro */\n.intro{padding-block:22px 6px;}\n.intro h1{font-size:26px; margin:0 0 6px;}\n.intro p.lede{margin:0; color:var(--ink-soft); font-size:15px; max-width:60ch;}\n.chip-disclaimer{display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--warn-soft); color:var(--warn); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600;}\n\n.steps{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}\n.step{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:7px 13px 7px 8px; font-size:12.5px; color:var(--ink-soft);}\n.step b{width:20px; height:20px; border-radius:999px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:none;}\n\n/* filters */\n.filterbar{position:sticky; top:calc(58px + env(safe-area-inset-top,0px)); z-index:30; background:var(--bg); padding-block:14px; border-bottom:1px solid var(--border);}\n.filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}\n.search{flex:1 1 220px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:9px 12px;}\n.search svg{width:16px; height:16px; color:var(--ink-faint); flex:none;}\n.search input{border:0; outline:0; background:transparent; color:var(--ink); font-size:14px; width:100%;}\nselect.sel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-s); padding:9px 10px; font-size:13.5px; color:var(--ink);}\n.toggle-avail{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); user-select:none; cursor:pointer;}\n.switch{width:34px; height:20px; border-radius:999px; background:var(--border); position:relative; flex:none; transition:background .15s;}\n.switch::after{content:\"\";position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:999px; background:var(--surface); box-shadow:var(--shadow-1); transition:left .15s;}\n.switch.on{background:var(--accent);}\n.switch.on::after{left:16px;}\n.chips{display:flex; gap:8px; overflow-x:auto; padding-block:10px 2px; margin-top:4px; scrollbar-width:thin;}\n.chip{flex:none; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}\n.chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}\n.result-count{color:var(--ink-faint); font-size:12.5px; margin-top:6px;}\n\n/* grid */\n.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(380px,1fr)); gap:14px; padding-block:20px 20px;}\n.card{cursor:pointer;}\n\n/* FAQ page (reuses .detail-view/.detail-back for the \"back to catalog\" header) */\n.faq-title{font-size:28px; margin:0 0 22px;}\n.faq-list{display:flex; flex-direction:column; gap:12px; margin:0 0 40px; max-width:720px;}\n.faq-item{border:1px solid var(--border); border-radius:14px; background:var(--surface); overflow:hidden;}\n.faq-q{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; background:none; border:0; text-align:left; padding:16px 18px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer;}\n.faq-q:hover{color:var(--accent);}\n.faq-q svg{flex:none; width:18px; height:18px; transition:transform .2s ease; color:var(--ink-faint);}\n.faq-item.open .faq-q svg{transform:rotate(180deg);}\n.faq-a{max-height:0; overflow:hidden; transition:max-height .25s ease;}\n.faq-a p{margin:0; padding:0 18px 16px; font-size:14px; line-height:1.65; color:var(--ink-soft);}\n.faq-item.open .faq-a{max-height:400px;}\n.faq-cta{text-align:center; border-top:1px solid var(--border); max-width:720px; padding-top:32px;}\n.faq-cta h2{margin:0 0 6px; font-size:20px;}\n.faq-cta p{margin:0 0 18px; color:var(--ink-soft); font-size:14px;}\n.faq-cta .btn-primary{max-width:280px; margin:0 auto;}\n\n/* product detail view */\n.detail-view{padding-block:22px 48px;}\n.detail-back{display:inline-flex; align-items:center; gap:8px; background:none; border:0; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; padding:8px 0; margin-bottom:14px;}\n.detail-back svg{width:16px; height:16px;}\n.detail-back:hover{color:var(--accent);}\n.detail-grid{display:grid; grid-template-columns:380px 1fr; gap:32px; align-items:start;}\n@media (max-width:760px){ .detail-grid{grid-template-columns:1fr;} }\n.detail-image-wrap{background:var(--surface); border-radius:var(--radius-l); padding:48px 40px; display:flex; align-items:center; justify-content:center; min-height:320px;}\n.detail-image{max-width:100%; max-height:360px; object-fit:contain; display:block;}\n.detail-info{min-width:0;}\n.detail-title{font-size:26px; margin:6px 0 14px; line-height:1.25;}\n.detail-price-row{margin-bottom:10px;}\n.detail-price-row .price{font-size:26px;}\n.detail-price-row .price-secondary{font-size:14px;}\n.detail-stock-row{margin-bottom:16px;}\n.detail-desc{font-size:14.5px; line-height:1.65; color:var(--ink-soft); max-width:56ch; margin:16px 0 22px;}\n.detail-cta{display:flex; flex-direction:column; gap:10px; max-width:320px;}\n.detail-cta .addbtn, .detail-cta .qtyctl{width:100%;}\n.detail-secondary{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; max-width:420px;}\n.detail-secondary-btn{flex:1 1 170px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px; border-radius:12px; font-size:13.5px; font-weight:700; text-decoration:none; cursor:pointer; white-space:nowrap;}\n.detail-secondary-btn svg{width:15px; height:15px; flex:none;}\n.detail-contact-btn{background:var(--accent); color:var(--accent-ink); border:0;}\n.detail-contact-btn:hover{filter:brig \nvar FX_FALLBACK_RATE = 510; // approx USD->CRC, used only if nothing better is available\nvar FX_CACHE_KEY = 'p506_fx_crc_v1';\nvar FX_MAX_AGE_MS = 24 * 60 * 60 * 1000;\nvar fxRate = null;\n\nfunction loadCachedFxRate(){\n  try{\n    var raw = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || 'null');\n    if(raw && typeof raw.rate === 'number' && raw.rate > 0) return raw;\n  }catch(e){}\n  return null;\n}\nfunction saveCachedFxRate(rate){\n  try{ localStorage.setItem(FX_CACHE_KEY, JSON.stringify({ rate: rate, at: Date.now() })); }catch(e){}\n}\nfunction initFxRate(){\n  var cached = loadCachedFxRate();\n  if(cached){ fxRate = cached.rate; }\n  var isStale = !cached || (Date.now() - cached.at) > FX_MAX_AGE_MS;\n  if(isStale){\n    /* Guard against fetch() itself throwing synchronously (e.g. unavailable\n       or blocked in some environment) -- that happens before .catch() is\n       even attached, and would otherwise abort the rest of init(). */\n    try{\n      fetch('https://open.er-api.com/v6/latest/USD').then(function(res){ return res.json(); }).then(function(data){\n        var rate = data && data.rates && data.rates.CRC;\n        if(typeof rate === 'number' && rate > 0){\n          fxRate = rate;\n          saveCachedFxRate(rate);\n          renderGrid();\n          renderCartDrawer();\n        }\n      }).catch(function(){ /* keep whatever we already have (cached or none) */ });\n    }catch(e){ /* keep whatever we already have (cached or none) */ }\n  }\n}\nfunction crcRate(){ return fxRate || FX_FALLBACK_RATE; }\nfunction fmtCrc(usd){ return '\u20a1' + Math.round(usd * crcRate()).toLocaleString('es-CR'); }\n\nfunction priceHtml(usdPrice){\n  var L = t();\n  if(usdPrice == null) return '<span class=\"price ask\">'+escapeHtml(L.askPrice)+'</span>';\n  var usdStr = fmtMoney(usdPrice, '$');\n  var crcStr = fmtCrc(usdPrice);\n  var primary = STATE.currency === 'crc' ? crcStr : usdStr;\n  var secondary = STATE.currency === 'crc' ? usdStr : crcStr;\n  return '<span class=\"price money\">'+escapeHtml(primary)+'</span><span class=\"price-secondary\">'+escapeHtml(secondary)+'</span>';\n}\nfunction debounce(fn, ms){ var t; return function(){ var a=arguments, c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); }; }\n\nvar raw = JSON.parse(el('app-data').textContent);\nvar STATE = {\n  items: raw.items,\n  settings: raw.settings || {},\n  lang: 'en',\n  currency: 'crc',\n  theme: 'light',\n  cart: {},           // id -> qty\n  filters: { q:'', cat:'ALL', sort:'cat' },\n  isEditor: false,\n  dirty: false,\n  view: 'grid',       // 'grid' | 'detail' | 'faq'\n  detailId: null,\n  promo: { code: '', pct: 0 }\n};\n\ntry {\n  // language is intentionally NOT restored from localStorage -- the site\n  // should always start in English on every visit, even for a returning\n  // visitor who switched to Spanish before. The ES/EN toggle still works\n  // for that page view, it just doesn't stick across reloads.\n  var savedCurrency = localStorage.getItem('p506_currency');\n  if(savedCurrency === 'usd' || savedCurrency === 'crc') STATE.currency = savedCurrency;\n  var savedTheme = localStorage.getItem('p506_theme');\n  if(savedTheme === 'light' || savedTheme === 'dark') STATE.theme = savedTheme;\n  var savedCart = JSON.parse(localStorage.getItem('p506_cart') || '{}');\n  if(savedCart && typeof savedCart === 'object') STATE.cart = savedCart;\n} catch(e){}\n\nvar SAVED_CUST = {};\nvar SAVED_CUST_FIELDS = ['name','email','countryCode','phone','idType','idNumber','province','canton','district','postal','address'];\ntry {\n  SAVED_CUST_FIELDS.forEach(function(f){ SAVED_CUST[f] = localStorage.getItem('p506_cust_' + f) || ''; });\n} catch(e){}\n// Backward-compat with the old, narrower keys used before checkout collected\n// a full shipping address (still read so returning visitors don't lose the\n// name/phone they'd already saved).\ntry {\n  if(!SAVED_CUST.name) SAVED_CUST.name = localStorage.getItem('p506_cust_name') || '';\n  if(!SAVED_CUST.phone) SAVED_CUST.phone = localStorage.getItem('p506_cust_phone') || '';\n} catch(e){}\nfunction saveCustField(field, value){ try{ localStorage.setItem('p506_cust_' + field, value || ''); }catch(e){} }\n\n/* Settings read with a fallback -- lets the promo/shipping numbers below be\n   overridden later from live_data11.json's settings without a code change,\n   while still working out of the box today. */\nfunction getSetting(key, fallback){\n  var v = STATE.settings ? STATE.settings[key] : undefined;\n  return (v===undefined || v===null || v==='') ? fallback : v;\n}\nfunction defaultPromoCodes(){\n  var v = getSetting('promoCodes', null);\n  return v && typeof v === 'object' ? v : { WELCOME10: 10 };\n}\n\n/* Single source of truth for cart math -- used by the drawer render, the\n   WhatsApp/email message, and the Supabase draft order, so the number the\n   customer sees is exactly the number staff sees.\n   \"Deal of the week\": 2+ qualifying (non-water) vials unlocks a whole-order\n   percent discount; every complete group of 4 of the SAME vial earns one\n   extra free unit of that vial on top (not a discount on the 4 itself). A\n   promo code and the deal discount don't stack -- whichever percent is\n   higher applies, to avoid compounding surprises. These thresholds/rates\n   are placeholders (flagged to Pedro) until he confirms real numbers. */\nfunction computeCartTotals(){\n  var ids = Object.keys(STATE.cart);\n  var buyQtyForFree = Number(getSetting('dealBuyQtyForFree', 4)) || 4;\n  var lines = [], bonusLines = [];\n  var subtotal = 0, hasPoa = false, qualifyingQty = 0, freeWaterQty = 0;\n  ids.forEach(function(id){\n    var it = itemById(id); if(!it) return;\n    var qty = STATE.cart[id];\n    var lineTotal = null;\n    if(it.price != null){ lineTotal = it.price * qty; subtotal += lineTotal; } else { hasPoa = true; }\n    lines.push({ it: it, qty: qty, lineTotal: lineTotal });\n    if(!isWaterItem(it)){\n      qualifyingQty += qty;\n      freeWaterQty += qty;\n      var bonusQty = Math.floor(qty / buyQtyForFree);\n      if(bonusQty > 0) bonusLines.push({ it: it, qty: bonusQty });\n    }\n  });\n  var dealMinQty = Number(getSetting('dealMinQtyForDiscount', 2)) || 2;\n  var dealPct = Number(getSetting('dealDiscountPct', 10)) || 0;\n  var dealActive = ids.length > 0 && qualifyingQty >= dealMinQty;\n  var promoPct = (STATE.promo && STATE.promo.pct) || 0;\n  var effectivePct = Math.max(dealActive ? dealPct : 0, promoPct);\n  var usingPromo = promoPct > (dealActive ? dealPct : 0);\n  var discountAmount = subtotal * effectivePct / 100;\n  var discountedSubtotal = subtotal - discountAmount;\n  var shippingFeeUsd = Number(getSetting('shippingFeeUsd', 5)) || 0;\n  var freeShipThreshold = Number(getSetting('freeShippingThresholdUsd', 150)) || 0;\n  var freeShipping = ids.length > 0 && discountedSubtotal >= freeShipThreshold;\n  var shippingFee = (ids.length === 0 || freeShipping) ? 0 : shippingFeeUsd;\n  var total = discountedSubtotal + shippingFee;\n  return {\n    lines: lines, subtotal: subtotal, hasPoa: hasPoa, qualifyingQty: qualifyingQty,\n    freeWaterQty: freeWaterQty, bonusLines: bonusLines,\n    dealActive: dealActive, dealPct: dealPct, dealMinQty: dealMinQty,\n    promoPct: promoPct, usingPromo: usingPromo, effectivePct: effectivePct,\n    discountAmount: discountAmount, discountedSubtotal: discountedSubtotal,\n    shippingFeeUsd: shippingFeeUsd, shippingFee: shippingFee,\n    freeShipping: freeShipping, freeShipThreshold: freeShipThreshold, total: total\n  };\n}\n\n// Public catalog -> Supabase order writer. This uses the project's publishable\n// anon key, which is meant to be embedded client-side; the database only lets\n// this key create a new customer + a new draft order + its line items (see\n// the \"*_public_insert\" RLS policies), nothing else. It never reads any data.\nvar SB_URL = 'https://gjgwqpkfgxgffftlyoge.supabase.co';\nvar SB_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqZ3dxcGtmZ3hnZmZmdGx5b2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDc3NTIsImV4cCI6MjEwMzY4Mzc1Mn0.7DjpK-V4kiB8aAa_Xv_Lw4xnMC--hcsDebtCjL4aPLU';\n\nfunction genOrderNumber(){\n  var d = new Date(), M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n  return 'P506-' + M[d.getMonth()] + ('0'+d.getDate()).slice(-2) + d.getFullYear() + '-' + ('000' + Math.floor(Math.random()*10000)).slice(-4);\n}\nfunction genId(prefix){\n  var h = '';\n  for(var i=0;i<8;i++){ h += Math.floor(Math.random()*16).toString(16); }\n  return prefix + '_' + h;\n}\nfunction todayISO(){\n  var d = new Date();\n  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);\n}\nfunction sbInsert(table, row){\n  return fetch(SB_URL + '/rest/v1/' + table, {\n    method: 'POST',\n    headers: {\n      'apikey': SB_ANON_KEY,\n      'Authorization': 'Bearer ' + SB_ANON_KEY,\n      'Content-Type': 'application/json',\n      'Prefer': 'return=minimal'\n    },\n    body: JSON.stringify(row)\n  }).then(function(res){\n    if(!res.ok){ throw new Error('Supabase insert failed for ' + table + ': ' + res.status); }\n  });\n}\n// Best-effort: writes a draft sales order to Supabase so it shows up in the\n// seller's admin app, waiting for confirmation. Never blocks or fails the\n// WhatsApp/email flow \u2014 that message is the order of record either way.\n// `cust` carries every field collected at checkout (see requireCustomerInfo);\n// the extra shipping/ID fields ride along as customer columns/composed\n// address so staff aren't stuck copying them out of a WhatsApp chat.\nfunction submitOrderToSupabase(cust, orderNo){\n  var custId = genId('cust'), soId = genId('so'), today = todayISO();\n  var totals = computeCartTotals();\n  var lineIds = Object.keys(STATE.cart);\n  var fullPhone = cust.phone ? ('+' + (cust.countryCode||'506') + ' ' + cust.phone) : null;\n  var addressParts = [cust.address, cust.district, cust.canton, cust.province].filter(function(s){ return !!s; });\n  if(cust.postal) addressParts.push('CP ' + cust.postal);\n  var fullAddress = addressParts.length ? addressParts.join(', ') : null;\n  var sym = STATE.settings.currencySymbol || '$';\n  var noteParts = ['Pedido desde el catalogo web'];\n  if(totals.effectivePct > 0){\n    noteParts.push('Descuento: ' + totals.effectivePct + '%' + (totals.usingPromo ? ' (codigo ' + (STATE.promo.code||'') + ')' : ' (oferta de la semana)'));\n  }\n  totals.bonusLines.forEach(function(b){\n    noteParts.push('Bono gratis: ' + b.qty + 'x ' + b.it.name + ' ' + b.it.variant + ' (compra ' + (getSetting('dealBuyQtyForFree',4)) + ', lleva 1 gratis)');\n  });\n  noteParts.push('Envio: ' + (totals.freeShipping ? 'gratis' : fmtMoney(totals.shippingFee, sym)));\n  noteParts.push('Total: ' + fmtMoney(totals.total, sym));\n  return sbInsert('customers', {\n    id: custId, name: cust.name, phone: fullPhone, email: cust.email || null,\n    address: fullAddress, id_type: cust.idType || null, id_number: cust.idNumber || null,\n    created_by: null, created_at: today\n  })\n    .then(function(){\n      return sbInsert('sales_orders', { id: soId, order_number: orderNo || null, discount_pct: Number(totals.effectivePct) || 0, shipping_cost: Number(totals.shippingFee) || 0, customer_id: custId, date: today, status: 'draft', notes: noteParts.join(' | '), created_by: null, created_at: today });\n    })\n    .then(function(){\n      var chain = Promise.resolve();\n      lineIds.forEach(function(id){\n        var it = itemById(id); if(!it) return;\n        var qty = STATE.cart[id];\n        chain = chain.then(function(){\n          return sbInsert('so_line_items', {\n            id: genId('sli'), so_id: soId, variant_id: it.id, qty: qty,\n            unit_price: it.price != null ? it.price : 0, entered_currency: 'USD'\n          });\n        });\n      });\n      totals.bonusLines.forEach(function(b){\n        chain = chain.then(function(){\n          return sbInsert('so_line_items', {\n            id: genId('sli'), so_id: soId, variant_id: b.it.id, qty: b.qty,\n            unit_price: 0, entered_currency: 'USD'\n          });\n        });\n      });\n      return chain;\n    })\n    .catch(function(err){ console.error('order sync to Supabase failed (non-blocking):', err); });\n}\n\nfunction t(){ return I18N[STATE.lang]; }\nfunction catLabel(cat){ var m = t().categories; return (m && m[cat]) || cat; }\n\nfunction saveCart(){ try{ localStorage.setItem('p506_cart', JSON.stringify(STATE.cart)); }catch(e){} }\nfunction saveLang(){ try{ localStorage.setItem('p506_lang', STATE.lang); }catch(e){} }\nfunction saveCurrency(){ try{ localStorage.setItem('p506_currency', STATE.currency); }catch(e){} }\nfunction saveTheme(){ try{ localStorage.setItem('p506_theme', STATE.theme); }catch(e){} }\nfunction applyTheme(){\n  document.documentElement.setAttribute('data-theme', STATE.theme);\n  var lightBtn = el('themeLight'), darkBtn = el('themeDark');\n  if(lightBtn) lightBtn.classList.toggle('active', STATE.theme==='light');\n  if(darkBtn) darkBtn.classList.toggle('active', STATE.theme==='dark');\n}\n\n/* Research-use / age verification gate. \"Remember my choice\" persists the\n   confirmation across visits (localStorage); leaving it unchecked still\n   avoids re-prompting for the rest of this browser tab's session\n   (sessionStorage), which matches how the reference site's checkbox behaves. */\nvar AGE_GATE_KEY = 'p506_age_gate_ok';\nfunction ageGateOk(){\n  try{\n    if(sessionStorage.getItem(AGE_GATE_KEY) === '1') return true;\n    if(localStorage.getItem(AGE_GATE_KEY) === '1') return true;\n  }catch(e){}\n  return false;\n}\nfunction showAgeGate(){\n  if(ageGateOk()) return;\n  var ov = el('ageGateOverlay');\n  if(!ov) return;\n  ov.classList.add('show');\n  document.documentElement.classList.add('agegate-lock');\n}\nfunction hideAgeGate(){\n  var ov = el('ageGateOverlay');\n  if(ov) ov.classList.remove('show');\n  document.documentE \n  var base = ov || sib || {};\n  var stock = Math.max(0, Math.floor(Number(r.stock) || 0));\n  var descEn = base.descEn || r.description || '';\n  var descEs = base.descEs || r.description_es || r.description || '';\n  return {\n    id: r.variant_id,\n    name: r.public_name || base.name || r.product_name,\n    internalName: ((r.public_name || base.name) && (r.public_name || base.name) !== r.product_name) ? r.product_name : base.internalName,\n    category: base.category || r.category || 'Peptides',\n    desc: '',\n    variant: ov ? ov.variant : cleanDoseLabel(r.variant_label),\n    sku: r.sku || (ov && ov.sku) || '',\n    price: r.price_usd == null ? null : Number(r.price_usd),\n    available: stock > 0,\n    stockQty: stock,\n    descEs: descEs,\n    descEn: descEn,\n    image: base.image || '',\n    slug: ov ? ov.slug : undefined\n  };\n}\nfunction loadLiveCatalog(){\n  if(typeof fetch !== 'function') return;\n  var ctrl = (typeof AbortController === 'function') ? new AbortController() : null;\n  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;\n  fetch(SB_URL + '/rest/v1/rpc/public_catalog_v2', {\n    method: 'POST',\n    headers: { 'apikey': SB_ANON_KEY, 'Authorization': 'Bearer ' + SB_ANON_KEY, 'Content-Type': 'application/json' },\n    body: '{}',\n    signal: ctrl ? ctrl.signal : undefined\n  }).then(function(res){\n    if(!res.ok) throw new Error('public_catalog_v2 ' + res.status);\n    return res.json();\n  }).then(function(rows){\n    if(timer) clearTimeout(timer);\n    if(!Array.isArray(rows) || rows.length === 0) return;\n    var byProduct = {};\n    rows.forEach(function(r){ var ov = SNAPSHOT_BY_ID[r.variant_id]; if(ov && !byProduct[r.product_id]) byProduct[r.product_id] = ov; });\n    STATE.items = rows.map(function(r){ return liveRowToItem(r, byProduct); });\n    LIVE_LOADED = true;\n    /* A shared link to a product that only exists live (not in the\n       snapshot) couldn't open at first paint -- open it now. */\n    try{ 'ageGateBody').textContent = AG.body;\n  el('ageGateRememberLabel').textContent = AG.remember;\n  el('ageGateDisagreeLabel').textContent = AG.disagree;\n  el('ageGateAgreeLabel').textContent = AG.agree;\n  el('ageGateLegal').textContent = AG.legal;\n  el('ageGateBlockedSub').textContent = AG.blockedSub;\n  el('ageGateBlockedTitle').textContent = AG.blockedTitle;\n  el('ageGateBlockedBody').textContent = AG.blockedBody;\n  el('ageGateReconsiderLabel').textContent = AG.goBack;\n\n  var sortSel = el('sortSelect');\n  sortSel.innerHTML = '';\n  [['cat',L.sortCat],['name',L.sortName],['price-asc',L.sortPriceAsc],['price-desc',L.sortPriceDesc]].forEach(function(p){\n    var o = document.createElement('option'); o.value=p[0]; o.textContent=p[1]; if(p[0]===STATE.filters.sort) o.selected=true; sortSel.appendChild(o);\n  });\n\n  el('langEs').classList.toggle('active', STATE.lang==='es');\n  el('langEn').classList.toggle('active', STATE.lang==='en');\n  el('ageGateLangEs').classList.toggle('active', STATE.lang==='es');\n  el('ageGateLangEn').classList.toggle('active', STATE.lang==='en');\n  el('currUsd').classList.toggle('active', STATE.currency==='usd');\n  el('currCrc').classList.toggle('active', STATE.currency==='crc');\n\n  var wa = (STATE.settings.whatsapp||'').replace(/[^0-9]/g,'');\n  var waLink = el('footWhatsappLink');\n  if(wa){ waLink.href = 'https://wa.me/' + wa; waLink.textContent = '+' + wa; }\n  else { waLink.href = '#'; waLink.textContent = 'WhatsApp'; }\n}\n\nfunction renderChips(){\n  var wrap = el('categoryChips');\n  var L = t();\n  var cats = getCategories();\n  var html = '<button type=\"button\" class=\"chip'+(STATE.filters.cat==='ALL'?' active':'')+'\" data-cat=\"ALL\">'+escapeHtml(L.allCats)+'</button>';\n  cats.forEach(function(c){\n    html += '<button type=\"button\" class=\"chip'+(STATE.filters.cat===c?' active':'')+'\" data-cat=\"'+escapeHtml(c)+'\">'+escapeHtml(catLabel(c))+'</button>';\n  });\n  wrap.innerHTML = html;\n  wrap.querySelectorAll('
