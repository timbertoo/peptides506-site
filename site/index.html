        '<div class="field"><label><input type="checkbox" id="sp-pref" ' + (existingEntry && existingEntry.isPreferred ? 'checked' : '') + ' style="width:auto;margin-right:6px;vertical-align:middle;"> ' + esc(t('pref_supplier_checkbox_label')) + '</label></div>' +
        '<button type="button" class="link-btn" data-act="newsup" style="margin-bottom:14px;display:inline-block">' + esc(t('add_new_supplier_link')) + '</button>' +
        '<div class="modal-foot">' +
          ((existingEntry && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('remove_price_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save">' + esc(existingEntry ? t('save_btn') : t('add_price_btn')) + '</button>' +
        '</div>';
      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      el.querySelector('[data-act="newsup"]').addEventListener('click', function(){
        close();
        openSupplierModal(null, function(newSup){ openSupplierPriceModal(variant, existingEntry, onDone); });
      });
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        state.supplierProducts = state.supplierProducts.filter(function(sp){ return sp.id !== existingEntry.id; });
        close(); persist(); toast(t('toast_price_removed'));
        if(onDone) onDone();
      });
      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        var supplierId = el.querySelector('#sp-supplier').value;
        var costRaw = el.querySelector('#sp-cost').value;
        if(costRaw === '' || isNaN(Number(costRaw)) || Number(costRaw) < 0){ setError(t('err_valid_cost')); return; }
        var cost = fromDisplayAmount(costRaw);
        var pref = el.querySelector('#sp-pref').checked;
        var entry = existingEntry || catalogEntry(supplierId, variant.id);
        if(entry){
          entry.supplierId = supplierId; entry.unitCost = Number(cost); entry.isPreferred = pref; entry.updatedAt = todayISO();
        } else {
          entry = { id: uid('sp'), supplierId: supplierId, variantId: variant.id, unitCost: Number(cost), isPreferred: pref, updatedAt: todayISO() };
          state.supplierProducts.push(entry);
        }
        if(pref){
          state.supplierProducts.forEach(function(sp){ if(sp.variantId === variant.id && sp.id !== entry.id) sp.isPreferred = false; });
        }
        close(); persist(); toast(t('toast_price_saved'));
        if(onDone) onDone(entry);
      });
    }
  });
}

/* =========================================================================
   MODAL: Import a supplier's catalog from CSV
   ========================================================================= */

/* Minimal RFC4180-ish parser: handles quoted fields with embedded commas,
   newlines, and doubled-quote escaping. Good enough for the price-list
   exports/pastes suppliers actually send. */
function parseCSV(text){
  var rows = [];
  var row = [];
  var field = '';
  var inQuotes = false;
  var i = 0;
  text = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  while(i < text.length){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ inQuotes = true; i++; continue; }
    if(c === ','){ row.push(field); field = ''; i++; continue; }
    if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  row.push(field);
  rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){ return String(c || '').trim() !== ''; }); });
}

/* Matches the first row's headers against known synonyms, case/punctuation
   insensitive, so "Product Name", "product", "Item" etc. all work. */
function detectImportColumns(headerRow){
  var norm = headerRow.map(function(h){ return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); });
  function findCol(candidates){
    for(var i = 0; i < norm.length; i++){ if(candidates.indexOf(norm[i]) !== -1) return i; }
    return -1;
  }
  return {
    product: findCol(['product','productname','name','item','itemname']),
    category: findCol(['category','cat','type']),
    variant: findCol(['variant','dosage','size','dose','option','variantdosage']),
    sku: findCol(['sku','code','codeno','itemcode','productcode']),
    price: findCol(['price','cost','unitcost','priceusd','unitprice','priceperkit','price1kit'])
  };
}

/* Builds a preview of what an import will do without touching state yet:
   each row is matched against existing products/variants (case-insensitive
   name match) and against other rows already seen earlier in the same
   file, and labeled with what will happen on Import. */
function buildImportPreview(rows, supplierId, defaultCategory){
  if(!rows.length) return { items: [] };
  var header = rows[0];
  var cols = detectImportColumns(header);
  var dataRows = rows.slice(1);

  if(cols.price === -1){
    var bestIdx = -1, bestScore = 0;
    header.forEach(function(_, idx){
      if(idx === cols.product || idx === cols.variant || idx === cols.sku || idx === cols.category) return;
      var n = 0, tot = 0;
      dataRows.slice(0, 20).forEach(function(r){
        if(r[idx] === undefined || String(r[idx]).trim() === '') return;
        tot++;
        var v = String(r[idx]).replace(/[^0-9.\-]/g, '');
        if(v !== '' && !isNaN(Number(v))) n++;
      });
      var score = tot ? n / tot : 0;
      if(score > bestScore){ bestScore = score; bestIdx = idx; }
    });
    if(bestScore > 0.5) cols.price = bestIdx;
  }

  var existingProductByName = {};
  state.products.forEach(function(p){ existingProductByName[p.name.trim().toLowerCase()] = p; });
  var seenVariantKeys = {};
  var seenProductKeys = {}; // product names newly introduced earlier in this same file

  var items = dataRows.map(function(r){
    var name = cols.product !== -1 ? String(r[cols.product] || '').trim() : '';
    var variantLabel = cols.variant !== -1 ? String(r[cols.variant] || '').trim() : '';
    var sku = cols.sku !== -1 ? String(r[cols.sku] || '').trim() : '';
    var category = cols.category !== -1 ? String(r[cols.category] || '').trim() : '';
    var priceRaw = cols.price !== -1 ? String(r[cols.price] || '').trim() : '';
    var priceNum = Number(priceRaw.replace(/[^0-9.\-]/g, ''));
    var item = { name: name, variantLabel: variantLabel, sku: sku, category: category || defaultCategory || '', price: priceNum };

    if(!name || !variantLabel || priceRaw === '' || isNaN(priceNum)){ item.status = 'error'; return item; }

    var pKey = name.toLowerCase();
    var vKey = pKey + '||' + variantLabel.toLowerCase();
    var existingProduct = existingProductByName[pKey];
    if(existingProduct){
      var existingVariant = state.variants.find(function(v){ return v.productId === existingProduct.id && v.label.trim().toLowerCase() === variantLabel.toLowerCase(); });
      if(existingVariant && !seenVariantKeys[vKey]){
        item.status = catalogEntry(supplierId, existingVariant.id) ? 'price_update' : 'price_new';
      } else {
        item.status = seenVariantKeys[vKey] ? 'price_new' : 'new_variant';
      }
    } else if(seenProductKeys[pKey]){
      /* This product name was already introduced by an earlier row in the
         same file, so this row adds another variant to it, not a new product. */
      item.status = seenVariantKeys[vKey] ? 'price_new' : 'new_variant';
    } else {
      item.status = seenVariantKeys[vKey] ? 'price_new' : 'new_product';
    }
    seenProductKeys[pKey] = true;
    seenVariantKeys[vKey] = true;
    return item;
  });

  return { cols: cols, items: items };
}

/* Actually writes the previewed rows to state: find-or-create each product
   and variant (reusing ones created earlier in the same import), then
   upsert this supplier's price via the existing ensureCatalogEntry(). */
function applyImport(supplierId, items, importCurrency){
  var productByName = {};
  state.products.forEach(function(p){ productByName[p.name.trim().toLowerCase()] = p; });
  var counts = { count: 0, newProducts: 0, newVariants: 0 };
  var rate = exchangeRate();
  items.forEach(function(item){
    if(item.status === 'error') return;
    var pKey = item.name.trim().toLowerCase();
    var product = productByName[pKey];
    if(!product){
      product = { id: uid('prod'), name: item.name, category: item.category || '', description: '' };
      state.products.push(product);
      productByName[pKey] = product;
      counts.newProducts++;
    } else if(item.category && !product.category){
      product.category = item.category;
    }
    var vKey = item.variantLabel.trim().toLowerCase();
    var variant = state.variants.find(function(v){ return v.productId === product.id && v.label.trim().toLowerCase() === vKey; });
    if(!variant){
      variant = { id: uid('var'), productId: product.id, label: item.variantLabel, sku: item.sku || '' };
      state.variants.push(variant);
      counts.newVariants++;
    } else if(item.sku && !variant.sku){
      variant.sku = item.sku;
    }
    var usdPrice = (importCurrency === 'CRC' && rate) ? (item.price / rate) : item.price;
    ensureCatalogEntry(supplierId, variant.id, usdPrice);
    counts.count++;
  });
  return counts;
}

/* =========================================================================
   MODAL: Purchase Order (create / edit)
   ========================================================================= */

/* Who the stock actually sitting on the shelf for this variant came from
   — the supplier on the most recent RECEIVED purchase order that included
   it. This is deliberately different from "cheapest/preferred catalog
   price": a variant can be priced with several suppliers for comparison
   shopping, but the person selling it wants to know who they actually
   bought the physical stock from, not who's theoretically cheapest. */
function mostRecentReceivedSupplierName(variantId){
  var best = null;
  state.poLineItems.forEach(function(li){
    if(li.variantId !== variantId) return;
    var po = byId(state.purchaseOrders, li.poId);
    if(!po || po.status !== 'received') return;
    if(!best || (po.date || '') >= (best.date || '')) best = po;
  });
  if(!best) return '';
  var sup = byId(state.suppliers, best.supplierId);
  return sup ? sup.name : '';
}

function variantSearchList(supplierIdForPricing, onlyInStock){
  var products = {};
  state.products.forEach(function(p){ products[p.id] = p; });
  var list = [];
  state.variants.forEach(function(v){
    var p = products[v.productId];
    if(!p) return;
    var priceNote = '';
    if(supplierIdForPricing){
      /* On a purchase order, only show what this supplier is actually
         catalogued to sell — everything else would just be a price you'd
         have to add from scratch anyway. (Sales orders pass no supplier
         here, so they still show every product regardless of source.) */
      var entry = catalogEntry(supplierIdForPricing, v.id);
      if(!entry) return;
      priceNote = ' — ' + fmtMoney(entry.unitCost);
    }
    var stock = stockForVariant(v.id);
    /* On a sales order, only offer what's actually available to sell —
       nothing to gain from picking something with zero or negative stock.
       A line that already has this variant selected (editing an order
       placed back when there was stock) isn't affected — this only
       narrows what shows up as a NEW choice in the dropdown. */
    if(onlyInStock && stock <= 0) return;
    /* "The seller" shown here is who the stock on hand actually came from
       (most recent received PO), not a price comparison — see
       mostRecentReceivedSupplierName above. Only shown when not already
       scoped to one supplier (PO context) — showing a different
       supplier's name there would look like a mistake, since every row is
       already that supplier's own. */
    var sellerName = (supplierIdForPricing || isSellerOnly()) ? '' : mostRecentReceivedSupplierName(v.id);
    list.push({ variantId: v.id, productId: p.id, productName: p.name, variantLabel: v.label, priceNote: priceNote,
      sellerName: sellerName, stock: stock });
  });
  var result = sortBy(list, function(x){ return (x.productName + ' ~ ' + x.variantLabel).toLowerCase(); });
  result.emptyMessageKey = supplierIdForPricing ? 'vp_no_supplier_products' : (onlyInStock ? 'vp_no_stock_products' : 'vp_no_matches');
  return result;
}

function variantDisplayLabel(variantId){
  if(!variantId) return '';
  var v = byId(state.variants, variantId);
  if(!v) return '';
  var p = byId(state.products, v.productId);
  return (p ? p.name : '') + ' — ' + v.label;
}

/* Renders the type-to-filter product/variant field used on purchase- and
   sales-order line items, replacing the old plain <select> (which forced
   scrolling through every product). The visible text input is just a
   display/search box; the actual selection lives in the hidden
   .li-variant-value input so callers can keep reading it the same way a
   <select>'s value used to be read. */
function variantPickerHTML(currentVariantId){
  return '<div class="variant-picker">' +
    '<input type="text" class="li-variant-search" autocomplete="off" placeholder="' + esc(t('select_variant_placeholder')) + '" value="' + esc(variantDisplayLabel(currentVariantId)) + '">' +
    '<input type="hidden" class="li-variant-value" value="' + esc(currentVariantId || '') + '">' +
  '</div>';
}

function variantDropdownItemsHTML(list, query){
  if(!list.length) return '<div class="vp-empty">' + esc(t(list.emptyMessageKey || 'vp_no_matches')) + '</div>';
  var q = (query || '').trim().toLowerCase();
  var filtered = !q ? list : list.filter(function(x){
    return (x.productName + ' ' + x.variantLabel).toLowerCase().indexOf(q) !== -1;
  });
  if(!filtered.length) return '<div class="vp-empty">' + esc(t('vp_no_matches')) + '</div>';
  var html = '', lastProduct = null;
  filtered.forEach(function(x){
    if(x.productId !== lastProduct){
      html += '<div class="vp-group-label">' + esc(x.productName) + '</div>';
      lastProduct = x.productId;
    }
    var meta = [];
    if(x.sellerName) meta.push(esc(x.sellerName));
    meta.push(esc(t('stock_label')) + ' ' + x.stock);
    html += '<div class="vp-option" data-variant-id="' + x.variantId + '" data-display="' + esc(x.productName + ' — ' + x.variantLabel) + '">' +
      '<div>' + esc(x.variantLabel) + esc(x.priceNote) + '</div>' +
      '<div class="vp-option-meta' + (x.stock <= 0 ? ' warn' : '') + '">' + meta.join(' · ') + '</div>' +
    '</div>';
  });
  return html;
}

/* Wires up one product/variant search box. Typing filters a floating
   dropdown of matching product+variant combos (grouped by product) built
   fresh from the DOM each time — it deliberately does NOT trigger the
   line's full renderLines() re-render while the person is typing, so the
   field never loses focus or cursor position mid-search. Picking an
   option (click or Enter) is the only thing that reports back to the
   caller via opts.onSelect, matching what the old <select>'s 'change'
   event used to do. */
function attachVariantPicker(wrap, opts){
  var searchInput = wrap.querySelector('.li-variant-search');
  var valueInput = wrap.querySelector('.li-variant-value');
  var list = variantSearchList(opts.supplierIdForPricing, opts.onlyInStock);
  var dropdown = null;
  var activeIndex = -1;

  function closeDropdown(){
    if(dropdown){ dropdown.remove(); dropdown = null; }
    activeIndex = -1;
  }
  function highlight(items){
    items.forEach(function(o, idx){ o.classList.toggle('active', idx === activeIndex); });
    if(items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
  }
  function pick(variantId, display){
    valueInput.value = variantId;
    searchInput.value = display;
    closeDropdown();
    opts.onSelect(variantId);
  }
  function openDropdown(query){
    if(!dropdown){
      dropdown = document.createElement('div');
      dropdown.className = 'variant-picker-dropdown';
      wrap.appendChild(dropdown);
    }
    dropdown.innerHTML = variantDropdownItemsHTML(list, query);
    activeIndex = -1;
    dropdown.querySelectorAll('.vp-option').forEach(function(opt){
      opt.addEventListener('mousedown', function(e){
        e.preventDefault(); /* keep focus in the input so 'blur' doesn't fire first */
        pick(opt.getAttribute('data-variant-id'), opt.getAttribute('data-display'));
      });
    });
  }

  searchInput.addEventListener('focus', function(){
    searchInput.select();
    var currentLabel = variantDisplayLabel(valueInput.value);
    openDropdown(searchInput.value === currentLabel ? '' : searchInput.value);
  });
  searchInput.addEventListener('input', function(){ openDropdown(searchInput.value); });
  searchInput.addEventListener('blur', function(){
    setTimeout(function(){
      closeDropdown();
      searchInput.value = variantDisplayLabel(valueInput.value);
    }, 150);
  });
  searchInput.addEventListener('keydown', function(e){
    if(!dropdown){
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp') openDropdown(searchInput.value);
      return;
    }
    var items = Array.prototype.slice.call(dropdown.querySelectorAll('.vp-option'));
    if(e.key === 'ArrowDown'){ e.preventDefault(); if(items.length){ activeIndex = Math.min(activeIndex + 1, items.length - 1); highlight(items); } }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(items.length){ activeIndex = Math.max(activeIndex - 1, 0); highlight(items); } }
    else if(e.key === 'Enter'){
      e.preventDefault();
      var chosen = items[activeIndex] || items[0];
      if(chosen) pick(chosen.getAttribute('data-variant-id'), chosen.getAttribute('data-display'));
    } else if(e.key === 'Escape'){ closeDropdown(); searchInput.blur(); }
  });
}

function openPOModal(existing, prefill){

     list) — same reasoning as the sales-order customer field: a defaulted
     name in a type-to-search box looks like it was already chosen. A

          });
        }
        function itemsHTML(query){
          var all = supplierList();
          if(!all.length) return '<div class="vp-empty">' + esc(t('vp_no_suppliers')) + '</div>';
          var q = (query || '').trim().toLowerCase();

          if(!filtered.length) return '<div class="vp-empty">' + esc(t('vp_no_matches')) + '</div>';
          return filtered.map(function(x){

        function closeDropdown(){ if(dropdown){ dropdown.remove(); dropdown = null; } activeIndex = -1; }
        function highlight(items){
          items.forEach(function(o, idx){ o.classList.toggle('active', idx === activeIndex); });
          if(items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
        function pick(id, display){
          valueInput.value = id;
          searchInput.value = display;
          closeDropdown();

        function openDropdown(query){

        searchInput.addEventListener('blur', function(){

        });

          });
          row.querySelector('[data-act="rm-line"]').addEventListener('click', function(){
            if(lines.length <= 1){ lines[0] = {variantId:'', qty:1, unitCost:'', discountType:'amount', discountValue:0}; } else { lines.splice(i,1); }
            renderLines();
          });
        });
        lineWrap.querySelector('[data-act="add-line"]').addEventListener('click', function(){
          lines.push({variantId:'', qty:1, unitCost:'', discountType:'amount', discountValue:0});
          renderLines();
        });
        lineWrap.querySelector('[data-act="new-product"]').addEventListener('click', function(){
          openProductModal(null, {supplierId: supplierId}, function(rec, variantIds, autoVariant, autoPrice){
            var vId = autoVariant || variantIds[0];
            var emptyIdx = lines.findIndex(function(l){ return !l.variantId; });
            var newLine = { variantId: vId, qty: 1, unitCost: autoPrice !== null ? autoPrice : (catalogEntry(supplierId, vId) ? catalogEntry(supplierId, vId).unitCost : ''), discountType: 'amount', discountValue: 0 };
            if(emptyIdx !== -1) lines[emptyIdx] = newLine; else lines.push(newLine);
            renderLines();
          });
        });
        updateGrandTotal();
      }
      function syncTotal(){
        var totalEl = lineWrap.querySelector('.display');
        if(totalEl) totalEl.textContent = t('subtotal_label') + ' ' + fmtMoney(lineSubtotalUSD());
        lineWrap.querySelectorAll('tbody tr').forEach(function(row){
          var i = Number(row.getAttribute('data-i'));
          row.querySelector('.li-total').textContent = fmtMoney(poLineNetTotal(lines[i]));
          var hintEl = row.querySelector('.li-hint');
          if(hintEl && lines[i].variantId){
            var perKit = unitsPerPurchaseForVariant(lines[i].variantId);
            hintEl.textContent = tf('po_kit_hint', { vials: (Number(lines[i].qty)||0) * perKit, perKit: perKit });
          }
        });
        updateGrandTotal();
      }
      function lineSubtotalUSD(){
        return lines.reduce(function(s,l){ return s + poLineNetTotal(l); },0);
      }
      function discountAmountUSD(){
        var sub = lineSubtotalUSD();
        if(discountType === 'percent') return sub * ((Number(discountValue)||0) / 100);
        return Number(discountValue) || 0;
      }
      function grandTotalUSD(){
        return lineSubtotalUSD() - discountAmountUSD()
          + (Number(shippingCost)||0) + (Number(wireTransferCost)||0) + (Number(transportationCost)||0);
      }
      function updateGrandTotal(){
        var g = el.querySelector('#po-grand-total');
        if(g) g.textContent = t('total_label') + ' ' + fmtMoney(grandTotalUSD());
        var dh = el.querySelector('#po-discount-hint');
        if(dh) dh.textContent = discountAmountUSD() > 0 ? tf('po_discount_hint', { amount: fmtMoney(discountAmountUSD()) }) : '';
      }

      el.innerHTML =
        (existing ? recordAttributionHTML(existing) : '') +
        (state.suppliers.length ?
          '<div class="field-row">' +
            fieldHTML('po-supplier', t('field_supplier'), supplierPickerHTML(supplierId)) +
            fieldHTML('po-date', t('field_order_date'), '<input type="date" id="po-date" value="' + esc(date) + '">') +
          '</div>' +
          '<div class="field-row">' +
            fieldHTML('po-status', t('field_status'), '<select id="po-status">' + statusOptions() + '</select>') +
            '<div class="field"><label>&nbsp;</label><button type="button" class="link-btn" data-act="new-supplier">' + esc(t('new_supplier_link')) + '</button></div>' +
          '</div>'
        : '<p class="muted">' + esc(t('add_supplier_first')) + '</p><button type="button" class="btn btn-primary" data-act="new-supplier">' + esc(t('new_supplier_link')) + '</button>') +
        '<div id="line-wrap"></div>' +
        fieldHTML('po-discount', t('field_discount'),
          '<div style="display:flex;gap:6px">' +
            '<select id="po-discount-type" style="flex:0 0 130px">' +
              '<option value="amount"' + (discountType === 'amount' ? ' selected' : '') + '>' + esc(t('discount_type_amount')) + '</option>' +
              '<option value="percent"' + (discountType === 'percent' ? ' selected' : '') + '>' + esc(t('discount_type_percent')) + '</option>' +
            '</select>' +
            '<input type="number" id="po-discount-value" class="num" min="0" step="0.01" value="' + esc(discountValue ? (discountType === 'percent' ? discountValue : inputAmount(discountValue)) : '') + '" style="flex:1">' +
          '</div>',
          '<span id="po-discount-hint"></span>') +
        '<div class="field-row">' +
          fieldHTML('po-shipping', t('field_shipping'), '<input type="number" id="po-shipping" class="num" min="0" step="0.01" value="' + esc(shippingCost ? inputAmount(shippingCost) : '') + '">') +
          fieldHTML('po-wire', t('field_wire_transfer_cost'), '<input type="number" id="po-wire" class="num" min="0" step="0.01" value="' + esc(wireTransferCost ? inputAmount(wireTransferCost) : '') + '">') +
        '</div>' +
        fieldHTML('po-transport', t('field_transportation_cost'), '<input type="number" id="po-transport" class="num" min="0" step="0.01" value="' + esc(transportationCost ? inputAmount(transportationCost) : '') + '">') +
        '<div class="display" id="po-grand-total" style="font-size:16px;font-weight:600;margin:-6px 0 16px;text-align:right">' + esc(t('total_label')) + ' ' + fmtMoney(grandTotalUSD()) + '</div>' +
        '<div class="field"><label>' + esc(t('shipping_details_label')) + '</label></div>' +
        '<div class="field-row">' +
          fieldHTML('po-carrier', t('field_carrier'), '<input type="text" id="po-carrier" placeholder="' + esc(t('carrier_placeholder')) + '" value="' + esc(carrier) + '">') +
          fieldHTML('po-shipmethod', t('field_shipping_method'), '<input type="text" id="po-shipmethod" placeholder="' + esc(t('shipping_method_placeholder')) + '" value="' + esc(shippingMethod) + '">') +
        '</div>' +
        '<div class="field-row">' +
          fieldHTML('po-tracking', t('field_tracking_number'), '<input type="text" id="po-tracking" placeholder="' + esc(t('tracking_placeholder')) + '" value="' + esc(trackingNumber) + '">') +
          fieldHTML('po-eta', t('field_estimated_delivery'), '<input type="date" id="po-eta" value="' + esc(estimatedDelivery) + '">') +
        '</div>' +
        fieldHTML('po-notes', t('field_notes'), '<textarea id="po-notes">' + esc(notes) + '</textarea>') +
        '<div class="modal-foot">' +
          ((existing && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('delete_order_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save"' + (state.suppliers.length ? '' : ' disabled') + '>' + esc(existing ? t('save_changes_btn') : t('create_order_btn')) + '</button>' +
        '</div>';

      var lineWrap = el.querySelector('#line-wrap');
      if(state.suppliers.length) renderLines();
      var supPickerWrap = el.querySelector('#po-supplier');
      if(supPickerWrap) attachSupplierPicker(supPickerWrap.closest('.variant-picker'));
      var shipInput = el.querySelector('#po-shipping');
      if(shipInput) shipInput.addEventListener('input', function(e){
        shippingCost = e.target.value === '' ? 0 : fromDisplayAmount(e.target.value);
        updateGrandTotal();
      });
      var wireInput = el.querySelector('#po-wire');
      if(wireInput) wireInput.addEventListener('input', function(e){
        wireTransferCost = e.target.value === '' ? 0 : fromDisplayAmount(e.target.value);
        updateGrandTotal();
      });
      var transportInput = el.querySelector('#po-transport');
      if(transportInput) transportInput.addEventListener('input', function(e){
        transportationCost = e.target.value === '' ? 0 : fromDisplayAmount(e.target.value);
        updateGrandTotal();
      });
      var discountTypeSel = el.querySelector('#po-discount-type');
      var discountValueInput = el.querySelector('#po-discount-value');
      if(discountTypeSel) discountTypeSel.addEventListener('change', function(){
        /* A number typed as one type doesn't mean anything as the other
           (10 meaning $10 vs. 10 meaning 10%) — clear it on switch so
           nothing gets silently misapplied. */
        discountType = discountTypeSel.value === 'percent' ? 'percent' : 'amount';
        discountValue = 0;
        if(discountValueInput) discountValueInput.value = '';
        updateGrandTotal();
      });
      if(discountValueInput) discountValueInput.addEventListener('input', function(e){
        discountValue = e.target.value === '' ? 0 : (discountType === 'percent' ? Number(e.target.value) : fromDisplayAmount(e.target.value));
        updateGrandTotal();
      });

      var newSupBtn = el.querySelector('[data-act="new-supplier"]');
      if(newSupBtn) newSupBtn.addEventListener('click', function(){
        openSupplierModal(null, function(rec){
          supplierId = rec.id;
          var input = el.querySelector('#po-supplier');
          if(input){
            /* Patch the existing form in place so any line items already
               entered are preserved — do NOT close/reopen this modal. */
            input.value = rec.name;
            input.closest('.variant-picker').querySelector('.po-supplier-value').value = rec.id;
            renderLines();
          } else {
            /* This was the very first supplier (empty-state form had no
               fields yet to preserve) — a fresh render is safe here. */
            close(); openPOModal(existing);
          }
        });
      });

      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        state.purchaseOrders = state.purchaseOrders.filter(function(p){ return p.id !== existing.id; });
        state.poLineItems = state.poLineItems.filter(function(li){ return li.poId !== existing.id; });
        close(); persist(); toast(t('toast_po_deleted'));
      });

      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        if(!supplierId){ setError(t('err_select_supplier')); return; }
        var validLines = lines.filter(function(l){ return l.variantId && Number(l.qty) > 0; });
        if(!validLines.length){ setError(t('err_add_line_qty')); return; }
        var newStatus = el.querySelector('#po-status').value;
        var rec = existing || { id: uid('po') };
        rec.supplierId = supplierId;
        rec.date = el.querySelector('#po-date').value || todayISO();
        rec.status = newStatus;
        rec.notes = el.querySelector('#po-notes').value.trim();
        rec.shippingCost = Number(shippingCost) || 0;
        rec.wireTransferCost = Number(wireTransferCost) || 0;
        rec.transportationCost = Number(transportationCost) || 0;
        rec.discountType = discountType === 'percent' ? 'percent' : 'amount';
        rec.discountValue = Number(discountValue) || 0;
        rec.carrier = el.querySelector('#po-carrier').value.trim();
        rec.shippingMethod = el.querySelector('#po-shipmethod').value.trim();
        rec.trackingNumber = el.querySelector('#po-tracking').value.trim();
        rec.estimatedDelivery = el.querySelector('#po-eta').value || '';
        stampRecord(rec, !existing);
        if(!existing) state.purchaseOrders.push(rec);

        /* Reuse each surviving line's own id (matched by variant) instead of
           regenerating every po_line_items id on every save. Internal Use
           sales orders now record which specific PO line their vial came
           from (so_line_item_allocations, keyed by po_line_item_id) — if a
           routine edit like fixing a tracking number silently swapped every
           line's id, that FK would cascade-delete and silently erase real
           batch-cost history. A line whose variant is no longer on the
           order still disappears (and so, correctly, does any stock
           allocated against it) — only an unrelated edit is now safe. */
        var previousPOLines = state.poLineItems.filter(function(li){ return li.poId === rec.id; }).slice();
        var newPOLineItems = validLines.map(function(l){
          var matchIdx = previousPOLines.findIndex(function(pli){ return pli.variantId === l.variantId; });
          var lineId = matchIdx !== -1 ? previousPOLines.splice(matchIdx, 1)[0].id : uid('poli');
          if(Number(l.unitCost) >= 0 && l.unitCost !== ''){
            ensureCatalogEntry(supplierId, l.variantId, Number(l.unitCost));
          }
          return { id: lineId, poId: rec.id, variantId: l.variantId, qty: Number(l.qty), unitCost: Number(l.unitCost)||0,
            discountType: l.discountType === 'percent' ? 'percent' : 'amount', discountValue: Number(l.discountValue)||0 };
        });
        state.poLineItems = state.poLineItems.filter(function(li){ return li.poId !== rec.id; }).concat(newPOLineItems);

        if(!existing && prefill){ currentTab = 'purchases'; sessionStorage.setItem('manifest_tab', 'purchases'); }
        close(); persist();
        toast(existing ? t('toast_po_updated') : t('toast_po_created'));
      });
    }
  });
}

/* =========================================================================
   MODAL: Sales Order (create / edit)
   ========================================================================= */

function openSOModal(existing){
  /* Deliberately empty for a new order (not defaulted to the first customer
     in the list) — with the old <select> defaulting to the first entry was
     invisible, but the new type-to-search field shows that default name as
     if it were already chosen, which reads as a bug ("why does Melissa show
     up when I didn't pick her"). Existing orders still show their real
     customer, unaffected. */
  var customerId = existing ? existing.customerId : '';
  var lines = existing
    ? state.soLineItems.filter(function(li){ return li.soId === existing.id; }).map(function(li){
        return { variantId: li.variantId, qty: li.qty, unitPrice: li.unitPrice,
          _priceCurrency: li.enteredCurrency === 'CRC' ? 'CRC' : 'USD',
          _crcRaw: li.enteredCurrency === 'CRC' && li.enteredAmountCrc != null ? String(li.enteredAmountCrc) : '' };
      })
    : [{variantId:'', qty:1, unitPrice:''}];
  var status = existing ? existing.status : 'draft';
  var date = existing ? existing.date : todayISO();
  var notes = existing ? existing.notes : '';
  var shippingCost = existing ? (Number(existing.shippingCost)||0) : 0;
  var discountPct = existing ? (Number(existing.discountPct)||0) : 0;
  var carrier = existing ? (existing.carrier || '') : '';
  var shippingMethod = existing ? (existing.shippingMethod || '') : '';
  var trackingNumber = existing ? (existing.trackingNumber || '') : '';
  var estimatedDelivery = existing ? (existing.estimatedDelivery || '') : '';

  pushModal({
    title: existing ? t('so_modal_edit_title') : t('so_modal_new_title'),
    wide: true,
    body: function(el, setError, close){
      var fxTimers = {};
      function currentOrderDate(){
        var input = el.querySelector('#so-date');
        return (input && input.value) || date || todayISO();
      }
      /* Colones-per-US$1 rate used to show Subtotal/Total in both
         currencies — always the order's OWN date, looked up the same way
         a colones line-item price is (cached forever once fetched). Starts
         from whatever's already cached so the very first render can show
         both currencies immediately, then confirms/refreshes in the
         background; falls back to the manual Settings rate if the lookup
         has no key configured or fails. */
      var orderRate = { date: currentOrderDate(), rate: fxCachedRate(currentOrderDate()) };
      function refreshSubtotalDisplay(){
        var totalEl = lineWrap && lineWrap.querySelector('.display');
        if(totalEl) totalEl.textContent = t('subtotal_label') + ' ' + fmtMoneyBoth(lines.reduce(function(s,l){ return s + (Number(l.qty)||0)*(Number(l.unitPrice)||0); },0), orderRate.rate);
      }
      function ensureOrderRate(){
        var d = currentOrderDate();
        var cached = fxCachedRate(d);
        if(cached){
          orderRate = { date: d, rate: cached };
          updateGrandTotal(); refreshSubtotalDisplay();
          return;
        }
        fetchHistoricalRate(d).then(function(rate){
          if(currentOrderDate() !== d) return; /* date moved on again before this resolved */
          orderRate = { date: d, rate: rate };
          updateGrandTotal(); refreshSubtotalDisplay();
        }).catch(function(){
          if(currentOrderDate() !== d) return;
          orderRate = { date: d, rate: exchangeRate() };
          updateGrandTotal(); refreshSubtotalDisplay();
        });
      }
      function setFxHint(i, text){
        var row = lineWrap.querySelector('tr[data-i="' + i + '"]');
        var hintEl = row && row.querySelector('.price-fx-hint');
        if(hintEl) hintEl.textContent = text || '';
      }
      function convertLineNow(i){
        if(!lines[i] || lines[i]._priceCurrency !== 'CRC') return;
        var raw = lines[i]._crcRaw;
        if(raw === '' || raw === undefined || raw === null || isNaN(Number(raw))) return;
        var dateVal = currentOrderDate();
        setFxHint(i, t('fx_loading_hint'));
        fetchHistoricalRate(dateVal).then(function(rate){
          if(!lines[i] || lines[i]._priceCurrency !== 'CRC') return;
          var usd = Number(raw) / rate;
          lines[i].unitPrice = usd;
          setFxHint(i, tf('fx_rate_hint', { usd: fmtMoney(usd), rate: rate.toLocaleString(undefined,{maximumFractionDigits:2}), date: dateVal }));
          syncTotal();
        }).catch(function(err){
          setFxHint(i, (err && err.code === 'no_key') ? t('fx_no_key_hint') : t('fx_error_hint'));
        });
      }
      /* Type-to-filter customer field, same interaction pattern as the
         product/variant picker used on order line items (attachVariantPicker)
         — a text box with a floating dropdown of matches, backed by a hidden
         value input, instead of a plain <select> that forces scrolling
         through every customer. */
      function customerDisplayLabel(id){
        if(!id) return '';
        var c = byId(state.customers, id);
        return c ? c.name : '';
      }
      function customerPickerHTML(id){
        return '<div class="variant-picker">' +
          '<input type="text" id="so-customer" class="so-customer-search" autocomplete="off" placeholder="' + esc(t('select_customer_placeholder')) + '" value="' + esc(customerDisplayLabel(id)) + '">' +
          '<input type="hidden" class="so-customer-value" value="' + esc(id || '') + '">' +
        '</div>';
      }
      function attachCustomerPicker(wrap){
        var searchInput = wrap.querySelector('.so-customer-search');
        var valueInput = wrap.querySelector('.so-customer-value');
        var dropdown = null;
        var activeIndex = -1;
        function customerList(){
          return sortBy(state.customers, function(c){ return c.name.toLowerCase(); }).map(function(c){
            return { id: c.id, name: c.name, meta: c.phone || c.email || '' };
          });
        }
        function itemsHTML(query){
          var all = customerList();
          if(!all.length) return '<div class="vp-empty">' + esc(t('vp_no_customers')) + '</div>';
          var q = (query || '').trim().toLowerCase();
          var filtered = !q ? all : all.filter(function(x){ return x.name.toLowerCase().indexOf(q) !== -1; });
          if(!filtered.length) return '<div class="vp-empty">' + esc(t('vp_no_matches')) + '</div>';
          return filtered.map(function(x){
            return '<div class="vp-option" data-customer-id="' + x.id + '" data-display="' + esc(x.name) + '">' +
              '<div>' + esc(x.name) + '</div>' +
              (x.meta ? '<div class="vp-option-meta">' + esc(x.meta) + '</div>' : '') +
            '</div>';
          }).join('');
        }
        function closeDropdown(){ if(dropdown){ dropdown.remove(); dropdown = null; } activeIndex = -1; }
        function highlight(items){
          items.forEach(function(o, idx){ o.classList.toggle('active', idx === activeIndex); });
          if(items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
        function pick(id, display){
          valueInput.value = id;
          searchInput.value = display;
          closeDropdown();
          customerId = id;
        }
        function openDropdown(query){
          if(!dropdown){ dropdown = document.createElement('div'); dropdown.className = 'variant-picker-dropdown'; wrap.appendChild(dropdown); }
          dropdown.innerHTML = itemsHTML(query);
          activeIndex = -1;
          dropdown.querySelectorAll('.vp-option').forEach(function(opt){
            opt.addEventListener('mousedown', function(e){
              e.preventDefault();
              pick(opt.getAttribute('data-customer-id'), opt.getAttribute('data-display'));
            });
          });
        }
        searchInput.addEventListener('focus', function(){
          searchInput.select();
          var currentLabel = customerDisplayLabel(valueInput.value);
          openDropdown(searchInput.value === currentLabel ? '' : searchInput.value);
        });
        searchInput.addEventListener('input', function(){ openDropdown(searchInput.value); });
        searchInput.addEventListener('blur', function(){
          setTimeout(function(){ closeDropdown(); searchInput.value = customerDisplayLabel(valueInput.value); }, 150);
        });
        searchInput.addEventListener('keydown', function(e){
          if(!dropdown){ if(e.key === 'ArrowDown' || e.key === 'ArrowUp') openDropdown(searchInput.value); return; }
          var items = Array.prototype.slice.call(dropdown.querySelectorAll('.vp-option'));
          if(e.key === 'ArrowDown'){ e.preventDefault(); if(items.length){ activeIndex = Math.min(activeIndex + 1, items.length - 1); highlight(items); } }
          else if(e.key === 'ArrowUp'){ e.preventDefault(); if(items.length){ activeIndex = Math.max(activeIndex - 1, 0); highlight(items); } }
          else if(e.key === 'Enter'){
            e.preventDefault();
            var chosen = items[activeIndex] || items[0];
            if(chosen) pick(chosen.getAttribute('data-customer-id'), chosen.getAttribute('data-display'));
          } else if(e.key === 'Escape'){ closeDropdown(); searchInput.blur(); }
        });
      }
      function statusOptions(){
        return ['draft','completed','cancelled'].map(function(s){
          return '<option value="' + s + '"' + (s===status?' selected':'') + '>' + esc(t('status_' + s)) + '</option>';
        }).join('');
      }
      function renderLines(){
        var rowsHTML = '<table class="lineitem-table"><thead><tr><th style="width:44%">' + esc(t('col_product_variant')) + '</th><th style="width:10%">' + esc(t('col_qty')) + '</th><th style="width:16%">' + esc(t('col_unit_price')) + '</th>' +
          '<th style="width:14%">' + esc(t('col_line_total')) + '</th><th></th></tr></thead><tbody>' +
          lines.map(function(l, i){
            var lineTotal = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
            var stock = l.variantId ? stockForVariant(l.variantId) : null;
            var priceCurrency = l._priceCurrency === 'CRC' ? 'CRC' : 'USD';
            var priceVal = priceCurrency === 'CRC'
              ? esc(l._crcRaw == null ? '' : l._crcRaw)
              : esc(l.unitPrice === '' ? '' : inputAmount(l.unitPrice));
            return '<tr data-i="' + i + '">' +
              '<td>' + variantPickerHTML(l.variantId) +
              (stock !== null ? '<div class="li-hint' + (Number(l.qty) > stock ? ' warn' : '') + '">' + esc(t('in_stock_label')) + ' ' + stock + (Number(l.qty) > stock ? esc(t('not_enough_on_hand')) : '') + '</div>' : '') +
              '</td>' +
              '<td><input type="number" class="qty" min="0" step="1" value="' + esc(l.qty) + '"></td>' +
              '<td>' +
                '<div style="display:flex;gap:4px;align-items:flex-start">' +
                  '<select class="price-currency" style="flex:0 0 44px;width:44px;padding:6px 2px;text-align:center">' +
                    '<option value="USD"' + (priceCurrency==='USD'?' selected':'') + '>' + esc(t('price_currency_usd')) + '</option>' +
                    '<option value="CRC"' + (priceCurrency==='CRC'?' selected':'') + '>' + esc(t('price_currency_crc')) + '</option>' +
                  '</select>' +
                  '<input type="number" class="price" min="0" step="0.01" value="' + priceVal + '" style="flex:1;width:auto">' +
                '</div>' +
                '<div class="li-hint price-fx-hint">' + (priceCurrency === 'CRC' && l.unitPrice !== '' && l.unitPrice != null ? esc(tf('fx_saved_hint', { usd: fmtMoney(l.unitPrice) })) : '') + '</div>' +
              '</td>' +
              '<td class="li-total num">' + fmtMoney(lineTotal) + '</td>' +
              '<td><button type="button" class="li-remove" data-act="rm-line" data-i="' + i + '">✕</button></td>' +
            '</tr>';
          }).join('') + '</tbody></table>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div><button type="button" class="link-btn" data-act="add-line">' + esc(t('add_line_btn')) + '</button></div>' +
          '<div class="display" style="font-size:15px">' + esc(t('subtotal_label')) + ' ' + fmtMoneyBoth(lines.reduce(function(s,l){ return s + (Number(l.qty)||0)*(Number(l.unitPrice)||0); },0), orderRate.rate) + '</div>' +
          '</div>';
        lineWrap.innerHTML = rowsHTML;
        lineWrap.querySelectorAll('tbody tr').forEach(function(row){
          var i = Number(row.getAttribute('data-i'));
          attachVariantPicker(row.querySelector('.variant-picker'), {
            supplierIdForPricing: null,
            onlyInStock: true,
            onSelect: function(variantId){
              lines[i].variantId = variantId;
              renderLines();
            }
          });
          row.querySelector('.qty').addEventListener('input', function(e){ lines[i].qty = e.target.value; renderLines(); });
          var currSel = row.querySelector('.price-currency');
          currSel.addEventListener('change', function(){
            /* A number typed in one currency doesn't mean anything in the
               other — clear it on switch rather than silently reinterpret
               it (same reasoning as the PO discount type toggle). */
            lines[i]._priceCurrency = currSel.value === 'CRC' ? 'CRC' : 'USD';
            lines[i]._crcRaw = '';
            if(lines[i]._priceCurrency === 'CRC') lines[i].unitPrice = '';
            renderLines();
          });
          row.querySelector('.price').addEventListener('input', function(e){
            if(lines[i]._priceCurrency === 'CRC'){
              lines[i]._crcRaw = e.target.value;
              lines[i].unitPrice = '';
              syncTotal();
              setFxHint(i, '');
              if(fxTimers[i]) clearTimeout(fxTimers[i]);
              fxTimers[i] = setTimeout(function(){ convertLineNow(i); }, 700);
            } else {
              lines[i].unitPrice = e.target.value === '' ? '' : fromDisplayAmount(e.target.value);
              syncTotal();
            }
          });
          row.querySelector('.price').addEventListener('blur', function(){
            if(lines[i]._priceCurrency === 'CRC'){
              if(fxTimers[i]) clearTimeout(fxTimers[i]);
              convertLineNow(i);
            }
          });
          row.querySelector('[data-act="rm-line"]').addEventListener('click', function(){
            if(lines.length <= 1){ lines[0] = {variantId:'', qty:1, unitPrice:''}; } else { lines.splice(i,1); }
            renderLines();
          });
        });
        lineWrap.querySelector('[data-act="add-line"]').addEventListener('click', function(){
          lines.push({variantId:'', qty:1, unitPrice:''});
          renderLines();
        });
        updateGrandTotal();
      }
      function syncTotal(){
        var totalEl = lineWrap.querySelector('.display');
        if(totalEl) totalEl.textContent = t('subtotal_label') + ' ' + fmtMoneyBoth(lines.reduce(function(s,l){ return s + (Number(l.qty)||0)*(Number(l.unitPrice)||0); },0), orderRate.rate);
        lineWrap.querySelectorAll('tbody tr').forEach(function(row){
          var i = Number(row.getAttribute('data-i'));
          row.querySelector('.li-total').textContent = fmtMoney((Number(lines[i].qty)||0)*(Number(lines[i].unitPrice)||0));
        });
        updateGrandTotal();
      }
      function linesSubtotalUSD(){
        return lines.reduce(function(s,l){ return s + (Number(l.qty)||0)*(Number(l.unitPrice)||0); },0);
      }
      function discountUSD(){
        var pct = Math.min(100, Math.max(0, Number(discountPct)||0));
        return linesSubtotalUSD() * pct / 100;
      }
      function grandTotalUSD(){
        return linesSubtotalUSD() - discountUSD() + (Number(shippingCost)||0);
      }
      function updateGrandTotal(){
        var d = el.querySelector('#so-discount-line');
        if(d){
          var amt = discountUSD();
          d.hidden = !(amt > 0);
          d.textContent = t('so_discount_line') + ' (' + (Number(discountPct)||0) + '%): -' + fmtMoneyBoth(amt, orderRate.rate);
        }
        var g = el.querySelector('#so-grand-total');
        if(g) g.textContent = t('total_label') + ' ' + fmtMoneyBoth(grandTotalUSD(), orderRate.rate);
      }

      el.innerHTML =
        (existing && existing.orderNumber ? '<p style="margin:-6px 0 8px;font-weight:700">' + esc(t('so_col_number')) + ' ' + esc(existing.orderNumber) + '</p>' : '') +
        (existing ? recordAttributionHTML(existing) : '') +
        (state.customers.length ?
          '<div class="field-row">' +
            fieldHTML('so-customer', t('so_col_customer'), customerPickerHTML(customerId)) +
            fieldHTML('so-date', t('field_sale_date'), '<input type="date" id="so-date" value="' + esc(date) + '">') +
          '</div>' +
          '<div class="field-row">' +
            fieldHTML('so-status', t('field_status'), '<select id="so-status">' + statusOptions() + '</select>') +
            '<div class="field"><label>&nbsp;</label><button type="button" class="link-btn" data-act="new-customer">' + esc(t('new_customer_link')) + '</button></div>' +
          '</div>'
        : '<p class="muted">' + esc(t('add_customer_first')) + '</p><button type="button" class="btn btn-primary" data-act="new-customer">' + esc(t('new_customer_link')) + '</button>') +
        '<div id="line-wrap"></div>' +
        '<div class="field-row">' +
          fieldHTML('so-discount', t('field_discount_pct'), '<input type="number" id="so-discount" class="num" min="0" max="100" step="0.01" placeholder="0" value="' + esc(discountPct ? String(discountPct) : '') + '">') +
          fieldHTML('so-shipping', t('field_shipping'), '<input type="number" id="so-shipping" class="num" min="0" step="0.01" value="' + esc(shippingCost ? inputAmount(shippingCost) : '') + '">') +
        '</div>' +
        '<div class="display" id="so-discount-line" style="font-size:14px;color:#1c8a4b;margin:-6px 0 4px;text-align:right" hidden></div>' +
        '<div class="display" id="so-grand-total" style="font-size:16px;font-weight:600;margin:0 0 16px;text-align:right"></div>' +
        '<div class="field"><label>' + esc(t('shipping_details_label')) + '</label></div>' +
        '<div class="field-row">' +
          fieldHTML('so-carrier', t('field_carrier'), '<input type="text" id="so-carrier" placeholder="' + esc(t('carrier_placeholder')) + '" value="' + esc(carrier) + '">') +
          fieldHTML('so-shipmethod', t('field_shipping_method'), '<input type="text" id="so-shipmethod" placeholder="' + esc(t('shipping_method_placeholder')) + '" value="' + esc(shippingMethod) + '">') +
        '</div>' +
        '<div class="field-row">' +
          fieldHTML('so-tracking', t('field_tracking_number'), '<input type="text" id="so-tracking" placeholder="' + esc(t('tracking_placeholder')) + '" value="' + esc(trackingNumber) + '">') +
          fieldHTML('so-eta', t('field_estimated_delivery'), '<input type="date" id="so-eta" value="' + esc(estimatedDelivery) + '">') +
        '</div>' +
        fieldHTML('so-notes', t('field_notes'), '<textarea id="so-notes">' + esc(notes) + '</textarea>') +
        '<div class="modal-foot">' +
          ((existing && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('delete_order_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save"' + (state.customers.length ? '' : ' disabled') + '>' + esc(existing ? t('save_changes_btn') : t('create_order_btn')) + '</button>' +
        '</div>';

      var lineWrap = el.querySelector('#line-wrap');
      if(state.customers.length) renderLines();
      var cusPickerWrap = el.querySelector('#so-customer');
      if(cusPickerWrap) attachCustomerPicker(cusPickerWrap.closest('.variant-picker'));
      ensureOrderRate();
      var shipInput = el.querySelector('#so-shipping');
      if(shipInput) shipInput.addEventListener('input', function(e){
        shippingCost = e.target.value === '' ? 0 : fromDisplayAmount(e.target.value);
        updateGrandTotal();
      });
      var discInput = el.querySelector('#so-discount');
      if(discInput) discInput.addEventListener('input', function(e){
        var v = e.target.value === '' ? 0 : Number(e.target.value);
        discountPct = isFinite(v) ? Math.min(100, Math.max(0, v)) : 0;
        updateGrandTotal();
      });
      updateGrandTotal();
      var soDateInput = el.querySelector('#so-date');
      if(soDateInput) soDateInput.addEventListener('change', function(){
        /* Changing the order date changes which day's rate applies — redo
           the conversion for any line still entered in colones, and
           refresh the Subtotal/Total dual-currency rate to match. */
        lines.forEach(function(l, i){ if(l._priceCurrency === 'CRC' && l._crcRaw) convertLineNow(i); });
        ensureOrderRate();
      });
      var statusSelect = el.querySelector('#so-status');
      if(statusSelect) statusSelect.addEventListener('change', function(){
        status = statusSelect.value;
      });

      var newCusBtn = el.querySelector('[data-act="new-customer"]');
      if(newCusBtn) newCusBtn.addEventListener('click', function(){
        openCustomerModal(null, function(rec){
          customerId = rec.id;
          var input = el.querySelector('#so-customer');
          if(input){
            /* Patch in place — preserve any line items already entered. */
            input.value = rec.name;
            input.closest('.variant-picker').querySelector('.so-customer-value').value = rec.id;
          } else {
            close(); openSOModal(existing);
          }
        });
      });

      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        var removedLineIds = state.soLineItems.filter(function(li){ return li.soId === existing.id; }).map(function(li){ return li.id; });
        state.salesOrders = state.salesOrders.filter(function(s){ return s.id !== existing.id; });
        state.soLineItems = state.soLineItems.filter(function(li){ return li.soId !== existing.id; });
        state.soLineItemAllocations = state.soLineItemAllocations.filter(function(a){ return removedLineIds.indexOf(a.soLineItemId) === -1; });
        close(); persist(); toast(t('toast_so_deleted'));
      });

      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        if(!customerId){ setError(t('err_select_customer')); return; }
        var validLines = lines.filter(function(l){ return l.variantId && Number(l.qty) > 0; });
        if(!validLines.length){ setError(t('err_add_line_qty')); return; }
        if(validLines.some(function(l){ return l._priceCurrency === 'CRC' && (l.unitPrice === '' || l.unitPrice == null); })){
          setError(t('err_price_conversion_pending')); return;
        }
        var newStatus = el.querySelector('#so-status').value;
        var rec = existing || { id: uid('so') };
        rec.orderKind = 'sale';
        rec.usedBy = null;
        rec.customerId = customerId;
        rec.date = el.querySelector('#so-date').value || todayISO();
        rec.status = newStatus;
        rec.notes = el.querySelector('#so-notes').value.trim();
        rec.shippingCost = Number(shippingCost) || 0;
        rec.discountPct = Math.min(100, Math.max(0, Number(discountPct) || 0));
        rec.carrier = el.querySelector('#so-carrier').value.trim();
        rec.shippingMethod = el.querySelector('#so-shipmethod').value.trim();
        rec.trackingNumber = el.querySelector('#so-tracking').value.trim();
        rec.estimatedDelivery = el.querySelector('#so-eta').value || '';
        stampRecord(rec, !existing);
        if(!existing) state.salesOrders.push(rec);

        /* A stock-deducting status needs its vials attributed to real PO
           batches — oldest received batch first, same as physically pulling
           from the oldest box. Draft/Cancelled don't touch stock at all, so
           they get no allocations. */
        var deductsStock = (newStatus === 'completed');
        var oldLineIds = state.soLineItems.filter(function(li){ return li.soId === rec.id; }).map(function(li){ return li.id; });
        var newLineItems = validLines.map(function(l){
          return { id: uid('soli'), soId: rec.id, variantId: l.variantId, qty: Number(l.qty), unitPrice: Number(l.unitPrice)||0,
            enteredCurrency: l._priceCurrency === 'CRC' ? 'CRC' : 'USD',
            enteredAmountCrc: (l._priceCurrency === 'CRC' && l._crcRaw !== '' && l._crcRaw != null) ? Number(l._crcRaw) : null,
            sourcePoId: null, sourceCostUsd: null };
        });
        state.soLineItems = state.soLineItems.filter(function(li){ return li.soId !== rec.id; }).concat(newLineItems);
        state.soLineItemAllocations = state.soLineItemAllocations.filter(function(a){ return oldLineIds.indexOf(a.soLineItemId) === -1; });
        if(deductsStock){
          var workingRemaining = {};
          newLineItems.forEach(function(li, idx){
            var l = validLines[idx];
            allocateFIFOForVariant(l.variantId, Number(l.qty), workingRemaining).forEach(function(pick){
              state.soLineItemAllocations.push({ id: uid('soalloc'), soLineItemId: li.id, poLineItemId: pick.poLineItemId, qty: pick.qty });
            });
          });
        }

        close(); persist();
        toast(existing ? t('toast_so_updated') : t('toast_so_created'));
      });
    }
  });
}

/* =========================================================================
   MODAL: Internal Use (stock a staff member used themselves — testing,
   samples, personal use — recorded at its real landed cost rather than a
   sale price. Shares the sales_orders/so_line_items tables with regular
   sales (order_kind='internal_use'), but has no customer, no price/
   shipping fields, and picks its stock from a specific PO batch by hand
   instead of FIFO, since the whole point is knowing exactly what batch
   the cost came from.
   ========================================================================= */
function openInternalUseModal(existing){
  var usedBy = existing ? (existing.usedBy || '') : (currentUserName || '');
  var lines = existing
    ? state.soLineItems.filter(function(li){ return li.soId === existing.id; }).map(function(li){
        return { variantId: li.variantId, qty: li.qty,
          sourcePoId: li.sourcePoId || null, sourceCostUsd: li.sourceCostUsd != null ? li.sourceCostUsd : null };
      })
    : [{variantId:'', qty:1, sourcePoId:null, sourceCostUsd:null}];
  var status = existing ? (existing.status === 'cancelled' ? 'cancelled' : 'completed') : 'completed';
  var date = existing ? existing.date : todayISO();
  var notes = existing ? existing.notes : '';

  pushModal({
    title: existing ? t('iu_modal_edit_title') : t('iu_modal_new_title'),
    wide: true,
    body: function(el, setError, close){
      function statusOptions(){
        return [
          { v: 'completed', label: t('status_active') },
          { v: 'cancelled', label: t('status_cancelled') }
        ].map(function(o){
          return '<option value="' + o.v + '"' + (o.v===status?' selected':'') + '>' + esc(o.label) + '</option>';
        }).join('');
      }
      /* Every received PO that actually stocked this variant, as <option>s
         — most recent first, each labeled with its date/supplier and its
         own landed cost/vial so Pedro can tell batches apart. */
      function sourcePoOptionsHTML(l){
        if(!l.variantId) return '<option value="">' + esc(t('source_po_select_variant_first')) + '</option>';
        var matches = receivedPOLinesForVariant(l.variantId);
        if(!matches.length) return '<option value="">' + esc(t('source_po_none_available')) + '</option>';
        var html = '<option value="">' + esc(t('source_po_placeholder')) + '</option>';
        matches.forEach(function(m){
          var supplier = byId(state.suppliers, m.po.supplierId);
          var remaining = remainingForPOLine(m.li.id);
          var label = fmtDate(m.po.date) + ' · ' + (supplier ? supplier.name : '') + ' · ' + fmtMoney(m.costPerUnit) + '/vial · ' + tf('source_po_remaining_hint', { remaining: remaining });
          html += '<option value="' + esc(m.po.id) + '"' + (l.sourcePoId === m.po.id ? ' selected' : '') + '>' + esc(label) + '</option>';
        });
        return html;
      }
      /* Remaining count for whichever PO line a line's own Source PO
         selection actually points at — used for the over-the-batch warning
         under the picker (same soft, non-blocking style as the existing
         not-enough-on-hand stock hint). */
      function remainingForLineSelection(l){
        if(!l.sourcePoId || !l.variantId) return null;
        var poLi = state.poLineItems.find(function(x){ return x.poId === l.sourcePoId && x.variantId === l.variantId; });
        return poLi ? remainingForPOLine(poLi.id) : null;
      }
      function grandTotalUSD(){
        return lines.reduce(function(s,l){ return s + (Number(l.qty)||0) * (Number(l.sourceCostUsd)||0); },0);
      }
      function updateGrandTotal(){
        var g = el.querySelector('#iu-grand-total');
        if(g) g.textContent = t('iu_cost_label') + ' ' + fmtMoney(grandTotalUSD());
      }
      function renderLines(){
        var rowsHTML = '<table class="lineitem-table"><thead><tr><th style="width:34%">' + esc(t('col_product_variant')) + '</th><th style="width:10%">' + esc(t('col_qty')) + '</th><th style="width:32%">' + esc(t('col_source_po')) + '</th>' +
          '<th style="width:14%">' + esc(t('col_line_cost')) + '</th><th></th></tr></thead><tbody>' +
          lines.map(function(l, i){
            var lineCost = (Number(l.qty)||0) * (Number(l.sourceCostUsd)||0);
            var stock = l.variantId ? stockForVariant(l.variantId) : null;
            return '<tr data-i="' + i + '">' +
              '<td>' + variantPickerHTML(l.variantId) +
              (stock !== null ? '<div class="li-hint' + (Number(l.qty) > stock ? ' warn' : '') + '">' + esc(t('in_stock_label')) + ' ' + stock + (Number(l.qty) > stock ? esc(t('not_enough_on_hand')) : '') + '</div>' : '') +
              '</td>' +
              '<td><input type="number" class="qty" min="0" step="1" value="' + esc(l.qty) + '"></td>' +
              '<td><select class="source-po">' + sourcePoOptionsHTML(l) + '</select>' +
                (l.sourcePoId && l.sourceCostUsd != null ? '<div class="li-hint">' + esc(tf('source_po_cost_hint', { cost: fmtMoney(l.sourceCostUsd) })) + '</div>' : '') +
                (function(){
                  var rem = remainingForLineSelection(l);
                  return (rem !== null && Number(l.qty) > rem) ? '<div class="li-hint warn">' + esc(tf('source_po_over_batch_hint', { remaining: rem })) + '</div>' : '';
                })() +
              '</td>' +
              '<td class="li-total num">' + fmtMoney(lineCost) + '</td>' +
              '<td><button type="button" class="li-remove" data-act="rm-line" data-i="' + i + '">✕</button></td>' +
            '</tr>';
          }).join('') + '</tbody></table>' +
          '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div><button type="button" class="link-btn" data-act="add-line">' + esc(t('add_line_btn')) + '</button></div>' +
          '</div>';
        lineWrap.innerHTML = rowsHTML;
        lineWrap.querySelectorAll('tbody tr').forEach(function(row){
          var i = Number(row.getAttribute('data-i'));
          attachVariantPicker(row.querySelector('.variant-picker'), {
            supplierIdForPricing: null,
            onlyInStock: true,
            onSelect: function(variantId){
              lines[i].variantId = variantId;
              /* A source PO chosen for the old product means nothing once
                 the line points at a different one. */
              lines[i].sourcePoId = null; lines[i].sourceCostUsd = null;
              renderLines();
            }
          });
          row.querySelector('.qty').addEventListener('input', function(e){ lines[i].qty = e.target.value; renderLines(); });
          row.querySelector('.source-po').addEventListener('change', function(e){
            var poId = e.target.value || null;
            lines[i].sourcePoId = poId;
            if(poId){
              var po = byId(state.purchaseOrders, poId);
              var poLi = state.poLineItems.find(function(x){ return x.poId === poId && x.variantId === lines[i].variantId; });
              lines[i].sourceCostUsd = (po && poLi) ? poLandedCostPerUnit(po, poLi) : null;
            } else {
              lines[i].sourceCostUsd = null;
            }
            renderLines();
          });
          row.querySelector('[data-act="rm-line"]').addEventListener('click', function(){
            if(lines.length <= 1){ lines[0] = {variantId:'', qty:1, sourcePoId:null, sourceCostUsd:null}; } else { lines.splice(i,1); }
            renderLines();
          });
        });
        lineWrap.querySelector('[data-act="add-line"]').addEventListener('click', function(){
          lines.push({variantId:'', qty:1, sourcePoId:null, sourceCostUsd:null});
          renderLines();
        });
        updateGrandTotal();
      }

      el.innerHTML =
        (existing ? recordAttributionHTML(existing) : '') +
        '<div class="field-row">' +
          fieldHTML('iu-used-by', t('field_used_by'), '<input type="text" id="iu-used-by" value="' + esc(usedBy) + '">') +
          fieldHTML('iu-date', t('field_sale_date'), '<input type="date" id="iu-date" value="' + esc(date) + '">') +
        '</div>' +
        '<div class="field-row">' +
          fieldHTML('iu-status', t('field_status'), '<select id="iu-status">' + statusOptions() + '</select>') +
        '</div>' +
        '<div id="line-wrap"></div>' +
        '<div class="display" id="iu-grand-total" style="font-size:16px;font-weight:600;margin:-6px 0 16px;text-align:right">' + esc(t('iu_cost_label')) + ' ' + fmtMoney(0) + '</div>' +
        fieldHTML('iu-notes', t('field_notes'), '<textarea id="iu-notes">' + esc(notes) + '</textarea>') +
        '<div class="modal-foot">' +
          ((existing && isAdmin) ? '<button class="btn btn-danger" data-act="del">' + esc(t('delete_order_btn')) + '</button>' : '') +
          '<div style="flex:1"></div>' +
          '<button class="btn" data-act="cancel">' + esc(t('cancel_btn')) + '</button>' +
          '<button class="btn btn-primary" data-act="save">' + esc(existing ? t('save_changes_btn') : t('create_order_btn')) + '</button>' +
        '</div>';

      var lineWrap = el.querySelector('#line-wrap');
      renderLines();

      el.querySelector('[data-act="cancel"]').addEventListener('click', close);
      var delBtn = el.querySelector('[data-act="del"]');
      if(delBtn) delBtn.addEventListener('click', function(){
        var removedLineIds = state.soLineItems.filter(function(li){ return li.soId === existing.id; }).map(function(li){ return li.id; });
        state.salesOrders = state.salesOrders.filter(function(s){ return s.id !== existing.id; });
        state.soLineItems = state.soLineItems.filter(function(li){ return li.soId !== existing.id; });
        state.soLineItemAllocations = state.soLineItemAllocations.filter(function(a){ return removedLineIds.indexOf(a.soLineItemId) === -1; });
        close(); persist(); toast(t('toast_iu_deleted'));
      });

      el.querySelector('[data-act="save"]').addEventListener('click', function(){
        var usedByVal = el.querySelector('#iu-used-by').value.trim();
        if(!usedByVal){ setError(t('err_enter_used_by')); return; }
        var validLines = lines.filter(function(l){ return l.variantId && Number(l.qty) > 0; });
        if(!validLines.length){ setError(t('err_add_line_qty')); return; }
        var newStatus = el.querySelector('#iu-status').value === 'cancelled' ? 'cancelled' : 'completed';
        var rec = existing || { id: uid('so') };
        rec.orderKind = 'internal_use';
        rec.usedBy = usedByVal;
        rec.customerId = null;
        rec.date = el.querySelector('#iu-date').value || todayISO();
        rec.status = newStatus;
        rec.notes = el.querySelector('#iu-notes').value.trim();
        rec.shippingCost = 0; rec.carrier = ''; rec.shippingMethod = ''; rec.trackingNumber = ''; rec.estimatedDelivery = '';
        stampRecord(rec, !existing);
        if(!existing) state.salesOrders.push(rec);

        var deductsStock = (newStatus === 'completed');
        var oldLineIds = state.soLineItems.filter(function(li){ return li.soId === rec.id; }).map(function(li){ return li.id; });
        var newLineItems = validLines.map(function(l){
          return { id: uid('soli'), soId: rec.id, variantId: l.variantId, qty: Number(l.qty), unitPrice: 0,
            enteredCurrency: 'USD', enteredAmountCrc: null,
            sourcePoId: l.sourcePoId || null,
            sourceCostUsd: l.sourceCostUsd != null ? Number(l.sourceCostUsd) : null };
        });
        state.soLineItems = state.soLineItems.filter(function(li){ return li.soId !== rec.id; }).concat(newLineItems);
        state.soLineItemAllocations = state.soLineItemAllocations.filter(function(a){ return oldLineIds.indexOf(a.soLineItemId) === -1; });
        if(deductsStock){
          newLineItems.forEach(function(li, idx){
            var l = validLines[idx];
            if(l.sourcePoId){
              var poLi = state.poLineItems.find(function(x){ return x.poId === l.sourcePoId && x.variantId === l.variantId; });
              if(poLi) state.soLineItemAllocations.push({ id: uid('soalloc'), soLineItemId: li.id, poLineItemId: poLi.id, qty: Number(l.qty) });
            }
          });
        }

        close(); persist();
        toast(existing ? t('toast_iu_updated') : t('toast_iu_created'));
      });
    }
  });
}

/* When theme is 'system', reflect the OS preference so one segment still
   shows as active rather than leaving the toggle looking unset. */
function effectiveTheme(){
  if(theme === 'light' || theme === 'dark') return theme;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e){ return 'light'; }
}

function renderSidebar(){

    {id:'dashboard', label:t('tab_dashboard')},
    {id:'suppliers', label:t('tab_suppliers')},
    {id:'customers', label:t('tab_customers')},
    {id:'products', label:t('tab_products')},
    {id:'instock', label:t('tab_instock')},
    {id:'purchases', label:t('tab_purchases')},
    {id:'sales', label:t('tab_sales')},
    {id:'internal_use', label:t('tab_internal_use')}
  ];
  if(isSellerOnly()){
    /* Internal Use depends on purchase-order data (the Source PO picker),
       which RLS hides from sellers entirely — same reasoning as hiding
       Suppliers/Purchases from this role. */
    tabs = tabs.filter(function(tab){ return tab.id !== 'suppliers' && tab.id !== 'purchases' && tab.id !== 'internal_use'; });

    return '<button class="navlink' + (currentTab===tab.id?' active':'') + '" data-tab="' + tab.id + '">' + ICONS[tab.id] + '<span>' + esc(tab.label) + '</span></button>';

function lowStockVariants(){
  return state.variants.map(function(v){ return {variant:v, stock: stockForVariant(v.id)}; })
    .filter(function(r){ return r.stock <= 0; });
}

function inStockVariants(){
  var rows = state.variants.map(function(v){ return {variant:v, stock: stockForVariant(v.id)}; })
    .filter(function(r){ return r.stock > 0; });
  /* Lowest stock first, so anything close to running out surfaces at the
     top of the (scrollable) list instead of getting buried. */
  return sortBy(rows, function(r){ return r.stock; });
}

     Sales" panel, same as they're now excluded from the Sales Orders page. */
  var recentSOs = sortBy(state.salesOrders.filter(function(s){ return s.orderKind !== 'internal_use'; }), function(s){ return s.date; }).reverse().slice(0,5);

  var html = '<div class="view-header"><div><h1>' + esc(t('dash_title')) + '</h1><div class="sub">' + esc(t('dash_sub')) + '</div></div></div>';

  html += '<div class="grid stat-row">' +
    (sellerOnly ? '' : '<div class="stat-card"><div class="label">' + esc(t('stat_suppliers')) + '</div><div class="value">' + state.suppliers.length + '</div></div>') +

    '<div class="stat-card"><div class="label">' + esc(t('stat_variants')) + '</div><div class="value">' + state.variants.length + '</div></div>' +

    '<div class="stat-card"><div class="label">' + esc(t('stat_out_of_stock')) + '</div><div class="value' + (lowStock.length?' critical':'') + '">' + lowStock.length + '</div></div>' +
  '</div>';

  html += '<div class="two-col">';

  html += '<div>';
  if(!sellerOnly){
    html += '<div class="panel"><h2>' + esc(t('panel_recent_po')) + '</h2><div class="panel-sub">' + esc(t('panel_recent_po_sub')) + '</div>' + renderMiniOrderTable(recentPOs, 'po') + '</div>';

  if(!inStock.length){
    html += '<p class="muted small">' + esc(t('nothing_in_stock')) + '</p>';
  } else {
    html += '<div class="price-list" style="max-height:280px;overflow-y:auto">' + inStock.map(function(r){
      var chipClass = r.stock < 5 ? 'warn' : 'good';
      return '<div class="price-row"><span class="p-supplier">' + esc(variantDisplay(r.variant)) + '</span><span class="chip ' + chipClass + '">' + r.stock + '</span></div>';
    }).join('') + '</div>';

  html += '<div class="panel" style="flex:1;min-width:220px">' +
    '<h2>' + esc(t('panel_out_of_stock')) + '</h2><div class="panel-sub">' + esc(t('panel_out_of_stock_sub')) + '</div>';
  if(!lowStock.length){
    html += '<p class="muted small">' + esc(t('nothing_out_of_stock')) + '</p>';
  } else {
    html += '<div class="price-list" style="max-height:280px;overflow-y:auto">' + lowStock.map(function(r){
      return '<div class="price-row"><span class="p-supplier">' + esc(variantDisplay(r.variant)) + '</span><span class="chip critical">' + r.stock + '</span></div>';
    }).join('') + '</div>';
